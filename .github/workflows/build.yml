# Rede de seguranca: se alguem editar src/index.html e esquecer de rodar
# `npm run build`, esta Action compila e commita o index.html da raiz.
# A Hostinger publica a raiz direto do GitHub (sem build), entao o index.html
# commitado precisa estar sempre em dia com o src/.
name: build

on:
  push:
    branches: [main]
    paths: ['src/**', 'build.mjs', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commita o index.html compilado (se mudou)
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ja estava em dia"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: index.html compilado a partir de src/"
          git pull --rebase origin main
          git push origin HEAD:main
