/* =====================================================================
   UPCOMING SCHEDULES LIST (admin) — lista detalhada de próximas escalas
   com quem está em vídeo, foto, storys etc + ideias
===================================================================== */
const UpcomingSchedulesList = ({ events, signups, volunteers, onOpenEvent, onNotifyEvent, showPast = false }) => {
  const today = YYYYMMDD(new Date());
  // Se showPast: mostra também as anteriores (mais recentes primeiro entre passadas + futuras primeiro)
  const upcoming = (showPast
      ? [...events].sort((a, b) => b.date.localeCompare(a.date))
      : events.filter(e => e.date >= today).sort((a, b) => a.date.localeCompare(b.date))
    ).slice(0, 20);

  const heading = showPast ? 'Todas as escalas' : 'Próximas escalas';

  if (upcoming.length === 0) {
    return (
      <div className="mm-card rounded-2xl backdrop-blur-xl bg-zinc-950/60 p-6">
        <h3 className="font-serif text-lg text-zinc-50 mb-2 flex items-center gap-2">
          <Calendar className="w-4 h-4 text-brand-200" /> {heading}
        </h3>
        <EmptyState icon={Calendar} title={showPast ? 'Nenhuma escala registrada' : 'Nenhuma escala futura'} description="Crie um evento no calendário acima." />
      </div>
    );
  }

  const fmtDate = (d) => {
    const dt = new Date(d + 'T00:00:00');
    return {
      day: dt.getDate().toString().padStart(2, '0'),
      weekday: dt.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', ''),
      month: dt.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''),
      full: dt.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' }),
    };
  };

  const daysUntil = (d) => {
    const now = new Date(); now.setHours(0,0,0,0);
    const dt = new Date(d + 'T00:00:00');
    return Math.round((dt - now) / (1000 * 60 * 60 * 24));
  };

  return (
    <div className="space-y-4">
      <div className="flex items-baseline justify-between">
        <div>
          <div className="mm-eyebrow mb-1">Agenda</div>
          <h3 className="mm-display text-2xl text-zinc-50">{heading}</h3>
        </div>
        <span className="text-xs text-zinc-500">{upcoming.length} evento{upcoming.length !== 1 ? 's' : ''}</span>
      </div>

      <div className="space-y-4">
        {upcoming.map(ev => {
          const evSignups = signups.filter(s => s.eventId === ev.id);
          const areasNeeded = ev.areasNeeded || [];
          const totalConfirmed = evSignups.filter(s => s.status === 'confirmado').length;
          const totalSlots = areasNeeded.length;
          const pct = totalSlots > 0 ? Math.round((totalConfirmed / totalSlots) * 100) : 0;
          const d = fmtDate(ev.date);
          const du = daysUntil(ev.date);
          const isToday = du === 0;
          const isTomorrow = du === 1;
          const isSoon = du > 1 && du <= 3;
          const isPast = du < 0;

          return (
            <div key={ev.id} className={`mm-lux ${isToday ? 'mm-lux-hoje' : ''} ${isPast ? 'opacity-60' : ''} p-5 sm:p-6`}>
              {/* Header: data + título + status */}
              <div className="flex items-start gap-4">
                <div className={`flex-shrink-0 w-[58px] rounded-2xl border text-center py-2.5 ${isToday ? 'border-brand-400/45 bg-brand-500/12' : 'border-white/10 bg-white/[0.03]'}`}>
                  <div className={`text-[9px] uppercase tracking-[0.15em] ${isToday ? 'text-brand-200/90' : 'text-zinc-500'}`}>{d.weekday}</div>
                  <div className={`mm-display text-[28px] leading-none mt-1 ${isToday ? 'mm-brand-text' : 'text-zinc-50'}`}>{d.day}</div>
                  <div className={`text-[9px] uppercase tracking-[0.15em] mt-1 ${isToday ? 'text-brand-200/70' : 'text-zinc-500'}`}>{d.month}</div>
                </div>

                <div className="min-w-0 flex-1">
                  <div className="flex items-center gap-2 flex-wrap">
                    <h4 className="mm-display text-xl text-zinc-50 truncate">{ev.title}</h4>
                    {isPast && <span className="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-zinc-500/15 border border-zinc-500/30 text-zinc-400 font-semibold">Passada</span>}
                    {isToday && <span className="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full mm-brand-grad on-accent font-bold">Hoje</span>}
                    {isTomorrow && <span className="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-fuchsia-500/20 border border-fuchsia-400/40 text-fuchsia-100 font-semibold">Amanhã</span>}
                    {isSoon && <span className="text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-sky-500/15 border border-sky-400/30 text-sky-100 font-semibold">Em {du} dias</span>}
                    {ev.isTraining && (
                      <span className="inline-flex items-center gap-1 text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-400/40 text-emerald-500 font-bold">
                        <Sparkles className="w-3 h-3" /> Treinamento · Etapa {ev.trainingStage}
                      </span>
                    )}
                    {!ev.isTraining && Number(ev.minRating || 0) > 0 && (
                      <span className="inline-flex items-center gap-1 text-[9px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-brand-500/15 border border-brand-400/40 text-brand-500 font-bold">
                        Nota mín {Number(ev.minRating).toFixed(1)}
                      </span>
                    )}
                  </div>
                  <p className="text-[13px] text-zinc-400 mt-1 capitalize">{d.full}</p>

                  {/* Barra de preenchimento do time */}
                  <div className="flex items-center gap-3 mt-3 max-w-[280px]">
                    <div className="flex-1 h-1.5 rounded-full bg-white/8 overflow-hidden">
                      <div className={`h-full rounded-full ${pct === 100 ? 'bg-emerald-400' : 'mm-brand-grad'}`} style={{ width: `${pct}%` }} />
                    </div>
                    <span className={`text-[11px] font-semibold tabular-nums ${pct === 100 ? 'text-emerald-300' : 'text-zinc-300'}`}>{totalConfirmed}/{totalSlots}</span>
                  </div>
                </div>

                <button
                  onClick={() => onOpenEvent(ev)}
                  className="flex-shrink-0 text-xs font-medium px-3.5 py-2 rounded-xl border border-white/12 bg-white/[0.03] text-zinc-200 hover:bg-white/[0.08] hover:border-white/25 transition-all"
                >
                  Gerenciar
                </button>
              </div>

              {/* Ideia do evento */}
              {ev.contentIdea && (
                <div className="mt-4 flex items-start gap-2.5 rounded-xl border border-fuchsia-400/15 bg-fuchsia-500/[0.05] px-3.5 py-2.5">
                  <Sparkles className="w-4 h-4 text-fuchsia-200 flex-shrink-0 mt-0.5" />
                  <div className="min-w-0">
                    <div className="mm-eyebrow text-fuchsia-200/90 mb-0.5">Ideia do dia</div>
                    <p className="text-sm text-zinc-100 whitespace-pre-line leading-relaxed">{ev.contentIdea}</p>
                  </div>
                </div>
              )}

              {/* Call sheet — uma linha por área, fácil de ver quem está escalado */}
              {areasNeeded.length === 0 ? (
                <p className="text-xs text-zinc-500 italic mt-4">Nenhuma área definida.</p>
              ) : (
                <div className="mt-4 rounded-2xl border border-white/8 bg-black/20 divide-y divide-white/[0.06] overflow-hidden">
                  {areasNeeded.map(a => {
                    const meta = AREA_META[a]; if (!meta) return null;
                    const Ic = meta.icon;
                    const areaSignups = evSignups.filter(s => s.area === a);
                    const confirmed = areaSignups.find(s => s.status === 'confirmado');
                    const proposed = areaSignups.filter(s => s.status === 'proposto');
                    const volConfirmed = confirmed ? volunteers.find(v => v.id === confirmed.volunteerId) : null;
                    const propVols = proposed.map(s => ({ s, v: volunteers.find(v => v.id === s.volunteerId) })).filter(x => x.v);

                    return (
                      <div key={a} className="flex items-center gap-3 px-3.5 py-3">
                        {/* Área */}
                        <div className={`flex items-center gap-2 w-[104px] flex-shrink-0 ${meta.text}`}>
                          <div className={`w-7 h-7 rounded-lg border ${meta.border} bg-gradient-to-br ${meta.color} flex items-center justify-center flex-shrink-0`}>
                            <Ic className="w-3.5 h-3.5" />
                          </div>
                          <span className="text-[13px] font-medium truncate">{meta.label}</span>
                        </div>

                        {/* Quem está escalado */}
                        <div className="min-w-0 flex-1">
                          {volConfirmed ? (
                            <div className="flex items-center gap-2">
                              <div style={avaStyle(volConfirmed.name)} className="w-7 h-7 rounded-full mm-ava flex items-center justify-center text-xs flex-shrink-0">
                                {(volConfirmed.name[0] || '?').toUpperCase()}
                              </div>
                              <div className="min-w-0">
                                <div className="text-sm text-zinc-50 truncate leading-tight">{volConfirmed.name}</div>
                                {confirmed.volunteerIdea && <div className="text-[11px] text-zinc-400 italic truncate">"{confirmed.volunteerIdea}"</div>}
                              </div>
                            </div>
                          ) : propVols.length > 0 ? (
                            <div className="flex items-center gap-1.5 flex-wrap">
                              {propVols.slice(0, 3).map(({ s, v }) => (
                                <span key={s.id} className="inline-flex items-center gap-1.5 rounded-full bg-white/[0.05] border border-white/10 pl-1 pr-2.5 py-0.5">
                                  <span className="w-5 h-5 rounded-full bg-sky-500/25 border border-sky-400/40 flex items-center justify-center text-sky-100 text-[10px] font-semibold">{(v.name[0] || '?').toUpperCase()}</span>
                                  <span className="text-[12px] text-zinc-100 truncate max-w-[110px]">{v.name}</span>
                                </span>
                              ))}
                              {propVols.length > 3 && <span className="text-[11px] text-zinc-400">+{propVols.length - 3}</span>}
                            </div>
                          ) : (
                            <span className="text-[13px] text-zinc-500 italic">— vaga em aberto —</span>
                          )}
                        </div>

                        {/* Status */}
                        <div className="flex-shrink-0">
                          {confirmed ? (
                            <span className="inline-flex items-center gap-1 text-[10px] uppercase tracking-wider px-2 py-1 rounded-full bg-emerald-500/15 border border-emerald-400/30 text-emerald-200 font-semibold"><Check className="w-3 h-3" /> Confirmado</span>
                          ) : proposed.length > 0 ? (
                            <span className="text-[10px] uppercase tracking-wider px-2 py-1 rounded-full bg-brand-500/12 border border-brand-400/30 text-brand-200 font-semibold">Aguardando</span>
                          ) : (
                            <span className="text-[10px] uppercase tracking-wider px-2 py-1 rounded-full bg-rose-500/10 border border-rose-400/25 text-rose-200/90 font-semibold">Vago</span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* =====================================================================
   BROADCAST DA ESCALA — preview + escolha de quem recebe no WhatsApp
===================================================================== */
const ScaleBroadcastModal = ({ event, message, signups, volunteers, onClose, onSend }) => {
  const ask = useConfirm();
  const toast = useToast();
  const [text, setText] = useState(message);
  const [audience, setAudience] = useState('escalados'); // escalados | equipe
  const [sending, setSending] = useState(false);
  const [result, setResult] = useState(null);

  const evSignups = signups.filter(s => s.eventId === event.id && s.status === 'confirmado');
  const escalados = volunteers.filter(v =>
    v.status === 'ativo' && evSignups.some(s => s.volunteerId === v.id)
  );
  // Time todo: quem está habilitado em qualquer função usada nesse evento
  const rolesNeeded = event.rolesNeeded || [];
  const equipe = volunteers.filter(v =>
    v.status === 'ativo' && (v.qualifiedRoles || []).some(r => rolesNeeded.includes(r))
  );

  const targets = (audience === 'escalados' ? escalados : equipe)
    .filter(v => v.notify !== false && (v.whatsapp || v.phone));
  const semFone = (audience === 'escalados' ? escalados : equipe).length - targets.length;

  const send = async () => {
    if (!onSend) { toast.error('Envio não configurado.'); return; }
    if (targets.length === 0) { toast.error('Ninguém com WhatsApp cadastrado nesse grupo.'); return; }
    if (!await ask({
      title: 'Enviar a escala no WhatsApp?',
      message: 'A mensagem sai agora, do número da igreja.',
      details: [`${targets.length} pessoa(s) recebem`, 'Não dá pra desfazer depois de enviado'],
      confirmLabel: `Enviar para ${targets.length}`,
    })) return;
    setSending(true);
    try {
      const r = await onSend({ event, message: text, targets });
      setResult(r);
      if (r?.sent > 0) toast.success(`✅ Escala enviada para ${r.sent} pessoa(s)${r.failed ? ` · ${r.failed} falharam` : ''}.`);
      else toast.error(`Nenhuma mensagem enviada${r?.failed ? ` (${r.failed} falharam)` : ''}.`);
    } catch (e) { toast.error(e?.message || 'Erro ao enviar'); }
    finally { setSending(false); }
  };

  const copy = async () => {
    try { await navigator.clipboard.writeText(text); toast.success('Copiado! Cole no grupo do WhatsApp.'); }
    catch { toast.error('Não consegui copiar.'); }
  };

  return (
    <Modal open onClose={onClose} size="md">
      <div className="p-5 sm:p-6 space-y-4">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <h3 className="font-serif text-xl text-zinc-50">Enviar escala</h3>
            <p className="text-xs text-zinc-400 mt-0.5">Confira a mensagem antes de disparar.</p>
          </div>
          <button onClick={onClose} className="text-zinc-400 hover:text-zinc-200 p-1"><X className="w-4 h-4" /></button>
        </div>

        {/* Preview estilo WhatsApp */}
        <div>
          <label className="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Mensagem</label>
          <div className="rounded-2xl rounded-tl-sm bg-[#1f2c33] border border-white/10 p-3.5">
            <textarea
              value={text}
              onChange={(e) => setText(e.target.value)}
              rows={Math.min(16, Math.max(6, text.split('\n').length + 1))}
              className="w-full bg-transparent text-[15px] text-zinc-100 leading-relaxed resize-none focus:outline-none"
              style={{ fontFamily: 'system-ui, -apple-system, sans-serif' }}
            />
          </div>
          <p className="text-[11px] text-zinc-500 mt-1.5">Dá pra editar o texto acima antes de enviar.</p>
        </div>

        {/* Quem recebe */}
        <div>
          <label className="block text-[11px] font-medium text-zinc-400 uppercase tracking-wider mb-1.5">Quem recebe</label>
          <div className="grid grid-cols-2 gap-2">
            <button onClick={() => setAudience('escalados')}
              className={`rounded-xl border p-3 text-left transition-all ${audience === 'escalados' ? 'border-emerald-400/50 bg-emerald-500/10' : 'border-white/10 bg-white/[0.03] hover:bg-white/[0.06]'}`}>
              <div className={`text-sm font-medium ${audience === 'escalados' ? 'text-emerald-100' : 'text-zinc-200'}`}>Só os escalados</div>
              <div className="text-[11px] text-zinc-500 mt-0.5">{escalados.length} pessoa{escalados.length === 1 ? '' : 's'}</div>
            </button>
            <button onClick={() => setAudience('equipe')}
              className={`rounded-xl border p-3 text-left transition-all ${audience === 'equipe' ? 'border-emerald-400/50 bg-emerald-500/10' : 'border-white/10 bg-white/[0.03] hover:bg-white/[0.06]'}`}>
              <div className={`text-sm font-medium ${audience === 'equipe' ? 'text-emerald-100' : 'text-zinc-200'}`}>Time todo</div>
              <div className="text-[11px] text-zinc-500 mt-0.5">{equipe.length} habilitado{equipe.length === 1 ? '' : 's'}</div>
            </button>
          </div>
          <div className="text-[11px] text-zinc-500 mt-2">
            Vai para <b className="text-zinc-300">{targets.length}</b> número{targets.length === 1 ? '' : 's'}
            {semFone > 0 && <span className="text-brand-300/80"> · {semFone} sem WhatsApp cadastrado</span>}
          </div>
        </div>

        {result && (
          <div className="rounded-lg border border-white/10 bg-white/[0.03] px-3 py-2 text-xs text-zinc-300">
            ✅ {result.sent} enviada(s){result.failed ? ` · ⚠️ ${result.failed} falharam` : ''}
          </div>
        )}

        <div className="flex flex-col sm:flex-row gap-2 pt-1">
          <button onClick={copy}
            className="sm:w-auto flex items-center justify-center gap-2 rounded-lg border border-white/15 px-4 py-2.5 text-sm text-zinc-200 hover:bg-white/5">
            <Copy className="w-4 h-4" /> Copiar texto
          </button>
          <Button onClick={send} disabled={sending || targets.length === 0} className="flex-1 justify-center">
            {sending ? <Loader2 className="w-4 h-4 animate-spin" /> : <Send className="w-4 h-4" />}
            {sending ? 'Enviando...' : `Enviar para ${targets.length}`}
          </Button>
        </div>
      </div>
    </Modal>
  );
};

const EventDetailPanel = ({ event, signups, volunteers, feedbacks = [], events = [], onEdit, onClose, onInsertSignup, onUpdateSignup, onDeleteSignup, onFeedback, onNotifyEvent, onBroadcastScale }) => {
  const ask = useConfirm();
  const isPast = event.date < YYYYMMDD(new Date());
  const toast = useToast();
  const [notifying, setNotifying] = useState(false);
  const evSignups = signups.filter(s => s.eventId === event.id);
  const areasNeeded = event.areasNeeded || [];
  const rolesNeeded = event.rolesNeeded || [];

  // ---- Montador de escala por função ----
  const [assigning, setAssigning] = useState(null); // função sendo preenchida
  const [busyRole, setBusyRole] = useState(null);
  const [scalePreview, setScalePreview] = useState(false);

  const filledRoles = rolesNeeded.filter(r => evSignups.some(s => s.role === r && s.status === 'confirmado'));
  const scaleMsg = buildScaleMessage(event, signups, volunteers);

  // Quem pode ocupar a função: ativo + habilitado nela. Voluntários já escalados
  // em outro posto do mesmo evento aparecem marcados (pra evitar escalar 2x sem querer).
  // ---- Escala inteligente: disponibilidade do dia + justica + nota ----
  const [availIds, setAvailIds] = useState(() => new Set());
  useEffect(() => {
    let alive = true;
    supabase.from('availability').select('volunteer_id').eq('day', event.date)
      .then(({ data }) => { if (alive && data) setAvailIds(new Set(data.map(r => r.volunteer_id))); });
    return () => { alive = false; };
  }, [event.date]);
  const { rows: swapRows } = useLiveTable('scale_swaps');
  const openSwapFor = (signupId) => swapRows.find(w => w.signup_id === signupId && w.status === 'aberta');

  // escalas confirmadas de cada voluntario nos 30 dias em volta deste culto
  const loadOf = useMemo(() => {
    const base = new Date(event.date + 'T12:00:00').getTime();
    const near = new Set(events.filter(e => Math.abs(new Date(e.date + 'T12:00:00').getTime() - base) <= 15 * 86400000).map(e => e.id));
    const m = new Map();
    signups.forEach(s => { if (s.status === 'confirmado' && near.has(s.eventId) && s.eventId !== event.id) m.set(s.volunteerId, (m.get(s.volunteerId) || 0) + 1); });
    return m;
  }, [signups, events, event.id, event.date]);
  const avgOf = useMemo(() => {
    const m = new Map();
    feedbacks.forEach(f => { const a = m.get(f.volunteerId) || [0, 0]; m.set(f.volunteerId, [a[0] + Number(f.rating || 0), a[1] + 1]); });
    return (id) => { const a = m.get(id); return a ? a[0] / a[1] : null; };
  }, [feedbacks]);
  const scoreOf = (v, role, taken = new Set()) => {
    let sc = 0;
    if (availIds.has(v.id)) sc += 4;                       // marcou que pode
    sc -= (loadOf.get(v.id) || 0) * 1.5;                   // quem serviu menos vem antes
    const avg = avgOf(v.id); if (avg != null) sc += avg / 5; // nota 0-10 -> ate +2
    if (evSignups.some(s => s.volunteerId === v.id && s.role && s.role !== role && s.status === 'confirmado')) sc -= 20;
    if (taken.has(v.id)) sc -= 20;
    return sc;
  };

  const candidatesFor = (role) => volunteers
    .filter(v => v.status === 'ativo' && (v.qualifiedRoles || []).includes(role))
    .map(v => ({
      ...v,
      busyHere: evSignups.some(s => s.volunteerId === v.id && s.role && s.role !== role && s.status === 'confirmado'),
      available: availIds.has(v.id),
      monthLoad: loadOf.get(v.id) || 0,
      avg: avgOf(v.id),
      score: scoreOf(v, role),
    }))
    .sort((a, b) => (b.score - a.score) || a.name.localeCompare(b.name));

  // Monta sugestao pra todos os postos vagos sem repetir pessoa
  const [autoPlan, setAutoPlan] = useState(null); // [{ role, vol, why }]
  const [applying, setApplying] = useState(false);
  const buildAutoPlan = (shuffle = false) => {
    const taken = new Set(evSignups.filter(s => s.status === 'confirmado').map(s => s.volunteerId));
    const plan = [];
    rolesNeeded.forEach(role => {
      if (evSignups.some(s => s.role === role && s.status === 'confirmado')) return;
      let list = volunteers
        .filter(v => v.status === 'ativo' && (v.qualifiedRoles || []).includes(role) && !taken.has(v.id))
        .map(v => ({ v, sc: scoreOf(v, role, taken) + (shuffle ? Math.random() * 2.5 : 0) }))
        .sort((a, b) => b.sc - a.sc);
      const pick = list[0]?.v || null;
      if (pick) taken.add(pick.id);
      const why = pick ? [
        availIds.has(pick.id) ? 'disponível' : null,
        `${loadOf.get(pick.id) || 0} escala${(loadOf.get(pick.id) || 0) === 1 ? '' : 's'} no mês`,
        avgOf(pick.id) != null ? `nota ${avgOf(pick.id).toFixed(1)}` : null,
      ].filter(Boolean).join(' · ') : 'ninguém habilitado livre';
      plan.push({ role, vol: pick, why });
    });
    setAutoPlan(plan);
  };
  const applyAutoPlan = async () => {
    setApplying(true);
    let n = 0;
    for (const p of autoPlan || []) {
      if (!p.vol) continue;
      try {
        await onInsertSignup({ eventId: event.id, volunteerId: p.vol.id, area: ROLE_META[p.role]?.area || (p.vol.areas || [])[0] || 'video', role: p.role, status: 'confirmado' });
        n++;
      } catch {}
    }
    setApplying(false);
    setAutoPlan(null);
    toast.success(n ? `${n} posto${n === 1 ? '' : 's'} preenchido${n === 1 ? '' : 's'}.` : 'Nada pra preencher.');
  };

  const assignRole = async (role, volunteer) => {
    if (!onInsertSignup) { toast.error('Não foi possível escalar.'); return; }
    setBusyRole(role);
    try {
      // Se já tinha alguém nesse posto, tira antes
      const prev = evSignups.find(s => s.role === role);
      if (prev) { try { await onDeleteSignup(prev.id); } catch {} }
      await onInsertSignup({
        eventId: event.id,
        volunteerId: volunteer.id,
        area: ROLE_META[role]?.area || (volunteer.areas || [])[0] || 'video',
        role,
        status: 'confirmado',
      });
      toast.success(`${volunteer.name} escalado em ${ROLE_META[role]?.label || role}.`);
      setAssigning(null);
    } catch (e) { toast.error(e?.message || 'Erro ao escalar'); }
    finally { setBusyRole(null); }
  };

  const clearRole = async (role) => {
    const s = evSignups.find(x => x.role === role);
    if (!s) return;
    setBusyRole(role);
    try { await onDeleteSignup(s.id); toast.info('Posto liberado.'); }
    catch (e) { toast.error(e?.message || 'Erro'); }
    finally { setBusyRole(null); }
  };

  // Quantos voluntários receberiam o aviso (ativos, com fone, notify on, com alguma área do evento)
  const notifyTargets = volunteers.filter(v => {
    if (v.status !== 'ativo' || v.notify === false) return false;
    if (!(v.whatsapp || v.phone)) return false;
    return v.areas.some(a => areasNeeded.includes(a));
  });

  const setStatus = async (s, status) => {
    try { await onUpdateSignup({ ...s, status }); toast.success('Atualizado.'); } catch {}
  };
  const remove = async (s) => {
    if (!await ask({ title: 'Remover essa candidatura?', message: 'O voluntário sai da escala deste evento.', danger: true, confirmLabel: 'Remover' })) return;
    try { await onDeleteSignup(s.id); toast.info('Removido.'); } catch {}
  };
  const notify = async () => {
    if (!onNotifyEvent) return;
    if (notifyTargets.length === 0) { toast.error('Nenhum voluntário elegível para notificar.'); return; }
    if (!await ask({
      title: 'Avisar os voluntários?',
      message: 'Vai um WhatsApp contando que essa escala abriu.',
      details: [`${notifyTargets.length} voluntário(s) das áreas do evento`, 'Quem já recebeu antes não recebe de novo'],
      confirmLabel: `Avisar ${notifyTargets.length}`,
    })) return;
    setNotifying(true);
    try {
      const r = await onNotifyEvent(event);
      const sent = r?.sent || 0;
      const skipped = r?.skipped || 0;
      if (sent > 0) toast.success(`✅ Enviado para ${sent} voluntário(s)${skipped ? ` (${skipped} já haviam recebido)` : ''}.`);
      else if (skipped > 0) toast.info(`Todos os ${skipped} voluntários já foram avisados dessa escala.`);
      else toast.error('Nenhuma mensagem enviada.');
    } catch (e) { toast.error(e?.message || 'Erro ao notificar'); }
    finally { setNotifying(false); }
  };

  const [resetting, setResetting] = useState(false);
  const resetSchedule = async () => {
    if (evSignups.length === 0) { toast.info('Não há candidaturas para resetar.'); return; }
    if (!await ask({
      title: 'Resetar a escala deste evento?',
      message: 'Os postos ficam todos vazios de novo.',
      details: [`${evSignups.length} candidatura(s) removida(s)`, 'Quem já foi escalado precisa ser avisado por você'],
      danger: true, confirmLabel: 'Resetar escala',
    })) return;
    setResetting(true);
    try {
      for (const s of evSignups) { try { await onDeleteSignup(s.id); } catch {} }
      toast.success('Escala resetada.');
    } finally { setResetting(false); }
  };

  return (
    <Modal open onClose={onClose} size="lg">
      <div className="p-6 md:p-7 space-y-4">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <h3 className="font-serif text-xl text-zinc-50 truncate">{event.title}</h3>
            <p className="text-xs text-zinc-400 mt-1">{new Date(event.date + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' })}</p>
          </div>
          <div className="flex gap-1">
            <Button size="sm" variant="ghost" onClick={onEdit}><Edit2 className="w-3.5 h-3.5" /> Editar</Button>
            <button onClick={onClose} className="text-zinc-400 hover:text-zinc-200 p-2"><X className="w-4 h-4" /></button>
          </div>
        </div>

        <div className="flex flex-col sm:flex-row gap-2">
          {onNotifyEvent && !isPast && areasNeeded.length > 0 && (
            <button
              onClick={notify}
              disabled={notifying || notifyTargets.length === 0}
              className="flex-1 flex items-center justify-center gap-2 rounded-lg border border-emerald-400/30 bg-gradient-to-br from-emerald-500/15 to-emerald-600/10 hover:from-emerald-500/25 hover:to-emerald-600/20 px-4 py-2.5 text-sm text-emerald-100 font-medium transition-all disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <MessageSquare className="w-4 h-4" />
              {notifying ? 'Enviando...' : `Notificar WhatsApp (${notifyTargets.length})`}
            </button>
          )}
          {evSignups.length > 0 && (
            <button
              onClick={resetSchedule}
              disabled={resetting}
              title="Remove todas as candidaturas desse evento"

              {resetting ? 'Resetando...' : `Resetar escala (${evSignups.length})`}

          <div className="rounded-lg border border-fuchsia-400/25 bg-fuchsia-500/8 p-3">

        {rolesNeeded.length > 0 && (
          <div className="rounded-2xl border border-white/10 bg-black/20 overflow-hidden">
            <div className="flex items-center justify-between gap-3 px-4 py-3 border-b border-white/10 bg-white/[0.02]">
              <div className="min-w-0">
                <h4 className="text-sm font-semibold text-zinc-50">Escala do culto</h4>
                <p className="text-[11px] text-zinc-500 mt-0.5">Toque num posto pra escalar quem está habilitado.</p>
              </div>
              <div className="text-right flex-shrink-0">
                <div className={`font-serif text-2xl leading-none ${filledRoles.length === rolesNeeded.length ? 'text-emerald-400' : 'text-brand-200'}`}>
                  {filledRoles.length}<span className="text-zinc-600 text-base">/{rolesNeeded.length}</span>
                </div>
                <div className="text-[9px] uppercase tracking-wider text-zinc-500 mt-0.5">postos</div>
              </div>
            </div>

            {/* Barra de progresso */}
            <div className="h-1.5 bg-black/40">
              <div className={`h-full transition-all duration-500 ${filledRoles.length === rolesNeeded.length ? 'bg-emerald-500' : 'bg-gradient-to-r from-brand-400 to-cyan-400'}`}
                style={{ width: `${Math.round((filledRoles.length / rolesNeeded.length) * 100)}%` }} />
            </div>

            {/* Montar automatico */}
            {!isPast && filledRoles.length < rolesNeeded.length && !autoPlan && (
              <div className="px-3 pt-3">
                <button onClick={() => buildAutoPlan(false)}
                  className="mm-tap w-full flex items-center justify-center gap-2 rounded-xl mm-lime-bg font-bold text-sm py-3 hover:brightness-105 active:scale-[0.99] transition-transform">
                  <Sparkles className="w-4 h-4" /> Montar escala automática
                </button>
                <p className="text-[11px] text-zinc-500 text-center mt-1.5">Usa quem marcou disponibilidade, quem serviu menos no mês e a nota. Você revisa antes de aplicar.</p>
              </div>
            )}
            {autoPlan && (
              <div className="m-3 rounded-2xl border-2 border-[var(--gvv-lime)] bg-[var(--bg-surface)] overflow-hidden mm-fade-in">
                <div className="flex items-center justify-between gap-2 px-4 py-3 border-b border-white/10">
                  <div>
                    <div className="text-[10px] font-bold uppercase tracking-wider mm-lime">Sugestão</div>
                    <div className="text-sm font-semibold text-zinc-50">Confere e aplica</div>
                  </div>
                  <button onClick={() => buildAutoPlan(true)} className="mm-tap text-xs font-semibold px-3 py-2 rounded-lg border border-white/15 hover:bg-white/8 text-zinc-200 inline-flex items-center gap-1.5">
                    <RefreshCw className="w-3.5 h-3.5" /> Outra sugestão
                  </button>
                </div>
                <div className="divide-y divide-white/[0.06]">
                  {autoPlan.map(p => {
                    const meta = ROLE_META[p.role]; const Ic = meta?.icon;
                    return (
                      <div key={p.role} className="flex items-center gap-3 px-4 py-2.5">
                        <div className={`flex items-center gap-2 w-[104px] flex-shrink-0 ${meta?.text || ''}`}>
                          {Ic && <Ic className="w-4 h-4" />}<span className="text-[13px] font-medium truncate">{meta?.label || p.role}</span>
                        </div>
                        {p.vol ? (
                          <div className="flex items-center gap-2 min-w-0 flex-1">
                            <div style={avaStyle(p.vol.name)} className="w-7 h-7 rounded-full mm-ava flex items-center justify-center text-[11px] flex-shrink-0">{agInitials(p.vol.name)}</div>

                              <div className="text-sm text-zinc-50 truncate">{p.vol.name}</div>
                              <div className="text-[11px] text-zinc-500 truncate">{p.why}</div>

                const meta = ROLE_META[role];
                if (!meta) return null;
                const Ic = meta.icon;
                const s = evSignups.find(x => x.role === role && x.status === 'confirmado');
                const vol = s ? volunteers.find(v => v.id === s.volunteerId) : null;

                return (
                  <div key={role}>

                      <div className={`flex items-center gap-2 w-[112px] flex-shrink-0 ${meta.text}`}>

                      <div className="min-w-0 flex-1">

                          <div className="flex items-center gap-2">

                              <span title="Pediu troca: a vaga está aberta pros colegas" className="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded-md bg-amber-400 text-black flex-shrink-0 inline-flex items-center gap-1">
                                <RefreshCw className="w-2.5 h-2.5" /> troca
                              </span>
                            )}
                          </div>
                        ) : (
                          <button onClick={() => setAssigning(isOpen ? null : role)} disabled={busy}
                            className="text-xs text-zinc-500 hover:text-brand-200 inline-flex items-center gap-1.5 border border-dashed border-white/15 hover:border-brand-400/40 rounded-lg px-2.5 py-1.5 transition-colors disabled:opacity-50">

                          </button>
