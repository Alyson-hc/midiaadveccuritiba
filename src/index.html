                const clickable = v.status !== 'pendente';
                return (
                  <div
                    key={v.id}
                    onClick={() => clickable && setProfileOpen(v)}
                    className={`group mm-card rounded-2xl p-4 backdrop-blur-xl bg-zinc-950/60 border border-white/10 ${clickable ? 'hover:border-brand-400/30 hover:bg-zinc-950/80 cursor-pointer' : ''} transition-all`}
                  >
                    <div className="flex items-start gap-3 mb-3">
                      <div className="relative flex-shrink-0">
                        <div style={avaStyle(v.name)} className="w-12 h-12 rounded-2xl mm-ava flex items-center justify-center font-serif text-xl shadow-lg shadow-brand-900/30">
                          {(v.name[0] || '?').toUpperCase()}
                        </div>
                        {v.status === 'ativo' && s.level > 1 && (
                          <span className="absolute -bottom-1 -right-1 text-[9px] font-bold px-1.5 py-0.5 rounded-md mm-brand-grad on-accent border border-black/20">Nv{s.level}</span>
                        )}
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-2 flex-wrap">
                          <h4 className="text-zinc-50 font-medium truncate">{v.name}</h4>
                          <span className={`text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded-full border ${st.bg} ${st.border} ${st.text}`}>{st.label}</span>
                        </div>
                        <div className="text-[11px] text-zinc-400 truncate">{v.email}</div>
                        {v.phone && <div className="text-[11px] text-zinc-500 truncate">{v.phone}</div>}
                      </div>
                    </div>

                    {v.areas.length > 0 && (
                      <div className="flex flex-wrap gap-1 mb-3">
                        {v.areas.map(a => {
                          const m = AREA_META[a]; if (!m) return null;
                          const Ic = m.icon;
                          return (
                            <span key={a} className={`inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-md border ${m.border} ${m.text} bg-white/[0.03]`}>
                              <Ic className="w-3 h-3" /> {m.label}
                            </span>
                          );
                        })}
                      </div>
                    )}

                    {v.status === 'ativo' && (
                      <div className="grid grid-cols-3 gap-2 text-center border-t border-white/8 pt-3 mb-3">
                        <div>
                          <div className="text-[10px] uppercase tracking-wider text-zinc-500">Escalas</div>
                          <div className="font-serif text-lg text-zinc-100">{s.confirmed}</div>
                        </div>
                        <div>
                          <div className="text-[10px] uppercase tracking-wider text-zinc-500">30 dias</div>
                          <div className="font-serif text-lg text-fuchsia-200">{s.servedLast30d}</div>
                        </div>
                        <div>
                          <div className="text-[10px] uppercase tracking-wider text-zinc-500">Nota</div>
                          <div className="font-serif text-lg text-brand-200">{s.feedbackCount > 0 ? s.avgRating.toFixed(1) : '—'}</div>
                        </div>
                      </div>
                    )}

                    <div className="flex flex-wrap gap-1.5" onClick={(e) => e.stopPropagation()}>
                      {v.status === 'pendente' && (
                        <>
                          <Button size="sm" onClick={() => approve(v)}><Check className="w-3.5 h-3.5" /> Aprovar</Button>
                          <Button size="sm" variant="ghost" onClick={() => reject(v)}><X className="w-3.5 h-3.5" /> Rejeitar</Button>
                        </>
                      )}
                      {v.status === 'ativo' && (
                        <>
                          <Button size="sm" variant="ghost" onClick={() => setProfileOpen(v)}>Ver ficha</Button>
                          <Button size="sm" variant="ghost" onClick={() => setFeedbackTarget({ volunteer: v, event: null, area: null })}><Sparkles className="w-3.5 h-3.5" /> Avaliar</Button>
                        </>
                      )}
                      {(v.status === 'inativo' || v.status === 'rejeitado') && (
                        <>
                          <Button size="sm" onClick={() => reactivate(v)}><Check className="w-3.5 h-3.5" /> Ativar</Button>
                          <Button size="sm" variant="ghost" onClick={() => remove(v)}><Trash2 className="w-3.5 h-3.5" /></Button>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {tab === 'escalas' && (
        <div className="space-y-6">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <p className="text-sm text-zinc-400">
              Clique num dia para criar um evento, ou num evento pra ver candidatos.
            </p>
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={() => setShowPastEvents(v => !v)}
                className={`text-xs px-3 py-1.5 rounded-lg border transition-all inline-flex items-center gap-1.5 ${showPastEvents ? 'border-emerald-400/40 bg-emerald-500/12 text-emerald-500' : 'border-white/12 bg-white/[0.03] text-zinc-300 hover:bg-white/[0.08]'}`}
                title="Alterna a exibição de escalas antigas"
              >
                <Clock className="w-3.5 h-3.5" />
                {showPastEvents ? 'Ocultar passadas' : 'Ver escalas passadas'}
              </button>
              <button
                onClick={async () => {
                  const now = new Date();
                  const mStart = YYYYMMDD(new Date(now.getFullYear(), now.getMonth(), 1));
                  const mEnd = YYYYMMDD(new Date(now.getFullYear(), now.getMonth() + 1, 0));
                  const mLabel = now.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                  const evsInMonth = visibleEvents.filter(e => e.date >= mStart && e.date <= mEnd);
                  const evIds = new Set(evsInMonth.map(e => e.id));
                  const sInMonth = signups.filter(s => evIds.has(s.eventId));
                  if (sInMonth.length === 0) { toast.info(`Não há candidaturas em ${mLabel}.`); return; }
                  if (!await ask({
                    title: `Resetar todas as escalas de ${mLabel}?`,
                    message: 'É a ação mais destrutiva da tela — o mês inteiro volta a ficar vazio.',
                    details: [
                      `${sInMonth.length} candidatura(s) removida(s)`,
                      `${evsInMonth.length} evento(s) afetado(s)`,
                      'Ninguém é avisado automaticamente — o aviso é com você',
                    ],
                    danger: true, confirmLabel: `Resetar ${mLabel}`,
                  })) return;
                  let done = 0;
                  for (const s of sInMonth) { try { await onDeleteSignup(s.id); done++; } catch {} }
                  toast.success(`Escalas do mês resetadas (${done} de ${sInMonth.length}).`);
                }}
                className="text-xs px-3 py-1.5 rounded-lg border border-rose-400/30 bg-rose-500/10 text-rose-500 hover:bg-rose-500/20 transition-all inline-flex items-center gap-1.5"
                title="Remove todas as candidaturas dos eventos do mês atual"
              >
                <Trash2 className="w-3.5 h-3.5" /> Resetar escalas do mês
              </button>
              <Button size="sm" onClick={() => setEventEditor({ dateHint: YYYYMMDD(new Date()) })}>
                <Plus className="w-3.5 h-3.5" /> Novo evento
              </Button>
            </div>
          </div>
          <SchedulingCalendar
            events={visibleEvents}
            signups={signups}
            mode="admin"
            onDayClick={(day) => setEventEditor({ dateHint: day })}
            onEventClick={(ev) => setEventDetail(ev)}
          />

          <UpcomingSchedulesList
            events={visibleEvents}
            signups={signups}
            volunteers={volunteers}
            onOpenEvent={(ev) => setEventDetail(ev)}
            onNotifyEvent={onNotifyEvent}
            showPast={showPastEvents}
          />
        </div>
      )}

      {tab === 'frequencias' && (
        <FrequenciasView volunteers={visibleVolunteers} signups={signups} feedbacks={visibleFeedbacks} events={visibleEvents} />
      )}

      {tab === 'solicitacoes' && (
        <div className="space-y-3">
          <div>
            <h3 className="font-serif text-lg text-zinc-50">Solicitações de área</h3>
            <p className="text-xs text-zinc-400">Voluntários pedindo pra atuar em novas áreas. Aprovar adiciona a área ao perfil.</p>
          </div>
          {visibleAreaRequests.length === 0 ? (
            <EmptyState icon={Inbox} title="Nenhuma solicitação" description="Quando um voluntário pedir uma nova área, ela aparece aqui." />
          ) : (
            <div className="space-y-2">
              {visibleAreaRequests.map(r => {
                const vol = volunteers.find(v => v.id === r.volunteerId);
                if (!vol) return null;
                const m = AREA_META[r.area]; if (!m) return null;
                const Ic = m.icon;
                const isPending = r.status === 'pendente';
                return (
                  <div key={r.id} className="mm-card rounded-xl backdrop-blur-xl bg-zinc-950/60 p-4 flex flex-wrap items-center gap-3">
                    <div style={avaStyle(vol.name)} className="w-10 h-10 rounded-xl mm-ava flex items-center justify-center font-serif text-lg flex-shrink-0">
                      {(vol.name[0] || '?').toUpperCase()}
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="text-sm text-zinc-50 font-medium truncate">{vol.name}</div>
                      <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                        <span className={`inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded border ${m.border} ${m.text}`}>
                          <Ic className="w-3 h-3" /> {m.label}
                        </span>
                        <span className={`text-[9px] uppercase tracking-wider px-1.5 py-0.5 rounded ${isPending ? 'bg-brand-500/20 text-brand-100 border border-brand-400/30' : r.status === 'aprovado' ? 'bg-emerald-500/20 text-emerald-100 border border-emerald-400/30' : 'bg-rose-500/20 text-rose-100 border border-rose-400/30'}`}>{r.status}</span>
                        <span className="text-[10px] text-zinc-500">{new Date(r.createdAt).toLocaleDateString('pt-BR')}</span>
                      </div>
                      {r.reason && <p className="text-xs text-zinc-300 mt-1 italic">"{r.reason}"</p>}
                    </div>
                    {isPending && (
                      <div className="flex gap-1.5 flex-shrink-0">
                        <Button size="sm" onClick={async () => { try { await onApproveAreaRequest(r); toast.success('Área adicionada!'); } catch (e) { toast.error(e?.message || 'Erro'); } }}>
                          <Check className="w-3.5 h-3.5" /> Aprovar
                        </Button>
                        <Button size="sm" variant="ghost" onClick={async () => { if (await ask({ title: 'Rejeitar a solicitação?', message: `${vol.name} continua sem essa área.`, danger: true, confirmLabel: 'Rejeitar' })) { try { await onRejectAreaRequest(r); toast.info('Rejeitado.'); } catch (e) { toast.error(e?.message || 'Erro'); } } }}>
                          <X className="w-3.5 h-3.5" />
                        </Button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {tab === 'mural' && (
        <AnnouncementsManager
          announcements={announcements}
          volunteers={visibleVolunteers}
          adminName={adminName}
          onInsert={onInsertAnnouncement}
          onDelete={onDeleteAnnouncement}
          onBroadcast={onBroadcast}
        />
      )}

      {tab === 'estudo' && (
        <StudyManager
          materials={studyMaterials}
          adminAreas={admin?.role === 'coordinator' ? (admin?.areas || []) : null}
          adminName={adminName}
          onAdd={onAddStudyMaterial}
          onUpdate={onUpdateStudyMaterial}
          onRemove={onRemoveStudyMaterial}
        />
      )}

      {tab === 'forum' && (
        <ForumBoard
          posts={forumPosts}
          currentUser={{ type: 'admin', id: admin?.id || '', name: adminName }}
          scopedAreas={admin?.role === 'coordinator' ? (admin?.areas || []) : null}
          onPost={onPostForum}
          onDelete={onDeleteForumPost}
          canModerate
        />
      )}

      {editing && (
        <VolunteerEditModal
          volunteer={editing}
          onClose={() => setEditing(null)}
          onSave={async (patch) => {
            try {
              await onUpdateVolunteer({ ...editing, ...patch });
              toast.success('Voluntário atualizado');
              setEditing(null);
            } catch {}
          }}
        />
      )}

      {eventEditor && (
        <EventEditor
          event={eventEditor.event}
          dateHint={eventEditor.dateHint}
          onClose={() => setEventEditor(null)}
          onSave={async (payload) => {
            if (payload.id) { await onUpdateEvent(payload); toast.success('Evento atualizado'); }
            else { await onInsertEvent(payload); toast.success('Evento criado'); }
          }}
          onDelete={async (id) => { await onDeleteEvent(id); toast.info('Evento excluído'); }}
        />
      )}

      {eventDetail && (
        <EventDetailPanel
          event={events.find(e => e.id === eventDetail.id) || eventDetail}
          signups={signups}
          volunteers={volunteers}
          feedbacks={feedbacks}
          events={events}
          onEdit={() => { setEventEditor({ event: events.find(e => e.id === eventDetail.id) || eventDetail }); setEventDetail(null); }}
          onClose={() => setEventDetail(null)}
          onInsertSignup={onInsertSignup}
          onUpdateSignup={onUpdateSignup}
          onDeleteSignup={onDeleteSignup}
          onNotifyEvent={onNotifyEvent}
          onBroadcastScale={onBroadcastScale}
          onFeedback={(vol, area) => setFeedbackTarget({ volunteer: vol, event: eventDetail, area })}
        />
      )}

      {feedbackTarget && (
        <FeedbackModal
          volunteer={feedbackTarget.volunteer}
          event={feedbackTarget.event}
          area={feedbackTarget.area}
          adminName={adminName}
          onClose={() => setFeedbackTarget(null)}
          onSave={onInsertFeedback}
        />
      )}

      {profileOpen && (
        <VolunteerProfileModal
          volunteer={volunteers.find(v => v.id === profileOpen.id) || profileOpen}
          events={events}
          signups={signups}
          feedbacks={feedbacks}
          adminName={adminName}
          onClose={() => setProfileOpen(null)}
          onEdit={() => { setEditing(profileOpen); setProfileOpen(null); }}
          onSetStatus={async (s) => { await onSetVolunteerStatus(profileOpen.id, s); }}
          onSetTrainingStage={async (stage) => { const v = volunteers.find(x => x.id === profileOpen.id) || profileOpen; await onUpdateVolunteer({ ...v, trainingStage: stage }); }}
          onRemove={async () => {
            if (await ask({
              title: 'Remover em definitivo?',
              message: `${profileOpen.name} sai do sistema, com histórico e tudo.`,
              details: ['Pra apenas tirar de circulação, use Inativar'],
              danger: true, confirmLabel: 'Remover definitivamente',
            })) { await onRemoveVolunteer(profileOpen.id); setProfileOpen(null); }
          }}
          onInsertFeedback={onInsertFeedback}
        />
      )}
    </div>
  );
};

const VolunteerEditModal = ({ volunteer, onClose, onSave }) => {
  const [name, setName] = useState(volunteer.name);
  const [phone, setPhone] = useState(volunteer.phone || '');
  const [areas, setAreas] = useState(volunteer.areas || []);
  const [qualifiedRoles, setQualifiedRoles] = useState(volunteer.qualifiedRoles || []);
  const [notes, setNotes] = useState(volunteer.notes || '');
  const [xp, setXp] = useState(volunteer.xp || 0);
  const toggle = (a) => setAreas(prev => prev.includes(a) ? prev.filter(x => x !== a) : [...prev, a]);
  const toggleRole = (r) => setQualifiedRoles(prev => prev.includes(r) ? prev.filter(x => x !== r) : [...prev, r]);
  return (
    <Modal open onClose={onClose} size="lg">
      <div className="p-6 md:p-7 space-y-4">
        <div className="flex items-center justify-between">
          <h3 className="font-serif text-xl text-zinc-50">Editar voluntário</h3>
          <button onClick={onClose} className="text-zinc-400 hover:text-zinc-200"><X className="w-4 h-4" /></button>
        </div>
        <Input label="Nome" value={name} onChange={(e) => setName(e.target.value)} />
        <Input label="Telefone" value={phone} onChange={(e) => setPhone(e.target.value)} />
        <div>
          <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">Áreas</label>
          <div className="grid grid-cols-2 gap-2">
            {VOLUNTEER_AREAS.map(a => {
              const Ic = a.icon;
              const active = areas.includes(a.value);
              return (
                <button key={a.value} type="button" onClick={() => toggle(a.value)}
                  className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-sm transition-all ${active ? `bg-gradient-to-br ${a.color} ${a.border} ${a.text}` : 'bg-white/[0.03] border-white/10 text-zinc-300 hover:bg-white/[0.06]'}`}>
                  <Ic className="w-4 h-4" /> <span className="flex-1 text-left">{a.label}</span> {active && <Check className="w-3.5 h-3.5" />}
                </button>
              );
            })}
          </div>
        </div>
        {/* Habilitação por função — só quem passou pelo treinamento pode ser escalado */}
        <div>
          <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1">
            Funções habilitadas
          </label>
          <p className="text-[11px] text-zinc-500 mb-2">
            Marque as funções em que essa pessoa <b className="text-emerald-400">já passou pelo treinamento</b>. Só habilitados aparecem pra escalar nos cultos.
          </p>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {MEDIA_ROLES.map(r => {
              const Ic = r.icon;
              const active = qualifiedRoles.includes(r.value);
              return (
                <button key={r.value} type="button" onClick={() => toggleRole(r.value)}
                  className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-sm transition-all ${active ? `bg-gradient-to-br ${r.color} ${r.border} ${r.text}` : 'bg-white/[0.03] border-white/10 text-zinc-400 hover:bg-white/[0.06]'}`}>
                  <Ic className="w-4 h-4 flex-shrink-0" /> <span className="flex-1 text-left truncate">{r.label}</span>
                  {active ? <Check className="w-3.5 h-3.5 flex-shrink-0" /> : <Lock className="w-3 h-3 flex-shrink-0 opacity-40" />}
                </button>
              );
            })}
          </div>
          <div className="text-[11px] text-zinc-500 mt-2">
            {qualifiedRoles.length === 0
              ? 'Nenhuma função habilitada ainda — essa pessoa não pode ser escalada nos cultos.'
              : `${qualifiedRoles.length} de ${MEDIA_ROLES.length} funções habilitadas.`}
          </div>
        </div>

        <Input label="XP" type="number" value={xp} onChange={(e) => setXp(parseInt(e.target.value || '0', 10))} />
        <Textarea label="Anotações (uso interno)" value={notes} onChange={(e) => setNotes(e.target.value)} rows={3} />
        <div className="flex gap-2 pt-2">
          <Button variant="ghost" onClick={onClose} className="flex-1">Cancelar</Button>
          <Button onClick={() => onSave({ name, phone, areas, qualifiedRoles, notes, xp, level: levelFromXp(xp) })} className="flex-1">Salvar</Button>
        </div>
      </div>
    </Modal>
  );
};

const AppContent = () => {
  const {
    departments, requests, contents, admins, aiStyles, volunteers, events, signups, availability, feedbacks, announcements, areaRequests, studyMaterials, forumPosts, loading,
    dbInsertStudyMaterial, dbUpdateStudyMaterial, dbDeleteStudyMaterial,
    dbInsertForumPost, dbDeleteForumPost,
    dbInsertRequest, dbUpdateRequest, dbDeleteRequest,
    dbInsertDepartment, dbUpdateDepartment, dbDeleteDepartment,
    dbUpdateDepartmentPassword,
    dbInsertContent, dbUpdateContent, dbDeleteContent,
    dbInsertAdmin, dbUpdateAdmin, dbDeleteAdmin,
    dbInsertStyle, dbUpdateStyle, dbDeleteStyle,
    dbSignupVolunteer, dbLoginVolunteer, dbUpdateVolunteer, dbUpdateVolunteerSelf, dbSetVolunteerStatus, dbDeleteVolunteer,
    dbNotifyVolunteer,
    dbInsertEvent, dbUpdateEvent, dbDeleteEvent,
    dbInsertSignup, dbUpdateSignup, dbDeleteSignup,
    dbToggleAvailability,
    dbInsertFeedback, dbDeleteFeedback,
    dbInsertAnnouncement, dbDeleteAnnouncement,
    dbInsertAreaRequest, dbApproveAreaRequest, dbRejectAreaRequest,
  } = useData();

  // Lembrete no dia — quando carrega dados, verifica escalas de hoje e envia msg
  // (idempotente: whatsapp_log tem unique key por kind+reference)
  useEffect(() => {
    if (!volunteers.length || !events.length) return;
    const todayStr = YYYYMMDD(new Date());
    const todaysEvents = events.filter(e => e.date === todayStr);
    if (todaysEvents.length === 0) return;
    todaysEvents.forEach(ev => {
      const confirmedSignups = signups.filter(s => s.eventId === ev.id && s.status === 'confirmado');
      confirmedSignups.forEach(s => {
        const vol = volunteers.find(v => v.id === s.volunteerId);
        if (!vol) return;
        const msg = `🔔 *Lembrete: hoje tem escala!*\n\n*${ev.title}*\nÁrea: ${AREA_META[s.area]?.label || s.area}${ev.contentIdea ? `\n\n💡 Ideia do dia: ${ev.contentIdea}` : ''}\n\nSe prepara e vai com tudo!`;
        dbNotifyVolunteer({ volunteer: vol, kind: 'day_reminder', reference: `${ev.id}:${todayStr}`, message: msg }).catch(() => {});
      });
    });
  }, [volunteers, events, signups]);

  // Sessão persistida: recarregar a página NÃO desloga mais
  const [session, setSession] = useState(() => {
    try { return JSON.parse(localStorage.getItem('mm-session') || 'null'); } catch { return null; }
  });
  const toast = useToast();

  const handleLogin = (s) => {
    setSession(s);
    try { localStorage.setItem('mm-session', JSON.stringify(s)); } catch {}
    if (s.type === 'admin') toast.success(`Bem-vindo, ${s.admin?.name || 'admin'}`);
    else if (s.type === 'volunteer') toast.success(`Bem-vindo, ${s.volunteer?.name || 'voluntário'}`);
    else toast.success(`Bem-vindo, ${s.department.name}`);
  };

  const handleLogout = () => {
    setSession(null);
    try { localStorage.removeItem('mm-session'); } catch {}
    toast.info('Sessão encerrada');
  };

  const submitRequest = async (req) => {
    try {
      await dbInsertRequest(req);
      toast.success('Solicitação enviada com sucesso');

      // E-mails de confirmação (em segundo plano, nunca travam o envio)
      const servicos = (req.serviceTypes || []).map(s => getServiceMeta(s).label).join(', ');
      sendEmail(
        req.responsibleEmail,
        `Recebemos sua solicitação: ${req.title}`,
        `Olá, ${req.responsibleName}!\n\n` +
        `Recebemos sua solicitação "${req.title}" (${servicos}) do departamento ${req.department}.\n\n` +
        (req.eventEndDate
          ? `Início: ${formatDate(req.eventDate)}${req.eventTime ? ' às ' + req.eventTime : ''}\nFim: ${formatDate(req.eventEndDate)}${req.eventEndTime ? ' às ' + req.eventEndTime : ''}\n`
          : `Data do evento: ${formatDate(req.eventDate)}\n`) +
        `Status atual: Pendente\n\n` +
        `Você vai receber um e-mail a cada atualização. Acompanhe também pelo painel:\n${APP_URL}\n\n` +
        `— Ministério de Mídia · ADVEC Curitiba`
      );
      admins.filter(a => a.email).forEach(a => sendEmail(
        a.email,
        `Nova solicitação: ${req.title} (${req.department})`,
        `Olá, ${a.name}!\n\n` +
        `Chegou uma nova solicitação no painel:\n\n` +
        `Título: ${req.title}\n` +
        `Departamento: ${req.department}\n` +
        `Responsável: ${req.responsibleName} · ${req.responsiblePhone}\n` +
        `E-mail: ${req.responsibleEmail}\n` +
        (req.eventEndDate
          ? `Início: ${formatDate(req.eventDate)}${req.eventTime ? ' às ' + req.eventTime : ''}\nFim: ${formatDate(req.eventEndDate)}${req.eventEndTime ? ' às ' + req.eventEndTime : ''}\n`
          : `Data do evento: ${formatDate(req.eventDate)}\n`) +
        `Tipos: ${servicos}\n\n` +
        `Acesse o painel: ${APP_URL}\n\n` +
        `— Ministério de Mídia · ADVEC Curitiba`
      ));
    } catch (e) {
      toast.error('Erro ao enviar: ' + (e?.message || 'tente novamente'));
      throw e;
    }
  };

  const updateRequest = async (updated) => {
    try {
      const old = requests.find(r => r.id === updated.id);
      await dbUpdateRequest(updated, old);

      // Mudou o status? Avisa o solicitante por e-mail
      if (old && old.status !== updated.status && updated.responsibleEmail) {
        const texto = STATUS_EMAIL_TEXT[updated.status]
          || `teve o status alterado para "${(STATUS_CONFIG[updated.status] || {}).label || updated.status}"`;
        sendEmail(
          updated.responsibleEmail,
          `Atualização: ${updated.title || 'sua solicitação'}`,
          `Olá, ${updated.responsibleName}!\n\n` +
          `Sua solicitação "${updated.title || ''}" ${texto}.\n\n` +
          `Acesse o painel: ${APP_URL}\n\n` +
          `— Ministério de Mídia · ADVEC Curitiba`
        );
      }

      // Nova mensagem no chat? Avisa a outra parte por e-mail
      const oldCount = (old?.comments || []).length;
      const newComments = (updated.comments || []);
      if (newComments.length > oldCount) {
        const last = newComments[newComments.length - 1];
        if (last.role === 'admin' && updated.responsibleEmail) {
          // Admin escreveu -> avisa o solicitante
          sendEmail(
            updated.responsibleEmail,
            `Nova mensagem sobre "${updated.title || 'sua solicitação'}"`,
            `Olá, ${updated.responsibleName}!\n\n` +
            `A equipe de mídia enviou uma mensagem sobre sua solicitação "${updated.title || ''}":\n\n` +
            `"${last.text}"\n\n` +
            `Responda pelo painel: ${APP_URL}\n\n` +
            `— Ministério de Mídia · ADVEC Curitiba`
          );
        } else if (last.role === 'dept') {
          // Departamento escreveu -> avisa os admins com e-mail
          admins.filter(a => a.email).forEach(a => sendEmail(
            a.email,
            `Nova mensagem de ${updated.department} sobre "${updated.title || ''}"`,
            `Olá, ${a.name}!\n\n` +
            `${last.author} (${updated.department}) enviou uma mensagem sobre "${updated.title || ''}":\n\n` +
            `"${last.text}"\n\n` +
            `Responda pelo painel: ${APP_URL}\n\n` +
            `— Ministério de Mídia · ADVEC Curitiba`
          ));
        }
      }
    } catch (e) {
      toast.error('Erro ao atualizar: ' + (e?.message || 'tente novamente'));
    }
  };

  const deleteRequest = async (request) => {
    try {
      // limpa arquivos do storage (best-effort)
      for (const f of request.referenceFiles || []) {
        try { await FileStore.remove(f); } catch {}
      }
      for (const d of request.deliveries || []) {
        if (d?.file) { try { await FileStore.remove(d.file); } catch {} }
      }
      await dbDeleteRequest(request.id);
      toast.success('Solicitação removida');
    } catch (e) {
      toast.error('Erro ao remover: ' + (e?.message || 'tente novamente'));
    }
  };

  const addDepartment = async (name) => {
    try {
      await dbInsertDepartment(name);
    } catch (e) {
      toast.error('Erro ao criar: ' + (e?.message || 'tente novamente'));
    }
  };

  const updateDepartment = async (id, name, password) => {
    const old = departments.find(d => d.id === id);
    if (!old) return;
    try {
      await dbUpdateDepartment(id, old.name, name, password === undefined ? old.password : password);
    } catch (e) {
      toast.error('Erro ao editar: ' + (e?.message || 'tente novamente'));
    }
  };

  const changeDepartmentPassword = async (id, newPass) => {
    try {
      await dbUpdateDepartmentPassword(id, newPass);
    } catch (e) {
      toast.error('Erro ao alterar senha: ' + (e?.message || 'tente novamente'));
      throw e;
    }
  };

  const removeDepartment = async (id) => {
    try {
      await dbDeleteDepartment(id);
    } catch (e) {
      toast.error('Erro ao remover: ' + (e?.message || 'tente novamente'));
    }
  };

  const addContent = async (c) => {
    try { await dbInsertContent(c); }
    catch (e) { toast.error('Erro ao criar conteúdo: ' + (e?.message || 'tente novamente')); throw e; }
  };
  const updateContent = async (c) => {
    try { await dbUpdateContent(c); }
    catch (e) { toast.error('Erro ao atualizar conteúdo: ' + (e?.message || 'tente novamente')); throw e; }
  };
  const removeContent = async (id) => {
    try { await dbDeleteContent(id); }
    catch (e) { toast.error('Erro ao remover conteúdo: ' + (e?.message || 'tente novamente')); throw e; }
  };

  const addStyle = async (s) => {
    try { await dbInsertStyle(s); }
    catch (e) { toast.error('Erro ao criar estilo: ' + (e?.message || 'tente novamente')); throw e; }
  };
  const updateStyle = async (s) => {
    try { await dbUpdateStyle(s); }
    catch (e) { toast.error('Erro ao atualizar estilo: ' + (e?.message || 'tente novamente')); throw e; }
  };
  const removeStyle = async (id) => {
    try { await dbDeleteStyle(id); }
    catch (e) { toast.error('Erro ao remover estilo: ' + (e?.message || 'tente novamente')); throw e; }
  };

  const addAdmin = async (a) => {
    try { await dbInsertAdmin(a); }
    catch (e) { toast.error('Erro ao criar admin: ' + (e?.message || 'tente novamente')); throw e; }
  };
  const updateAdmin = async (a) => {
    try { await dbUpdateAdmin(a); }
    catch (e) { toast.error('Erro ao atualizar admin: ' + (e?.message || 'tente novamente')); throw e; }
  };
  const removeAdmin = async (id) => {
    try { await dbDeleteAdmin(id); }
    catch (e) { toast.error('Erro ao remover admin: ' + (e?.message || 'tente novamente')); throw e; }
  };

  if (loading) {
    return (
      <div className="mm-app flex items-center justify-center">
        <div className="flex flex-col items-center gap-3">
          <Loader2 className="w-6 h-6 text-brand-300 animate-spin" />
          <p className="text-sm text-zinc-300">Carregando sistema...</p>
        </div>
      </div>
    );
  }

  if (!session) {
    return (
      <div className="mm-app">
        <LoginView
          onLogin={handleLogin}
          departments={departments}
          admins={admins}
          onLoginVolunteer={dbLoginVolunteer}
          onSignupVolunteer={dbSignupVolunteer}
        />
      </div>
    );
  }

  if (session.type === 'admin') {
    return (
      <div className="mm-app">
        <AdminDashboard
          requests={requests}
          departments={departments}
          contents={contents}
          admin={admins.find(a => a.id === session.admin?.id) || session.admin}
          admins={admins}
          aiStyles={aiStyles}
          volunteers={volunteers}
          events={events}
          signups={signups}
          feedbacks={feedbacks}
          announcements={announcements}
          areaRequests={areaRequests}
          onLogout={handleLogout}
          onSubmitRequest={submitRequest}
          onUpdateRequest={updateRequest}
          onDeleteRequest={deleteRequest}
          onAddDepartment={addDepartment}
          onUpdateDepartment={updateDepartment}
          onRemoveDepartment={removeDepartment}
          onAddContent={addContent}
          onUpdateContent={updateContent}
          onRemoveContent={removeContent}
          onAddAdmin={addAdmin}
          onUpdateAdmin={updateAdmin}
          onRemoveAdmin={removeAdmin}
          onAddStyle={addStyle}
          onUpdateStyle={updateStyle}
          onRemoveStyle={removeStyle}
          onUpdateVolunteer={async (v) => { try { await dbUpdateVolunteer(v); } catch (e) { toast.error(e?.message || 'Erro ao atualizar voluntário'); throw e; } }}
          onSetVolunteerStatus={async (id, status) => { try { await dbSetVolunteerStatus(id, status); } catch (e) { toast.error(e?.message || 'Erro ao alterar status'); throw e; } }}
          onRemoveVolunteer={async (id) => { try { await dbDeleteVolunteer(id); } catch (e) { toast.error(e?.message || 'Erro ao remover voluntário'); throw e; } }}
          onInsertEvent={async (e) => {
            try { return await dbInsertEvent(e); }
            catch (err) { toast.error(err?.message || 'Erro ao criar evento'); throw err; }
          }}
          onNotifyEvent={async (ev) => {
            const dateFmt = new Date(ev.date + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
            let sent = 0, skipped = 0;
            for (const v of volunteers) {
              if (v.status !== 'ativo' || v.notify === false) continue;
              if (!(v.whatsapp || v.phone)) continue;
              if (!v.areas.some(a => (ev.areasNeeded || []).includes(a))) continue;
              const msg = `📅 *Nova escala disponível*\n\n*${ev.title}*\n${dateFmt}\n\nÁreas em aberto: ${(ev.areasNeeded || []).map(a => AREA_META[a]?.label).filter(Boolean).join(', ')}${ev.contentIdea ? `\n\n💡 Ideia do dia: ${ev.contentIdea}` : ''}\n\nEntra no app para se candidatar!`;
              const r = await dbNotifyVolunteer({ volunteer: v, kind: 'new_event', reference: ev.id, message: msg });
              if (r?.ok) sent++; else if (r?.skipped) skipped++;
            }
            return { sent, skipped };
          }}
          onUpdateEvent={async (e) => { try { await dbUpdateEvent(e); } catch (err) { toast.error(err?.message || 'Erro ao atualizar evento'); throw err; } }}
          onDeleteEvent={async (id) => { try { await dbDeleteEvent(id); } catch (err) { toast.error(err?.message || 'Erro ao excluir evento'); throw err; } }}
          onUpdateSignup={async (s) => {
            try {
              await dbUpdateSignup(s);
              // Notifica quando passa a 'confirmado'
              if (s.status === 'confirmado') {
                const vol = volunteers.find(v => v.id === s.volunteerId);
                const ev  = events.find(e => e.id === s.eventId);
                if (vol && ev) {
                  const dateFmt = new Date(ev.date + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
                  const msg = `✅ *Você foi confirmado na escala!*\n\n*${ev.title}*\n${dateFmt}\nÁrea: ${AREA_META[s.area]?.label || s.area}${ev.contentIdea ? `\n\n💡 Ideia do dia: ${ev.contentIdea}` : ''}\n\nA gente conta com você!`;
                  dbNotifyVolunteer({ volunteer: vol, kind: 'confirmed', reference: s.id, message: msg }).catch(() => {});
                }
              }
            } catch (err) { toast.error(err?.message || 'Erro'); throw err; }
          }}
          onDeleteSignup={async (id) => { try { await dbDeleteSignup(id); } catch (err) { toast.error(err?.message || 'Erro'); throw err; } }}
          onInsertFeedback={async (f) => { try { return await dbInsertFeedback(f); } catch (err) { toast.error(err?.message || 'Erro'); throw err; } }}
          onInsertAnnouncement={async (a) => { try { return await dbInsertAnnouncement(a); } catch (err) { toast.error(err?.message || 'Erro'); throw err; } }}
          onDeleteAnnouncement={async (id) => { try { await dbDeleteAnnouncement(id); } catch (err) { toast.error(err?.message || 'Erro'); throw err; } }}
          onApproveAreaRequest={async (r) => { try { await dbApproveAreaRequest(r, session.admin?.name || 'Admin'); } catch (err) { toast.error(err?.message || 'Erro'); throw err; } }}
          onRejectAreaRequest={async (r) => { try { await dbRejectAreaRequest(r, session.admin?.name || 'Admin'); } catch (err) { toast.error(err?.message || 'Erro'); throw err; } }}
          onBroadcast={async ({ announcement, message, areas }) => {
            // Envia msg pra voluntários ativos das áreas alvo (ou todos se vazio)
            const ativos = volunteers.filter(v => v.status === 'ativo');
            const naArea = ativos.filter(v => !areas || areas.length === 0 || v.areas.some(a => areas.includes(a)));
            const alvo = naArea.filter(v => v.notify !== false && (v.whatsapp || v.phone));
            const semFone = naArea.length - alvo.length;
            const txt = `📢 *Aviso — Ministério de Mídia*\n\n${message}`;
            let sent = 0, skipped = 0, failed = 0;
            for (const v of alvo) {
              const r = await dbNotifyVolunteer({ volunteer: v, kind: 'custom', reference: announcement?.id || `bc:${Date.now()}`, message: txt });
              if (r?.ok) sent++;
              else if (r?.skipped) skipped++;
              else failed++;
            }
            return { sent, skipped, failed, semFone, totalArea: naArea.length };
          }}
          onInsertSignup={async (s) => { try { return await dbInsertSignup(s); } catch (e) { toast.error(e?.message || 'Erro ao escalar'); throw e; } }}
          onBroadcastScale={async ({ event: ev, message, targets }) => {
            // Cada envio explícito usa uma referência nova — permite reenviar se a escala mudar
            const ref = `escala:${ev.id}:${Date.now()}`;
            let sent = 0, failed = 0;
            for (const v of targets) {
              try {
                const r = await dbNotifyVolunteer({ volunteer: v, kind: 'escala', reference: ref, message });
                if (r?.ok) sent++; else failed++;
              } catch { failed++; }
            }
            return { sent, failed };
          }}
          studyMaterials={studyMaterials}
          forumPosts={forumPosts}
          onAddStudyMaterial={async (m) => { try { return await dbInsertStudyMaterial({ ...m, author: session.admin?.name || 'Coordenação' }); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onUpdateStudyMaterial={async (m) => { try { await dbUpdateStudyMaterial(m); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onRemoveStudyMaterial={async (id) => { try { await dbDeleteStudyMaterial(id); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onPostForum={async (p) => { try { return await dbInsertForumPost({ ...p, authorType: 'admin', authorId: session.admin?.id || '', authorName: session.admin?.name || 'Coordenação' }); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onDeleteForumPost={async (id) => { try { await dbDeleteForumPost(id); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
        />
      </div>
    );
  }

  if (session.type === 'volunteer') {
    const liveVolunteer = volunteers.find(v => v.id === session.volunteer.id) || session.volunteer;
    // Se admin inativou/rejeitou enquanto logado, força logout
    if (liveVolunteer.status !== 'ativo') {
      setTimeout(() => {
        toast.info('Sua conta não está ativa. Fale com um administrador.');
        handleLogout();
      }, 0);
    }
    return (
      <div className="mm-app">
        <VolunteerDashboard
          volunteer={liveVolunteer}
          volunteers={volunteers}
          events={events}
          signups={signups}
          availability={availability}
          feedbacks={feedbacks}
          announcements={announcements}
          onLogout={handleLogout}
          onInsertSignup={async (s) => { try { return await dbInsertSignup(s); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onUpdateSignup={async (s) => { try { await dbUpdateSignup(s); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onDeleteSignup={async (id) => { try { await dbDeleteSignup(id); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onToggleAvailability={async (vid, day, val) => { try { await dbToggleAvailability(vid, day, val); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          areaRequests={areaRequests}
          onInsertAreaRequest={async (r) => { try { return await dbInsertAreaRequest(r); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onUpdateSelf={async (id, patch) => { try { await dbUpdateVolunteerSelf(id, patch); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          studyMaterials={studyMaterials}
          forumPosts={forumPosts}
          onPostForum={async (p) => { try { return await dbInsertForumPost({ ...p, authorType: 'volunteer', authorId: liveVolunteer.id, authorName: liveVolunteer.name }); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
          onDeleteForumPost={async (id) => { try { await dbDeleteForumPost(id); } catch (e) { toast.error(e?.message || 'Erro'); throw e; } }}
        />
      </div>
    );
  }

  // Usa sempre a versão mais atual do departamento (nome/senha podem mudar em tempo real)
  const liveDepartment = departments.find(d => d.id === session.department.id) || session.department;

  return (
    <div className="mm-app">
      <DepartmentDashboard
        department={liveDepartment}
        requests={requests}
        aiStyles={aiStyles}
        onLogout={handleLogout}
        onSubmitRequest={submitRequest}
        onUpdateRequest={updateRequest}
        onChangePassword={(newPass) => changeDepartmentPassword(liveDepartment.id, newPass)}
      />
    </div>
  );
};

  <div className="mm-app relative mm-min-dvh flex items-center justify-center px-4 py-10 overflow-hidden">
    <div className="mm-aurora" />
    <div className="relative z-10 w-full max-w-lg mm-slide-up">
      <div className="w-10 h-10 rounded-xl bg-[var(--gvv-blue)] flex items-center justify-center mb-6">

);

// Confere uma vez se o banco responde e se as tabelas existem.
const DbHealthBanner = () => {
  const [problem, setProblem] = useState(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const { error } = await supabase.from('departments').select('id', { head: true, count: 'exact' });
        if (!alive || !error) return;
        const msg = `${error.message || ''} ${error.code || ''}`;
        if (/PGRST205|42P01|schema cache|does not exist/i.test(msg)) {
          setProblem('O banco respondeu, mas as tabelas não existem. Rode supabase/SCHEMA_COMPLETO.sql no SQL Editor do Supabase.');
        } else if (/fetch|network|Failed/i.test(msg)) {
          setProblem('Sem conexão com o banco. Confira o endereço em config.js e se o projeto Supabase está ativo (projetos grátis pausam após dias sem uso).');
        } else {
          setProblem(`O banco recusou a leitura: ${error.message}`);
        }
      } catch (e) {
        if (alive) setProblem('Sem conexão com o banco. Confira o endereço em config.js e se o projeto Supabase está ativo.');
      }
    })();
    return () => { alive = false; };
  }, []);
  if (!problem) return null;
  return (
    <div role="alert" className="fixed z-[70] left-3 right-3 top-3 md:left-auto md:right-4 md:top-4 md:max-w-md mm-slide-up">
      <div className="rounded-2xl border border-amber-400/40 bg-[var(--bg-elevated)] shadow-[var(--shadow-xl)] p-4 flex gap-3 items-start">
        <AlertTriangle className="w-5 h-5 text-amber-500 flex-shrink-0 mt-0.5" />
        <div className="text-sm text-zinc-100 flex-1">{problem}</div>
        <button onClick={() => setProblem(null)} aria-label="Fechar aviso" className="mm-tap -m-1 p-1 rounded-lg text-zinc-400 hover:text-zinc-100 flex items-center justify-center">
          <X className="w-4 h-4" />
        </button>
      </div>
    </div>
  );
};

  if (!DB_CONFIGURED) {
    return (<><GlobalStyles /><DbSetupScreen /></>);

  return (
    <>
      <GlobalStyles />
      <DbHealthBanner />
      <ToastProvider>
        <ConfirmProvider>
          <AppContent />
        </ConfirmProvider>
      </ToastProvider>
    </>
  );
}
