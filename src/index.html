const VolUploadModal = ({ event, signup, volunteer, onClose, onSent }) => {
  const toast = useToast();
  const [files, setFiles] = useState([]);
  const [uploads, setUploads] = useState([]);
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const add = async (list) => {
    for (const file of Array.from(list || [])) {
      if (file.size > MAX_FILE_SIZE) { toast.error(`${file.name} passa de 50 MB. Mande pelo Drive e cole o link na observação.`); continue; }
      const key = `${file.name}-${Date.now()}-${Math.random()}`;
      setUploads(u => [...u, { key, name: file.name, p: 0 }]);
      try {
        const meta = await FileStore.save(file, (p) => setUploads(u => u.map(x => x.key === key ? { ...x, p } : x)));
        setFiles(f => [...f, meta]);
      } catch { toast.error(`Não deu pra enviar ${file.name}.`); }
      finally { setUploads(u => u.filter(x => x.key !== key)); }
    }
  };
  const send = async () => {
    if (!files.length && !note.trim()) { toast.error('Adicione arquivos ou um link.'); return; }
    if (uploads.length) { toast.info('Espere terminar o envio dos arquivos.'); return; }
    setBusy(true);
    const { error } = await supabase.from('event_uploads').insert({ event_id: event.id, volunteer_id: volunteer.id, area: signup.area, note: note.trim() || null, files });
    setBusy(false);
    if (error) { toast.error(isMissingTable(error) ? VOL_MISSING_HINT : error.message); return; }
    toast.success('Material enviado. Valeu! 🙌');
    onSent?.(); onClose();
  };
  const isImg = (f) => String(f.type || '').startsWith('image/');
  return (
    <Modal open onClose={onClose} size="md">
      <div className="p-5 sm:p-6 space-y-4">
        <div>
          <p className="mm-eyebrow">Material do culto</p>
          <h2 className="font-serif text-2xl text-zinc-50 mt-1">{event.title}</h2>
          <p className="text-sm text-zinc-400 mt-1">Fotos e vídeos de até 50 MB cada. Vídeo grande? Suba no Drive e cole o link abaixo.</p>
        </div>
        <label className="mm-tap mm-dropzone flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-white/20 px-4 py-8 text-sm text-zinc-300 cursor-pointer hover:border-brand-400/60">
          <ImagePlus className="w-8 h-8 text-brand-300" />
          <span className="font-semibold text-zinc-100">Escolher fotos e vídeos</span>
          <span className="text-xs text-zinc-500">da galeria ou do computador</span>
          <input type="file" multiple accept="image/*,video/*" className="hidden" onChange={e => { add(e.target.files); e.target.value = ''; }} />
        </label>
        {(files.length > 0 || uploads.length > 0) && (
          <div className="grid grid-cols-3 sm:grid-cols-4 gap-2">
            {files.map((f, i) => (
              <div key={f.id || i} className="relative aspect-square rounded-xl overflow-hidden bg-white/5 border border-white/10">
                {isImg(f) ? <img src={f.url} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex flex-col items-center justify-center gap-1 p-1"><Video className="w-6 h-6 text-zinc-400" /><span className="text-[10px] text-zinc-400 truncate w-full text-center">{f.name}</span></div>}
                <button onClick={() => setFiles(list => list.filter((_, j) => j !== i))} aria-label="Remover" className="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white flex items-center justify-center"><X className="w-3.5 h-3.5" /></button>
              </div>
            ))}
            {uploads.map(u => (
              <div key={u.key} className="aspect-square rounded-xl bg-white/5 border border-white/10 flex flex-col items-center justify-center gap-1">
                <Loader2 className="w-5 h-5 animate-spin text-zinc-400" />
                <span className="text-[11px] text-zinc-400">{Math.round((u.p || 0) * 100)}%</span>
              </div>
            ))}
          </div>
        )}
        <Textarea label="Observação ou link" rows={2} placeholder="Ex: link da pasta do Drive com os vídeos" value={note} onChange={e => setNote(e.target.value)} />
        <div className="flex gap-2 justify-end">
          <Button variant="ghost" onClick={onClose}>Cancelar</Button>
          <Button onClick={send} disabled={busy || uploads.length > 0}>{busy ? <Loader2 className="w-4 h-4 animate-spin" /> : <Send className="w-4 h-4" />} Enviar</Button>
        </div>
      </div>
    </Modal>
  );
};

const ReceivedMaterialView = ({ events = [], volunteers = [] }) => {
  const toast = useToast();
  const { rows, missing } = useLiveTable('event_uploads');
  const [zipping, setZipping] = useState(null);
  if (missing) {
    return <EmptyState icon={Database} title="Falta atualizar o banco" description="Rode SUPABASE_FASE10_VOLUNTARIOS_AGENDA.sql no SQL Editor do Supabase para receber material dos voluntários." />;
  }
  const groups = [];
  const byEvent = new Map();
  rows.forEach(r => {
    const k = r.event_id || 'sem-evento';
    if (!byEvent.has(k)) { byEvent.set(k, []); groups.push(k); }
    byEvent.get(k).push(r);
  });
  const isImg = (f) => String(f.type || '').startsWith('image/');
  const zipAll = async (k, title) => {
    if (!window.JSZip) { toast.error('Não deu pra montar o .zip.'); return; }
    setZipping(k);
    try {
      const zip = new window.JSZip();
      for (const r of byEvent.get(k)) {
        const who = slugify(volunteers.find(v => v.id === r.volunteer_id)?.name || 'voluntario').replace(/\s+/g, '-');
        for (const f of (r.files || [])) {
          const res = await fetch(f.url);
          zip.file(`${who}/${f.name}`, await res.blob());
        }
      }
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `${slugify(title).replace(/\s+/g, '-') || 'material'}.zip`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    } catch { toast.error('Falhou ao baixar algum arquivo.'); }
    finally { setZipping(null); }
  };
  if (!rows.length) {
    return <EmptyState icon={Camera} title="Nenhum material ainda" description="Depois de servir num culto, o voluntário vê um botão pra enviar fotos e vídeos. Tudo chega aqui, organizado por culto." />;
  }
  return (
    <div className="space-y-5">
      {groups.map(k => {
        const ev = events.find(e => e.id === k);
        const list = byEvent.get(k);
        const total = list.reduce((a, r) => a + (r.files || []).length, 0);
        const title = ev ? ev.title : 'Sem culto definido';
        return (
          <div key={k} className="mm-card rounded-3xl p-5 md:p-6">
            <div className="flex flex-wrap items-center gap-3">
              {ev && (() => { const d = new Date(ev.date + 'T12:00:00'); return (
                <div className="rounded-xl bg-white text-black w-14 text-center overflow-hidden flex-shrink-0">
                  <div className="text-[9px] font-bold uppercase py-0.5" style={{ background: 'var(--gvv-lime)' }}>{AG_WEEK[d.getDay()]}</div>
                  <div className="font-display text-2xl leading-none py-1">{d.getDate()}</div>
                </div>
              ); })()}
              <div className="min-w-0 flex-1">
                <h3 className="font-serif text-2xl text-zinc-50 truncate">{title}</h3>
                <div className="text-xs text-zinc-400">{total} arquivo{total === 1 ? '' : 's'} · {list.length} envio{list.length === 1 ? '' : 's'}</div>
              </div>
              {total > 0 && (
                <Button variant="secondary" size="sm" onClick={() => zipAll(k, title)} disabled={zipping === k}>
                  {zipping === k ? <Loader2 className="w-4 h-4 animate-spin" /> : <Download className="w-4 h-4" />} Baixar tudo (.zip)
                </Button>
              )}
            </div>
            <div className="space-y-4 mt-4">
              {list.map(r => {
                const v = volunteers.find(x => x.id === r.volunteer_id);
                const a = AREA_META[r.area];
                return (
                  <div key={r.id}>
                    <div className="flex items-center gap-2 text-sm mb-2">
                      <span className="mm-ava w-7 h-7 rounded-full flex items-center justify-center text-[11px]" style={avaStyle(v?.name || '?')}>{agInitials(v?.name || '?')}</span>
                      <span className="font-semibold text-zinc-100">{v?.name || 'Voluntário'}</span>
                      {a && <span className="text-xs text-zinc-400">· {a.label}</span>}
                      <span className="text-xs text-zinc-500 ml-auto">{new Date(r.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</span>
                    </div>
                    {r.note && <p className="text-sm text-zinc-300 mb-2 whitespace-pre-line break-words">{r.note}</p>}
                    <div className="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-6 gap-2">
                      {(r.files || []).map((f, i) => (
                        <a key={f.id || i} href={f.url} target="_blank" rel="noreferrer" title={f.name}
                          className="group relative aspect-square rounded-xl overflow-hidden bg-white/5 border border-white/10 hover:border-brand-400/60">
                          {isImg(f) ? <img src={f.url} alt="" loading="lazy" className="w-full h-full object-cover" />
                            : <div className="w-full h-full flex flex-col items-center justify-center gap-1 p-1"><Video className="w-6 h-6 text-zinc-400" /><span className="text-[10px] text-zinc-400 truncate w-full text-center">{f.name}</span></div>}
                          <span className="absolute bottom-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white items-center justify-center hidden group-hover:flex"><Download className="w-3.5 h-3.5" /></span>
                        </a>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
};

const VolunteerDashboard = ({ volunteer, volunteers = [], events = [], signups = [], availability = [], feedbacks = [], announcements = [], areaRequests = [], onLogout, onInsertSignup, onUpdateSignup, onDeleteSignup, onToggleAvailability, onInsertAreaRequest, onUpdateSelf, studyMaterials = [], forumPosts = [], onPostForum, onDeleteForumPost }) => {
  const [areaRequestOpen, setAreaRequestOpen] = useState(false);
  const [waConfigOpen, setWaConfigOpen] = useState(false);
  const myAreaRequests = areaRequests.filter(r => r.volunteerId === volunteer.id);
  const hasWa = (volunteer.whatsapp || volunteer.phone) && volunteer.notify !== false;
  const stats = computeVolunteerStats(volunteer, signups, feedbacks, events);
  const myAnnouncements = announcements.filter(a => a.areas.length === 0 || a.areas.some(x => volunteer.areas.includes(x)));
  const myBadges = earnedBadges(stats);
  const myFeedbacks = feedbacks.filter(f => f.volunteerId === volunteer.id);
  // ranking
  const rankOrdered = volunteers.filter(v => v.status === 'ativo').sort((a, b) => (b.xp || 0) - (a.xp || 0));
  const myRank = rankOrdered.findIndex(v => v.id === volunteer.id) + 1;
  const [tab, setTab] = useState('home');
  const [pickerEvent, setPickerEvent] = useState(null); // { event, area, existing }
  const toast = useToast();
  const ask = useConfirm();

  // Recados do mural: o voluntario pode marcar como lido (fica salvo neste aparelho)
  const ANN_KEY = `mm-ann-read-${volunteer.id}`;
  const [readAnn, setReadAnn] = useState(() => { try { return JSON.parse(localStorage.getItem(ANN_KEY) || '[]'); } catch { return []; } });
  const markAnnRead = (id) => setReadAnn(prev => { const n = [...prev, id]; try { localStorage.setItem(ANN_KEY, JSON.stringify(n)); } catch {} return n; });

  // Troca de escala
  const { rows: swapRows, missing: swapsMissing, reload: reloadSwaps } = useLiveTable('scale_swaps');
  const askSwap = async ({ event, signup }) => {
    const ok = await ask({ title: 'Pedir troca?', message: `Sua vaga em “${event.title}” fica aberta pros colegas da sua área. Até alguém assumir, ela continua sendo sua.`, confirmLabel: 'Pedir troca' });
    if (!ok) return;
    const { error } = await supabase.from('scale_swaps').insert({
      signup_id: signup.id, event_id: event.id, area: signup.area, role: signup.role || null, from_volunteer_id: volunteer.id,
    });
    if (error) { toast.error(isMissingTable(error) ? VOL_MISSING_HINT : error.message); return; }
    reloadSwaps();
    toast.success('Pedido de troca enviado pra equipe.');
  };
  const cancelSwap = async (s) => {
    const { error } = await supabase.from('scale_swaps').update({ status: 'cancelada' }).eq('id', s.id);
    if (error) toast.error(error.message); else { reloadSwaps(); toast.success('Pedido de troca cancelado.'); }
  };
  const takeSwap = async (s) => {
    const ev = events.find(e => e.id === s.event_id);
    const ok = await ask({ title: 'Assumir essa escala?', message: `Você entra em “${ev?.title || 'escala'}” no lugar do colega.`, confirmLabel: 'Assumir' });
    if (!ok) return;
    // so assume se ainda estiver aberta (evita dois pegarem a mesma vaga)
    const { data: still } = await supabase.from('scale_swaps').update({ status: 'assumida', to_volunteer_id: volunteer.id, taken_at: new Date().toISOString() })
      .eq('id', s.id).eq('status', 'aberta').select();
    if (!still || !still.length) { toast.error('Alguém já assumiu essa vaga.'); return; }
    const { error } = await supabase.from('event_signups').update({ volunteer_id: volunteer.id, status: 'confirmado' }).eq('id', s.signup_id);
    if (error) { toast.error(error.message); return; }
    reloadSwaps();
    toast.success('Escala assumida! Ela já aparece no seu início. 🙌');
  };
  const goTo = (t) => {
    if (t === 'home-areas') { setTab('home'); setTimeout(() => document.getElementById('vol-areas')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60); return; }
    setTab(t); window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const prog = xpToNext(volunteer.xp || 0);
  const pct = prog.next > 0 ? Math.min(100, Math.round(((prog.next - prog.remaining) / prog.next) * 100)) : 0;

  // Minhas candidaturas confirmadas / propostas
  const mySignups = signups.filter(s => s.volunteerId === volunteer.id);
  const todayStr = YYYYMMDD(new Date());
  const upcomingEvents = events
    .filter(e => e.date >= todayStr)
    .sort((a, b) => a.date.localeCompare(b.date));

  const myUpcoming = upcomingEvents
    .map(e => ({ event: e, signups: mySignups.filter(s => s.eventId === e.id) }))
    .filter(x => x.signups.length > 0);

  // Voluntário: etapa atual do treinamento e nota média
  const myStage = Number(volunteer.trainingStage || 0);
  const myAvg = stats.feedbackCount > 0 ? stats.avgRating : 0;
  const canServe = myStage >= 3; // aprovado a partir da etapa 3

  // Escalas relevantes — regras:
  //  * Ainda em treinamento (stage < 3): SÓ vê eventos is_training cuja etapa é a próxima do seu progresso
  //  * Aprovado (stage >= 3): vê eventos NÃO-treinamento cuja min_rating <= sua nota média
  //    (voluntários sem avaliações ainda: min_rating deve ser 0)
  const relevant = upcomingEvents.filter(e => {
    const needs = (e.areasNeeded || []).filter(a => volunteer.areas.includes(a));
    if (needs.length === 0) return false;
    if (e.isTraining) {
      // Treinamento aparece só pra quem está exatamente na etapa anterior (próximo passo)
      const target = Number(e.trainingStage || 1);
      return !canServe && target === (myStage + 1);
    }
    // Culto normal
    if (!canServe) return false; // ainda em treinamento não vê culto normal
    const minR = Number(e.minRating || 0);
    if (minR > 0 && myAvg < minR) return false;
    return true;
  });

  const openPicker = (event, area) => {
    const existing = mySignups.find(s => s.eventId === event.id && s.area === area);
    setPickerEvent({ event, area, existing });
  };

  const [volMoreOpen, setVolMoreOpen] = useState(false);

  return (
    <div className="mm-min-dvh flex flex-col">
      <div className="mm-aurora" />
      <header className="relative z-10 border-b border-white/10 backdrop-blur-xl bg-zinc-950/60">
        <div className="max-w-5xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between gap-4">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-10 h-10 rounded-xl bg-[var(--gvv-blue)] flex items-center justify-center shadow-lg shadow-brand-900/40 flex-shrink-0">
              <Sparkles className="w-5 h-5 text-[var(--gvv-lime)]" fill="currentColor" strokeWidth={1.5} />
            </div>
            <div className="min-w-0">
              <div className="text-xs text-zinc-400 uppercase tracking-wider">Ministério de Mídia</div>
              <div className="font-serif text-lg text-zinc-50 truncate">Olá, {volunteer.name.split(' ')[0]}</div>
            </div>
          </div>
          {/* No celular tema e sair moram na aba "Mais" — aqui so o que e acao. */}
          <div className="flex items-center gap-2.5 flex-shrink-0">
            <ThemeToggle compact className="hidden md:flex" />
            <button onClick={() => setWaConfigOpen(true)} title={hasWa ? 'Notificações ativadas' : 'Ativar notificações no WhatsApp'} className={`mm-tap text-xs inline-flex items-center gap-1.5 border rounded-xl px-2.5 py-2 transition-colors ${hasWa ? 'text-emerald-600 border-emerald-400/30 hover:bg-emerald-500/10' : 'text-zinc-400 border-white/10 hover:text-emerald-600 hover:border-emerald-400/30'}`}>
              <MessageSquare className="w-4 h-4 flex-shrink-0" />
              <span className="hidden sm:inline">{hasWa ? 'WhatsApp ativo' : 'Ativar WhatsApp'}</span>
            </button>
            <button onClick={onLogout} className="hidden md:inline-flex text-xs text-zinc-400 hover:text-rose-500 items-center gap-1.5">
              <LogOut className="w-3.5 h-3.5" /> Sair
            </button>
          </div>
        </div>
        {/* Desktop: abas no topo. Celular: barra inferior (VOL_TABS abaixo). */}
        <div className="hidden md:flex max-w-5xl mx-auto px-4 md:px-8 gap-2 border-t border-white/5 overflow-x-auto mm-noscroll">
          {VOL_TABS.map(t => {
            const Ic = t.icon;
            const active = tab === t.id;
            const badge = t.id === 'escalas' ? (myUpcoming.length || null) : null;
            return (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-4 py-2.5 -mb-px border-b-2 text-sm font-medium inline-flex items-center gap-2 transition-colors flex-shrink-0 whitespace-nowrap ${active ? 'border-brand-400 text-brand-200' : 'border-transparent text-zinc-400 hover:text-zinc-200'}`}>
                <Ic className="w-4 h-4" /> {t.label}
                {badge != null && <span className="text-[10px] font-bold px-1.5 py-0.5 rounded-full bg-brand-500/25 border border-brand-400/40 text-brand-100">{badge}</span>}
              </button>
            );
          })}
        </div>
      </header>

      <MobileTabBar
        items={VOL_TABS.map(t => ({
          ...t,
          badge: t.id === 'escalas' ? (myUpcoming.length || 0) : 0,
        }))}
        active={tab}
        onChange={setTab}
        moreOpen={volMoreOpen}
        onOpenMore={() => setVolMoreOpen(true)}
      />

      {volMoreOpen && (
        <div className="md:hidden fixed inset-0 z-50 flex items-end mm-fade-in" onClick={() => setVolMoreOpen(false)}>
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" />
          <div className="relative w-full rounded-t-3xl bg-[var(--bg-surface)] border-t border-white/12 p-3 pb-2 mm-slide-up mm-safe-b" onClick={(e) => e.stopPropagation()}>
            <span className="mm-sheet-grip block mb-2" />
            {VOL_TABS.slice(4).map(t => {
              const Ic = t.icon;
              return (
                <button key={t.id} onClick={() => { setTab(t.id); setVolMoreOpen(false); }}
                  className={`mm-tap w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm ${tab === t.id ? 'bg-white/8 text-zinc-50' : 'text-zinc-300'}`}>
                  <Ic className="w-4 h-4" /> <span className="font-medium">{t.label}</span>
                </button>
              );
            })}
            <div className="h-px bg-white/8 my-2" />
            <ThemeToggle className="w-full justify-start mm-tap" />
            <button onClick={onLogout} className="mm-tap w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm text-zinc-400 hover:text-rose-500">
              <LogOut className="w-4 h-4" /> <span className="font-medium">Sair</span>
            </button>
          </div>
        </div>
      )}

      <main className="relative z-10 flex-1 max-w-5xl w-full mx-auto px-4 md:px-8 py-5 md:py-6 space-y-5 mm-pad-tabbar">
        {/* Recados: so no Inicio, e cada um pode ser marcado como lido */}
        {tab === 'home' && myAnnouncements.filter(a => !readAnn.includes(a.id)).length > 0 && (
          <div className="space-y-2 mm-fade-in">
            {myAnnouncements.filter(a => !readAnn.includes(a.id)).map(a => (
              <div key={a.id} className="rounded-2xl border border-[var(--brand-line)] bg-[var(--bg-surface)] p-4 relative overflow-hidden">
                <span className="absolute left-0 top-0 bottom-0 w-1.5" style={{ background: 'var(--gvv-lime)' }} />
                <div className="flex items-start gap-3 pl-1">
                  <div className="w-9 h-9 rounded-xl mm-lime-bg flex items-center justify-center flex-shrink-0">
                    <Megaphone className="w-4 h-4" />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-[10px] font-bold uppercase tracking-wider text-zinc-400 mb-0.5">Recado da liderança</div>
                    <p className="text-sm text-zinc-50 whitespace-pre-line leading-relaxed">{a.message}</p>
                    <div className="text-[11px] text-zinc-500 mt-1.5">
                      {a.author} · {new Date(a.createdAt).toLocaleDateString('pt-BR')}
                    </div>
                  </div>
                  <button onClick={() => markAnnRead(a.id)} className="mm-tap text-xs font-semibold text-zinc-300 hover:text-zinc-50 px-2.5 py-1.5 rounded-lg border border-white/12 hover:bg-white/8 flex-shrink-0 inline-flex items-center gap-1">
                    <Check className="w-3.5 h-3.5" /> Lido
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}

        {tab === 'home' && (() => {
          const tier = titleFor(prog.level);
          // próxima escala confirmada
          const nextConfirmed = upcomingEvents
            .flatMap(e => mySignups.filter(s => s.eventId === e.id && s.status === 'confirmado').map(s => ({ event: e, signup: s })))
            .sort((a, b) => a.event.date.localeCompare(b.event.date))[0];
          const daysTo = nextConfirmed ? Math.round((new Date(nextConfirmed.event.date + 'T00:00:00') - new Date(todayStr + 'T00:00:00')) / 86400000) : null;
          // meta mensal: 4 escalas
          const META_MENSAL = 4;
          const now = new Date();
          const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
          const servedThisMonth = mySignups.filter(s => {
            if (s.status !== 'confirmado') return false;
            const ev = events.find(e => e.id === s.eventId);
            return ev && new Date(ev.date + 'T00:00:00') >= monthStart && new Date(ev.date + 'T00:00:00') <= now;
          }).length;
          const metaPct = Math.min(100, Math.round((servedThisMonth / META_MENSAL) * 100));

          const mySwap = nextConfirmed && swapRows.find(s => s.signup_id === nextConfirmed.signup.id && s.status === 'aberta');

          return (
          <>
            {/* 1) O que mais importa: quando eu sirvo */}
            <VolNextScaleHero next={nextConfirmed} daysTo={daysTo} mySwap={mySwap} swapsMissing={swapsMissing}
              team={nextConfirmed ? signups.filter(s => s.eventId === nextConfirmed.event.id && s.status === 'confirmado' && s.volunteerId !== volunteer.id).map(s => volunteers.find(v => v.id === s.volunteerId)).filter(Boolean).filter((v, i, a) => a.findIndex(x => x.id === v.id) === i) : []}
              onAskSwap={askSwap} onCancelSwap={cancelSwap} onGoEscalas={() => goTo('escalas')} />

            {/* 2) Vagas que colegas liberaram */}
            {!swapsMissing && (
              <VolOpenSwaps swaps={swapRows} volunteer={volunteer} events={events} signups={signups} volunteers={volunteers} onTake={takeSwap} />
            )}

            {/* 3) Material depois do culto */}
            <VolUploadCard volunteer={volunteer} events={events} mySignups={mySignups} />

            {/* 4) Primeiros passos */}
            <VolOnboarding volunteer={volunteer} hasWa={hasWa}
              hasAvailability={availability.some(a => a.volunteerId === volunteer.id)}
              hasSignup={mySignups.length > 0}
              onGo={goTo} onWa={() => setWaConfigOpen(true)} />

            {/* HERO CARD — nivel e XP */}
            <div className={`relative overflow-hidden rounded-3xl border ${tier.border} bg-gradient-to-br ${tier.from} ${tier.via} ${tier.to} p-6 md:p-8 mm-fade-in shadow-2xl`}>
              <div className="absolute -top-16 -right-16 w-64 h-64 rounded-full bg-gradient-to-br from-white/10 to-transparent blur-3xl pointer-events-none" />
              <div className="absolute -bottom-20 -left-20 w-72 h-72 rounded-full bg-gradient-to-tr from-white/5 to-transparent blur-3xl pointer-events-none" />

              <div className="relative flex items-start justify-between gap-4 mb-5">
                <div className="min-w-0">
                  <div className={`inline-flex items-center gap-1.5 text-[10px] uppercase tracking-[0.2em] font-bold ${tier.text} mb-2`}>
                    <Sparkles className="w-3 h-3" /> {tier.title}
                  </div>
                  <div className="flex items-baseline gap-3">
                    <span className="font-serif text-[64px] leading-none text-zinc-50 tabular-nums">{prog.level}</span>
                    <span className="text-xs text-zinc-400 uppercase tracking-wider">nível</span>
                  </div>
                </div>
                {myRank > 0 && (
                  <div className="rounded-2xl border border-white/10 bg-black/25 backdrop-blur px-3 py-2 text-center">
                    <div className="text-[9px] uppercase tracking-wider text-zinc-400">Ranking</div>
                    <div className="font-serif text-2xl text-brand-200 leading-none">#{myRank}</div>
                    <div className="text-[9px] text-zinc-500 mt-0.5">de {rankOrdered.length}</div>
                  </div>
                )}
              </div>

              <div className="relative">
                <div className="flex items-baseline justify-between mb-1.5">
                  <span className="text-xs text-zinc-300"><span className={`font-medium ${tier.text}`}>{volunteer.xp || 0}</span> <span className="text-zinc-500">/ {prog.next} XP</span></span>
                  <span className="text-[10px] text-zinc-400">faltam {prog.remaining} pro nv {prog.level + 1}</span>
                </div>
                <div className="w-full h-2.5 rounded-full bg-black/40 overflow-hidden border border-white/5">
                  <div className={`h-full bg-gradient-to-r ${tier.from.replace('/25','/80').replace('/30','/80').replace('/35','/90').replace('/40','/90')} transition-all duration-700`} style={{ width: `${pct}%` }} />
                </div>
              </div>

              <div className="relative grid grid-cols-3 gap-2 mt-5 pt-5 border-t border-white/10">
                <div className="text-center">
                  <div className="font-serif text-2xl text-zinc-50 tabular-nums">{stats.servedLast30d}</div>
                  <div className="text-[9px] uppercase tracking-wider text-zinc-400 mt-0.5">em 30 dias</div>
                </div>
                <div className="text-center border-x border-white/10">
                  <div className="font-serif text-2xl text-zinc-50 tabular-nums">{stats.confirmed}</div>
                  <div className="text-[9px] uppercase tracking-wider text-zinc-400 mt-0.5">escalas total</div>
                </div>
                <div className="text-center">
                  <div className="font-serif text-2xl text-zinc-50 tabular-nums">{myBadges.length}</div>
                  <div className="text-[9px] uppercase tracking-wider text-zinc-400 mt-0.5">conquistas</div>
                </div>
              </div>
            </div>

            {/* TREINAMENTO — mostrado enquanto não estiver formado */}
            {!canServe && (
              <div className="mm-lux mm-lux-hoje p-5 sm:p-6 mm-fade-in">
                <div className="flex items-baseline justify-between mb-3">
                  <div>
                    <div className="mm-eyebrow text-emerald-500">Treinamento</div>
                    <div className="mm-display text-xl text-zinc-50">
                      {myStage === 0 ? 'Bem-vindo ao Ministério!' : `Você está na etapa ${myStage} de ${TRAINING_TOTAL}`}
                    </div>
                  </div>
                  <button onClick={() => setTab('guia')} className="text-[11px] text-emerald-500 hover:underline">Como funciona →</button>
                </div>
                {/* Barra de progresso 4 pontos */}
                <div className="grid grid-cols-4 gap-2 mb-3">
                  {TRAINING_STAGES.map(s => {
                    const done = myStage >= s.n;
                    const current = myStage + 1 === s.n;
                    return (
                      <div key={s.n} className={`h-1.5 rounded-full ${done ? 'bg-emerald-500' : current ? 'bg-emerald-500/30' : 'bg-white/8'}`} />
                    );
                  })}
                </div>
                <p className="text-sm text-zinc-300 leading-relaxed">
                  {myStage === 0
                    ? 'Espera o admin te marcar na primeira etapa. Enquanto isso, dá uma olhada na aba "Como funciona a mídia".'
                    : `Próximo passo: ${TRAINING_STAGES.find(s => s.n === myStage + 1)?.title}. Só aparecem escalas de treinamento pra você por enquanto.`}
                </p>
              </div>
            )}
            {canServe && myStage < TRAINING_TOTAL && (
              <div className="mm-lux p-4 sm:p-5 mm-fade-in flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-400/30 flex items-center justify-center flex-shrink-0">
                  <Check className="w-5 h-5 text-emerald-500" strokeWidth={2.5} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold text-zinc-50">Aprovado para servir</div>
                  <div className="text-xs text-zinc-400">Falta a etapa 4 (aprovação final) — mas você já pode se candidatar às escalas.</div>
                </div>
              </div>
            )}

            {/* META MENSAL */}
            <div className="mm-card rounded-2xl backdrop-blur-xl bg-zinc-950/60 p-5 mm-fade-in">
              <div className="flex items-center justify-between mb-3">
                <div>
                  <div className="text-[10px] uppercase tracking-wider text-zinc-400">Meta do mês</div>
                  <h3 className="font-serif text-lg text-zinc-50">{now.toLocaleDateString('pt-BR', { month: 'long' })}</h3>
                </div>
                <div className="text-right">
                  <div className="font-serif text-3xl text-zinc-50 tabular-nums">{servedThisMonth}<span className="text-zinc-600 text-lg">/{META_MENSAL}</span></div>
                  <div className="text-[10px] uppercase tracking-wider text-zinc-400">servidas</div>
                </div>
              </div>
              <div className="w-full h-2 rounded-full bg-black/40 overflow-hidden border border-white/5">
                <div className={`h-full transition-all duration-700 ${servedThisMonth >= META_MENSAL ? 'bg-gradient-to-r from-emerald-400 to-emerald-500' : 'bg-gradient-to-r from-brand-400 to-brand-400'}`} style={{ width: `${metaPct}%` }} />
              </div>
              <p className="text-xs text-zinc-400 mt-2">
                {servedThisMonth >= META_MENSAL ? '🎉 Meta batida! Continua servindo pra ganhar mais XP.' : `Faltam ${META_MENSAL - servedThisMonth} pra bater a meta.`}
              </p>
            </div>

            {/* CONQUISTAS */}
            <div className="mm-card rounded-2xl backdrop-blur-xl bg-zinc-950/60 p-5 mm-fade-in">
              <div className="flex items-center justify-between mb-4">
                <h3 className="font-serif text-lg text-zinc-50 flex items-center gap-2">
                  <Sparkles className="w-4 h-4 text-brand-200" /> Conquistas
                </h3>
                <div className="text-xs text-zinc-400">
                  <span className="text-brand-200 font-medium">{myBadges.length}</span> / {BADGES.length}
                </div>
              </div>
              <div className="grid grid-cols-3 md:grid-cols-4 gap-2.5">
                {BADGES.map(b => {
                  const got = myBadges.some(x => x.id === b.id);
                  const rar = RARITY[b.rarity] || RARITY.comum;
                  const Ic = b.icon;
                  return (
                    <div
                      key={b.id}
                      title={got ? `${rar.label} · ${b.hint}` : `Bloqueado — ${b.hint}`}
                      className={`group relative rounded-xl border p-3 text-center transition-all overflow-hidden ${got ? `bg-gradient-to-br ${rar.bg} ${rar.border} ${rar.text} shadow-lg` : 'bg-black/30 border-white/8 text-zinc-600'}`}
                    >
                      {got && b.rarity === 'lendario' && (
                        <span className="absolute -top-6 -right-6 w-16 h-16 rounded-full bg-gradient-to-br from-brand-300/60 to-transparent blur-lg pointer-events-none" />
                      )}
                      <div className={`relative w-9 h-9 mx-auto mb-2 rounded-lg border flex items-center justify-center ${got ? 'bg-black/25 border-white/20' : 'bg-white/[0.02] border-white/5'}`}>
                        {got ? <Ic className="w-4 h-4" /> : <Lock className="w-3.5 h-3.5" />}
                      </div>
                      <div className="text-[10px] font-semibold leading-tight relative">{b.label}</div>
                      {got && (
                        <div className={`text-[8px] uppercase tracking-wider mt-1 opacity-70 relative`}>{rar.label}</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Retornos da equipe — só o texto de coaching; a nota numérica é interna da liderança */}
            {myFeedbacks.some(f => f.note) && (
              <div className="mm-card rounded-2xl backdrop-blur-xl bg-zinc-950/60 p-5 mm-fade-in">
                <h3 className="font-serif text-lg text-zinc-50 mb-1 flex items-center gap-2">
                  <MessageSquare className="w-4 h-4 text-sky-200" /> Retornos da equipe
                </h3>
                <p className="text-xs text-zinc-400 mb-3">Palavras da liderança pra te ajudar a crescer.</p>
                <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                  {myFeedbacks.filter(f => f.note).slice(0, 6).map(f => {
                    const ev = events.find(e => e.id === f.eventId);
                    const meta = f.area ? AREA_META[f.area] : null;
                    return (
                      <div key={f.id} className="rounded-xl border border-white/10 bg-white/[0.03] p-3">
                        <div className="flex items-center gap-2 mb-2 flex-wrap">
                          {meta && <span className={`text-[10px] px-1.5 py-0.5 rounded border ${meta.border} ${meta.text} inline-flex items-center gap-1`}>
                            {React.createElement(meta.icon, { className: 'w-2.5 h-2.5' })} {meta.label}
                          </span>}
                          {ev && <span className="text-[11px] text-zinc-400">{ev.title}</span>}
                          <span className="text-[10px] text-zinc-500 ml-auto">{new Date(f.createdAt).toLocaleDateString('pt-BR')}</span>
                        </div>
                        <p className="text-sm text-zinc-200 whitespace-pre-line leading-relaxed">"{f.note}"</p>
                        {f.author && <p className="text-[10px] text-zinc-500 mt-1.5">— {f.author}</p>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="mm-card rounded-2xl p-5 backdrop-blur-xl bg-zinc-950/60 mm-fade-in">
              <div className="flex items-center justify-between mb-4">
                <h3 id="vol-areas" className="font-serif text-lg text-zinc-50 scroll-mt-24">Minhas áreas</h3>
                <button onClick={() => setAreaRequestOpen(true)} className="text-xs text-brand-200 hover:text-brand-100 inline-flex items-center gap-1 border border-brand-400/30 rounded-md px-2.5 py-1 hover:bg-brand-500/10 transition-colors">
                  <Plus className="w-3 h-3" /> Nova área
                </button>
              </div>
              {myAreaRequests.filter(r => r.status === 'pendente').length > 0 && (
                <div className="mb-3 rounded-lg border border-brand-400/30 bg-brand-500/10 px-3 py-2 text-xs text-brand-100 flex items-center gap-2">
                  <Clock className="w-3 h-3" />
                  Solicitações pendentes: {myAreaRequests.filter(r => r.status === 'pendente').map(r => AREA_META[r.area]?.label).join(', ')}
                </div>
              )}
              {volunteer.areas.length === 0 ? (
                <p className="text-sm text-zinc-400">Nenhuma área selecionada. Fale com um admin.</p>
              ) : (
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {volunteer.areas.map(a => {
                    const meta = AREA_META[a]; if (!meta) return null;
                    const Ic = meta.icon;
                    return (
                      <div key={a} className={`flex items-center gap-2 px-3 py-2.5 rounded-lg border bg-gradient-to-br ${meta.color} ${meta.border} ${meta.text}`}>
                        <Ic className="w-4 h-4" />
                        <span className="text-sm font-medium">{meta.label}</span>
                      </div>
                    );
                  })}
                </div>
              )}

          onConfirm={async (idea) => {
            if (pickerEvent.existing) {
              await onUpdateSignup({ ...pickerEvent.existing, volunteerIdea: idea });
              toast.success('Ideia atualizada.');
            } else {
              await onInsertSignup({ eventId: pickerEvent.event.id, volunteerId: volunteer.id, area: pickerEvent.area, volunteerIdea: idea, status: 'proposto' });
              toast.success('Candidatura enviada!');
            }
          }}
          onCancel={async () => {
            if (pickerEvent.existing) {
              await onDeleteSignup(pickerEvent.existing.id);
              toast.info('Candidatura removida.');
            }
          }}
        />
      )}

      {areaRequestOpen && (
        <RequestAreaModal
          volunteer={volunteer}
          existingRequests={myAreaRequests}
          onClose={() => setAreaRequestOpen(false)}
          onSubmit={onInsertAreaRequest}
        />
      )}

      {waConfigOpen && (
        <WhatsappConfigModal
          volunteer={volunteer}
          onClose={() => setWaConfigOpen(false)}
          onSave={async (patch) => { await onUpdateSelf(volunteer.id, patch); }}
        />
      )}
    </div>
  );
};

/* =====================================================================
   SCHEDULING CALENDAR — grid mensal compartilhado (admin/voluntário)
===================================================================== */
const SCH_MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const SCH_WEEK_DAYS   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

const SchedulingCalendar = ({ events, signups = [], availability = [], mode = 'admin', volunteerId = null, onDayClick, onEventClick, onToggleAvailability, initialMonth }) => {
  const [cursor, setCursor] = useState(() => {
    const d = initialMonth ? new Date(initialMonth) : new Date();
    return new Date(d.getFullYear(), d.getMonth(), 1);
  });

  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1).getDay(); // 0=dom
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = YYYYMMDD(new Date());

  const cells = useMemo(() => {
    const arr = [];
    for (let i = 0; i < firstDay; i++) arr.push(null);
    for (let d = 1; d <= daysInMonth; d++) arr.push(YYYYMMDD(new Date(year, month, d)));
    return arr;
  }, [firstDay, daysInMonth, year, month]);

  const eventsByDay = useMemo(() => {
    const map = {};
    events.forEach(e => { (map[e.date] ||= []).push(e); });
    return map;
  }, [events]);

  const availableSet = useMemo(() => {
    if (!volunteerId) return new Set();
    return new Set(availability.filter(a => a.volunteerId === volunteerId).map(a => a.day));
  }, [availability, volunteerId]);

  const goPrev = () => setCursor(new Date(year, month - 1, 1));
  const goNext = () => setCursor(new Date(year, month + 1, 1));
  const goToday = () => { const t = new Date(); setCursor(new Date(t.getFullYear(), t.getMonth(), 1)); };

  return (
    <div className="mm-card rounded-2xl backdrop-blur-xl bg-zinc-950/60 overflow-hidden">
      <div className="flex items-center justify-between p-4 border-b border-white/10">
        <div className="flex items-center gap-2">
          <button onClick={goPrev} className="w-8 h-8 rounded-lg border border-white/10 hover:bg-white/5 flex items-center justify-center text-zinc-300"><ChevronRight className="w-4 h-4 rotate-180" /></button>
          <button onClick={goToday} className="text-xs px-2.5 py-1 rounded-md border border-white/10 hover:bg-white/5 text-zinc-300">Hoje</button>
          <button onClick={goNext} className="w-8 h-8 rounded-lg border border-white/10 hover:bg-white/5 flex items-center justify-center text-zinc-300"><ChevronRight className="w-4 h-4" /></button>
        </div>
        <h3 className="font-serif text-lg text-zinc-50">{SCH_MONTH_NAMES[month]} <span className="text-zinc-400">{year}</span></h3>
        {mode === 'admin' ? (
          <Button size="sm" onClick={() => onDayClick && onDayClick(todayStr)}><Plus className="w-3.5 h-3.5" /> Novo</Button>
        ) : <div className="w-16" />}
      </div>

      <div className="grid grid-cols-7 text-center text-[10px] uppercase tracking-wider text-zinc-500 border-b border-white/10">
        {SCH_WEEK_DAYS.map(w => <div key={w} className="py-2">{w}</div>)}
      </div>

      <div className="grid grid-cols-7">
        {cells.map((day, idx) => {
          if (!day) return <div key={idx} className="min-h-[90px] border-b border-r border-white/5 bg-white/[0.01]" />;
          const dayEvents = eventsByDay[day] || [];
          const isToday = day === todayStr;
          const isPast = day < todayStr;
          const isAvailable = availableSet.has(day);
          return (
            <div
              key={idx}
              onClick={() => {
                if (mode === 'admin' && onDayClick) onDayClick(day);
                if (mode === 'volunteer' && onToggleAvailability && dayEvents.length === 0 && !isPast) onToggleAvailability(day, !isAvailable);
              }}
              className={`min-h-[90px] border-b border-r border-white/5 p-1.5 cursor-pointer transition-colors ${isToday ? 'bg-brand-400/8' : 'hover:bg-white/[0.03]'} ${isPast ? 'opacity-60' : ''} ${isAvailable ? 'bg-emerald-400/8' : ''}`}
            >
              <div className="flex items-center justify-between mb-1">
                <span className={`text-xs font-medium ${isToday ? 'text-brand-200' : 'text-zinc-300'}`}>{parseInt(day.slice(-2), 10)}</span>
                {mode === 'volunteer' && isAvailable && dayEvents.length === 0 && (
                  <span className="text-[9px] uppercase tracking-wider text-emerald-200">Livre</span>
                )}
              </div>
              <div className="space-y-1">
                {dayEvents.slice(0, 3).map(ev => {
                  const evSignups = signups.filter(s => s.eventId === ev.id);
                  const confirmed = evSignups.filter(s => s.status === 'confirmado').length;
                  const needed = (ev.areasNeeded || []).length;
                  return (
                    <button
                      key={ev.id}
                      type="button"
                      onClick={(e) => { e.stopPropagation(); onEventClick && onEventClick(ev); }}
                      className="w-full text-left px-1.5 py-1 rounded-md bg-gradient-to-r from-fuchsia-500/20 to-brand-500/15 border border-fuchsia-400/30 hover:border-fuchsia-400/60 text-[11px] text-zinc-50 truncate transition-colors"
                    >
                      <div className="font-medium truncate">{ev.title}</div>
                      {needed > 0 && (
                        <div className="text-[9px] text-fuchsia-100/80">{confirmed}/{needed} escalados</div>
                      )}
                    </button>
                  );
                })}
                {dayEvents.length > 3 && (
                  <div className="text-[10px] text-zinc-400 px-1">+{dayEvents.length - 3} evento(s)</div>
                )}
              </div>
            </div>
          );
        })}
      </div>

      {mode === 'volunteer' && (
        <div className="p-3 border-t border-white/10 text-[11px] text-zinc-400 flex items-center gap-4 flex-wrap">
          <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-emerald-400/25 border border-emerald-400/40" /> disponível</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-gradient-to-r from-fuchsia-500/40 to-brand-500/30 border border-fuchsia-400/50" /> tem escala</span>
          <span className="text-zinc-500">Clique num dia livre para marcar disponibilidade.</span>
        </div>
      )}
    </div>
  );
};

/* =====================================================================
   EVENT EDITOR (admin) — cria/edita eventos da escala
===================================================================== */
const EventEditor = ({ event, dateHint, onClose, onSave, onDelete }) => {
  const ask = useConfirm();
  const isNew = !event;
  const [date, setDate] = useState(event?.date || dateHint || YYYYMMDD(new Date()));
  const [title, setTitle] = useState(event?.title || '');
  const [contentIdea, setContentIdea] = useState(event?.contentIdea || '');
  const [notes, setNotes] = useState(event?.notes || '');
  const [areasNeeded, setAreasNeeded] = useState(event?.areasNeeded || []);
  const [rolesNeeded, setRolesNeeded] = useState(event?.rolesNeeded || []);
  const [areaNotes, setAreaNotes] = useState(event?.areaNotes || {});
  const [isTraining, setIsTraining] = useState(!!event?.isTraining);
  const [trainingStage, setTrainingStage] = useState(event?.trainingStage || 1);
  const [minRating, setMinRating] = useState(Number(event?.minRating || 0));
  const [saving, setSaving] = useState(false);
  const toast = useToast();

  const toggle = (a) => setAreasNeeded(prev => prev.includes(a) ? prev.filter(x => x !== a) : [...prev, a]);

  const save = async () => {
    if (!title.trim()) { toast.error('Coloque um título/evento.'); return; }
    if (!date) { toast.error('Escolha a data.'); return; }
    setSaving(true);
    try {
      // guarda recado só das áreas ainda selecionadas
      const cleanNotes = {};
      areasNeeded.forEach(a => { if ((areaNotes[a] || '').trim()) cleanNotes[a] = areaNotes[a].trim(); });
      await onSave({
        ...(event || {}), date, title, contentIdea, notes, areasNeeded, rolesNeeded, areaNotes: cleanNotes,
        isTraining, trainingStage: isTraining ? trainingStage : null,
        minRating: isTraining ? 0 : minRating,
      });
      onClose();
    } catch (e) {
      toast.error(e?.message || 'Erro ao salvar.');
    } finally { setSaving(false); }
  };

  const del = async () => {
    if (!await ask({
      title: 'Excluir esse evento?',
      message: 'A escala inteira dele se perde.',
      details: ['Todos os voluntários candidatos são desescalados', 'Quem já foi avisado no WhatsApp não recebe correção automática'],
      danger: true, confirmLabel: 'Excluir evento',
    })) return;
    try { await onDelete(event.id); onClose(); }
    catch (e) { toast.error(e?.message || 'Erro ao excluir.'); }
  };

  return (
    <Modal open onClose={onClose} size="lg">
      <div className="p-6 md:p-7 space-y-4">
        <div className="flex items-center justify-between">
          <h3 className="font-serif text-xl text-zinc-50">{isNew ? 'Novo evento' : 'Editar evento'}</h3>
          <button onClick={onClose} className="text-zinc-400 hover:text-zinc-200"><X className="w-4 h-4" /></button>
        </div>

        <div className="grid md:grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-1.5">Data</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="mm-input w-full rounded-lg px-3 py-2.5 text-sm" />
          </div>
          <Input label="Título / Evento" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Culto da noite, Ensaio, Casamento..." />
        </div>

        <Textarea label="Ideia de conteúdo do dia" value={contentIdea} onChange={(e) => setContentIdea(e.target.value)} rows={3} placeholder="Ex: reels de bastidor, foto do louvor, story do pastor..." />

        <div>
          <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">Áreas necessárias</label>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
            {VOLUNTEER_AREAS.map(a => {
              const Ic = a.icon;
              const active = areasNeeded.includes(a.value);
              return (
                <button key={a.value} type="button" onClick={() => toggle(a.value)}
                  className={`flex items-center gap-2 px-3 py-2 rounded-lg border text-sm transition-all ${active ? `bg-gradient-to-br ${a.color} ${a.border} ${a.text}` : 'bg-white/[0.03] border-white/10 text-zinc-300 hover:bg-white/[0.06]'}`}>
                  <Ic className="w-4 h-4" /> <span className="flex-1 text-left">{a.label}</span> {active && <Check className="w-3.5 h-3.5" />}
                </button>
              );
            })}
          </div>
        </div>

        {/* Funções de culto — os postos que essa escala precisa preencher */}
        <div>
          <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
            <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider">
              Funções do culto <span className="text-zinc-500 normal-case">— quem fica em cada posto</span>
            </label>
            <div className="flex items-center gap-1.5">
              <button type="button" onClick={() => setRolesNeeded(MEDIA_ROLES.map(r => r.value))}
                className="text-[11px] px-2 py-1 rounded-md border border-emerald-400/30 bg-emerald-500/10 text-emerald-300 hover:bg-emerald-500/20">
                Escala completa
              </button>
              {rolesNeeded.length > 0 && (
                <button type="button" onClick={() => setRolesNeeded([])}
                  className="text-[11px] px-2 py-1 rounded-md border border-white/10 text-zinc-400 hover:bg-white/5">
                  Limpar
                </button>
              )}
            </div>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
            {MEDIA_ROLES.map(r => {
              const Ic = r.icon;
              const active = rolesNeeded.includes(r.value);
              return (
                <button key={r.value} type="button"
                  onClick={() => setRolesNeeded(prev => prev.includes(r.value) ? prev.filter(x => x !== r.value) : [...prev, r.value])}
                  className={`flex items-center gap-1.5 px-2.5 py-2 rounded-lg border text-xs transition-all ${active ? `bg-gradient-to-br ${r.color} ${r.border} ${r.text}` : 'bg-white/[0.03] border-white/10 text-zinc-400 hover:bg-white/[0.06]'}`}>
                  <Ic className="w-3.5 h-3.5 flex-shrink-0" />
                  <span className="flex-1 text-left truncate">{r.label}</span>
                  {active && <Check className="w-3 h-3 flex-shrink-0" />}
                </button>
              );
            })}
          </div>
          {rolesNeeded.length > 0 && (
            <p className="text-[11px] text-zinc-500 mt-2">
              {rolesNeeded.length} posto{rolesNeeded.length > 1 ? 's' : ''} — depois de salvar, monte a escala clicando no evento.
            </p>
          )}
        </div>

        {/* Recado por área — orientação específica de cada coordenador */}
        {areasNeeded.length > 0 && (
          <div>
            <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">
              Recado por área <span className="text-zinc-500 normal-case">— cada coordenador orienta a sua</span>
            </label>
            <div className="space-y-2">
              {areasNeeded.map(a => {
                const m = AREA_META[a]; if (!m) return null;
                const Ic = m.icon;
                return (
                  <div key={a} className={`rounded-lg border ${m.border} bg-white/[0.02] p-2.5`}>
                    <div className={`flex items-center gap-1.5 text-[11px] font-semibold ${m.text} mb-1.5`}>
                      <Ic className="w-3.5 h-3.5" /> {m.label}
                    </div>
                    <textarea
                      value={areaNotes[a] || ''}
                      onChange={(e) => setAreaNotes(prev => ({ ...prev, [a]: e.target.value }))}
                      rows={2}
                      placeholder={`Orientação pra quem for de ${m.label}...`}
                      className="mm-input w-full rounded-lg px-3 py-2 text-sm resize-none"
                    />
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Tipo do evento: culto normal ou treinamento */}
        <div className="rounded-xl border border-white/10 bg-white/[0.03] p-3">
          <label className="flex items-center gap-2.5 cursor-pointer">
            <input type="checkbox" checked={isTraining} onChange={(e) => setIsTraining(e.target.checked)} className="w-4 h-4 accent-emerald-500" />
            <Sparkles className="w-4 h-4 text-emerald-500" />
            <div className="flex-1">
              <div className="text-sm text-zinc-100 font-medium">Evento de treinamento</div>
              <div className="text-[11px] text-zinc-400">Aparece só pra quem ainda está treinando</div>
            </div>
          </label>

          {isTraining ? (
            <div className="mt-3 pt-3 border-t border-white/8">
              <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">Etapa do treinamento</label>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                {TRAINING_STAGES.map(s => {
                  const active = trainingStage === s.n;
                  return (
                    <button key={s.n} type="button" onClick={() => setTrainingStage(s.n)}
                      className={`text-left rounded-lg border px-3 py-2 text-xs transition-all ${active ? 'bg-emerald-500/15 border-emerald-400/50 text-emerald-500' : 'bg-white/[0.03] border-white/10 text-zinc-300 hover:bg-white/[0.06]'}`}>
                      <div className="font-semibold">Etapa {s.n}</div>
                      <div className="opacity-80 mt-0.5">{s.short}</div>
                    </button>
                  );
                })}
              </div>
            </div>
          ) : (
            <div className="mt-3 pt-3 border-t border-white/8">
              <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">
                Nota mínima para participar <span className="text-zinc-500 normal-case">(0 = qualquer voluntário)</span>
              </label>
              <div className="flex items-center gap-3">
                <input type="range" min="0" max="10" step="0.5" value={minRating} onChange={(e) => setMinRating(Number(e.target.value))}
                  className="flex-1 accent-emerald-500" />
                <span className={`text-lg font-serif tabular-nums w-12 text-right ${minRating > 0 ? 'text-emerald-500' : 'text-zinc-500'}`}>{minRating.toFixed(1)}</span>
              </div>
              <p className="text-[11px] text-zinc-500 mt-1">Só voluntários com nota média igual ou maior verão essa escala.</p>
            </div>
          )}
        </div>

        <Textarea label="Notas internas (opcional)" value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} />

        <div className="flex gap-2 pt-2">
          {!isNew && <Button variant="ghost" onClick={del} className="text-rose-500"><Trash2 className="w-4 h-4" /> Excluir</Button>}
          <div className="flex-1" />
          <Button variant="ghost" onClick={onClose}>Cancelar</Button>
          <Button onClick={save} disabled={saving}>
            {saving ? <><Loader2 className="w-4 h-4 animate-spin" /> Salvando...</> : 'Salvar'}
          </Button>
        </div>
      </div>
    </Modal>
  );
};
