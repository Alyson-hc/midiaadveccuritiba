const DeliveryItem = ({ delivery, isAdmin, onRemove }) => {
  const toast = useToast();
  const [downloading, setDownloading] = useState(false);

  const handleDownload = async () => {
    if (!delivery.file) return;
    setDownloading(true);
    try {
      const url = await FileStore.load(delivery.file);
      if (!url) { toast.error('Arquivo não encontrado.'); return; }
      await downloadDataURL(url, delivery.file.name);
    } catch {
      toast.error('Erro ao baixar.');
    } finally {
      setDownloading(false);
    }
  };

  return (
    <div className="rounded-lg bg-white/[0.04] border border-white/8 p-4">
      <div className="flex items-start justify-between gap-3">
        <div className="flex-1 min-w-0">
          {delivery.type === 'file' && delivery.file && (
            <div className="flex items-start gap-3">
              {delivery.file.thumbnail ? (
                <img src={delivery.file.thumbnail} alt={delivery.file.name} className="w-16 h-16 rounded-lg object-cover flex-shrink-0" />
              ) : (
                <div className="w-16 h-16 rounded-lg bg-white/8 flex items-center justify-center flex-shrink-0">
                  {delivery.file.type?.startsWith('video/') ? <Video className="w-6 h-6 text-zinc-300" /> : <FileText className="w-6 h-6 text-zinc-300" />}
                </div>
              )}
              <div className="min-w-0">
                <p className="text-sm font-semibold text-zinc-50 truncate">{delivery.file.name}</p>
                <p className="text-xs text-zinc-400 mb-2">{formatSize(delivery.file.size)}</p>
                <button
                  onClick={handleDownload}
                  disabled={downloading}
                  className="inline-flex items-center gap-1.5 text-xs text-brand-200 hover:text-brand-100 font-semibold disabled:opacity-50"
                >
                  {downloading ? <Loader2 className="w-3 h-3 animate-spin" /> : <Download className="w-3 h-3" />}
                  {downloading ? 'Carregando...' : 'Baixar arquivo'}
                </button>
              </div>
            </div>
          )}

          {delivery.type === 'link' && (
            <div className="flex items-start gap-3">
              <div className="w-10 h-10 rounded-lg bg-sky-500/15 border border-sky-400/30 flex items-center justify-center flex-shrink-0">
                <LinkIcon className="w-4 h-4 text-sky-200" />
              </div>
              <div className="min-w-0 flex-1">
                <p className="text-xs text-zinc-400 mb-1 font-medium uppercase tracking-wider">Link</p>
                <a
                  href={delivery.url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-sm text-brand-200 hover:text-brand-100 break-all inline-flex items-center gap-1"
                >
                  {delivery.url}
                  <ExternalLink className="w-3 h-3 flex-shrink-0" />
                </a>
              </div>
            </div>
          )}

          {delivery.type === 'coverage' && (
            <div className="flex items-start gap-3">
              <div className="w-10 h-10 rounded-lg bg-cyan-500/15 border border-cyan-400/30 flex items-center justify-center flex-shrink-0">
                <Camera className="w-4 h-4 text-cyan-200" />
              </div>
              <div>
                <p className="text-xs text-zinc-400 mb-0.5 font-medium uppercase tracking-wider">Resposta de cobertura</p>
                <p className="text-sm text-zinc-50 font-semibold">{delivery.coverage}</p>
              </div>
            </div>
          )}

          {delivery.type === 'text' && (
            <div className="flex items-start gap-3">
              <div className="w-10 h-10 rounded-lg bg-white/8 flex items-center justify-center flex-shrink-0">
                <MessageSquare className="w-4 h-4 text-zinc-300" />
              </div>
              <div className="min-w-0 flex-1">
                <p className="text-xs text-zinc-400 mb-1 font-medium uppercase tracking-wider">Observação</p>
                <p className="text-sm text-zinc-100 whitespace-pre-wrap">{delivery.notes}</p>
              </div>
            </div>
          )}

          {delivery.notes && delivery.type !== 'text' && (
            <p className="text-sm text-zinc-300 mt-3 pt-3 border-t border-white/6 whitespace-pre-wrap">{delivery.notes}</p>
          )}

          <p className="text-[10px] text-zinc-500 mt-2 uppercase tracking-wider font-medium">
            Entregue em {formatDateTime(delivery.createdAt)}{delivery.by ? ` · por ${delivery.by}` : ''}
          </p>
        </div>

        {isAdmin && (
          <button onClick={onRemove} className="p-1.5 text-zinc-400 hover:text-rose-300 transition-colors flex-shrink-0">
            <Trash2 className="w-3.5 h-3.5" />
          </button>
        )}
      </div>
    </div>
  );
};

/* =====================================================================
   DEPARTMENT SETTINGS (alterar senha)
===================================================================== */

const DeptSettings = ({ department, onChangePassword }) => {
  const toast = useToast();
  const [current, setCurrent] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [saving, setSaving] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!checkDeptPassword(department, current)) {
      toast.error('Senha atual incorreta.');
      return;
    }
    if (next.trim().length < 4) {
      toast.error('A nova senha precisa ter pelo menos 4 caracteres.');
      return;
    }
    if (next !== confirm) {
      toast.error('A confirmação não confere com a nova senha.');
      return;
    }
    setSaving(true);
    try {
      await onChangePassword(next.trim());
      toast.success('Senha alterada com sucesso!');
      setCurrent(''); setNext(''); setConfirm('');
    } catch {
      // toast de erro já exibido pelo handler
    } finally {
      setSaving(false);
    }
  };

  return (
    <div className="max-w-2xl mm-fade-in">
      <div className="mb-6">
        <h2 className="font-serif text-3xl text-zinc-50 mb-1">Configurações</h2>
        <p className="text-zinc-300">Gerencie o acesso do seu departamento.</p>
      </div>

      <div className="space-y-4">
        <div className="mm-card rounded-xl p-5">
          <h3 className="text-sm font-semibold text-zinc-100 mb-1 flex items-center gap-2">
            <Building2 className="w-4 h-4 text-brand-200" /> Departamento
          </h3>
          <p className="text-sm text-zinc-300">{department.name}</p>
          <p className="text-xs text-zinc-500 mt-1">
            {department.password
              ? 'Este departamento usa uma senha personalizada.'
              : 'Este departamento ainda usa a senha padrão (o próprio nome). Recomendamos alterar abaixo.'}
          </p>
        </div>

        <form onSubmit={submit} className="mm-card rounded-xl p-5 space-y-4">
          <h3 className="text-sm font-semibold text-zinc-100 flex items-center gap-2">
            <Lock className="w-4 h-4 text-brand-200" /> Alterar senha
          </h3>

          <PasswordInput
            label="Senha atual"
            value={current}
            onChange={(e) => setCurrent(e.target.value)}
            hint={!department.password ? 'Se nunca alterou, a senha atual é o nome do departamento.' : undefined}
          />
          <PasswordInput
            label="Nova senha"
            value={next}
            onChange={(e) => setNext(e.target.value)}
            hint="Mínimo de 4 caracteres."
          />
          <PasswordInput
            label="Confirmar nova senha"
            value={confirm}
            onChange={(e) => setConfirm(e.target.value)}
          />

          <Button type="submit" disabled={saving} className="w-full">
            {saving ? <Loader2 className="w-4 h-4 animate-spin" /> : <Check className="w-4 h-4" />}
            {saving ? 'Salvando...' : 'Salvar nova senha'}
          </Button>
        </form>
      </div>
    </div>
  );
};

const CriarArteView = ({ department, aiStyles }) => {
  const toast = useToast();
  const styles = useMemo(
    () => aiStyles.filter(s => s.tipo === 'arte' && (!s.departamento || s.departamento === department.name)),
    [aiStyles, department]
  );
  const [styleId, setStyleId] = useState('');
  const [photo, setPhoto] = useState(null); // { file, preview }
  const [name, setName] = useState('');
  const [adjust, setAdjust] = useState('');
  const [overlayName, setOverlayName] = useState(true);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null); // dataURL
  const fileRef = useRef(null);

  const style = styles.find(s => s.id === styleId) || styles[0];

  const pickPhoto = async (file) => {
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast.error('Selecione uma imagem.'); return; }
    if (file.size > MAX_FILE_SIZE) { toast.error('Imagem acima de 50MB.'); return; }
    setPhoto({ file, preview: await fileToDataURL(file) });
  };

  const gerar = async () => {
    if (!style) { toast.error('Crie/escolha um estilo (peça ao admin em "Modelos de IA").'); return; }
    if (!photo) { toast.error('Suba a foto do convidado.'); return; }
    setLoading(true);
    setResult(null);
    try {
      const references = [];
      for (const r of (style.refs || []).slice(0, 3)) {
        try { references.push(await urlToInlineImage(r.url)); } catch {}
      }
      const photoImg = await fileToInlineImage(photo.file);

      const prompt =
        `${style.promptBase}\n\n` +
        `Você vai receber imagens de REFERÊNCIA DE ESTILO e uma FOTO DE UMA PESSOA.\n` +
        `TAREFA: Crie uma arte publicitária NO MESMO ESTILO VISUAL das referências (mesmas cores, layout, elementos decorativos, tipografia, fundo).\n` +
        `PESSOA: Coloque a pessoa da foto na arte. O ROSTO deve ser IDÊNTICO ao da foto — preserve fielmente os traços faciais, tom de pele, cabelo e expressão.\n` +
        `NÃO escreva nenhum texto, nome ou palavra na imagem. A arte deve conter APENAS elementos visuais.\n` +
        (adjust.trim() ? `Ajustes pedidos: ${adjust.trim()}.\n` : '') +
        `Proporção vertical (2:3), alta qualidade, pronta para publicar em redes sociais.`;

      const out = await callAI({ prompt, references, photo: photoImg, size: '1024x1536' });
      let dataUrl = `data:${out.mimeType};base64,${out.data}`;
      if (overlayName && name.trim()) dataUrl = await overlayNameOnImage(dataUrl, name);
      setResult(dataUrl);
      toast.success('Arte gerada!');
    } catch (e) {
      toast.error(e?.message || 'Erro ao gerar.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="mm-fade-in max-w-3xl">
      <div className="mb-6">
        <h2 className="font-serif text-3xl text-zinc-50 mb-1">Criar Arte com IA</h2>
        <p className="text-zinc-300">Suba a foto do convidado, escolha o estilo e gere a arte.</p>
      </div>

      {styles.length === 0 ? (
        <EmptyState icon={Sparkles} title="Nenhum estilo disponível"
          description="O administrador precisa criar um estilo de arte em 'Modelos de IA' antes de você gerar." />
      ) : (
        <div className="grid md:grid-cols-2 gap-5">
          {/* Coluna de entrada */}
          <div className="space-y-4">
            <Select label="Estilo" options={styles.map(s => ({ value: s.id, label: s.nome }))}
              value={style?.id} onChange={setStyleId} />

            <div>
              <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">Foto do convidado *</label>
              <label className="flex flex-col items-center justify-center w-full py-6 border-2 border-dashed border-white/15 hover:border-brand-400/40 rounded-xl cursor-pointer bg-white/[0.02]">
                {photo ? (
                  // eslint-disable-next-line
                  <img src={photo.preview} alt="" className="w-24 h-24 rounded-lg object-cover mb-2" />
                ) : <Upload className="w-6 h-6 text-zinc-300 mb-2" />}
                <span className="text-sm text-zinc-100">{photo ? 'Trocar foto' : 'Subir foto do convidado'}</span>
                <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={(e) => pickPhoto(e.target.files?.[0])} />
              </label>
            </div>

            <Input label="Nome do convidado" icon={User} value={name}
              onChange={(e) => setName(e.target.value)} placeholder="Ex: Pr. Maria Silva" />

            <Textarea label="Ajustes (opcional)" value={adjust}
              onChange={(e) => setAdjust(e.target.value)}
              placeholder="Ex: fundo dourado, cor mais clara, adicionar 'Conferência de Mulheres'..." rows={3} />

            <label className="flex items-center gap-2 text-sm text-zinc-200 cursor-pointer">
              <input type="checkbox" checked={overlayName} onChange={(e) => setOverlayName(e.target.checked)} className="accent-brand-500" />
              Escrever o nome por cima (garante texto exato)
            </label>

            <Button onClick={gerar} disabled={loading} size="lg" className="w-full">
              {loading ? <Loader2 className="w-4 h-4 animate-spin" /> : <Sparkles className="w-4 h-4" />}
              {loading ? 'Gerando... (pode levar até 30s)' : 'Gerar arte'}
            </Button>
          </div>

          {/* Coluna de resultado */}
          <div className="space-y-3">
            <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider">Resultado</label>
            <div className="rounded-xl border border-white/10 bg-white/[0.02] aspect-[4/5] flex items-center justify-center overflow-hidden">
              {loading ? (
                <div className="text-center text-zinc-400">
                  <Loader2 className="w-8 h-8 animate-spin mx-auto mb-2 text-brand-300" />
                  <p className="text-sm">Criando sua arte...</p>
                </div>
              ) : result ? (
                // eslint-disable-next-line
                <img src={result} alt="Arte gerada" className="w-full h-full object-contain" />
              ) : (
                <div className="text-center text-zinc-500 px-6">
                  <ImageIcon className="w-8 h-8 mx-auto mb-2" />
                  <p className="text-sm">A arte vai aparecer aqui.</p>
                </div>
              )}
            </div>
            {result && !loading && (
              <div className="flex gap-2">
                <Button variant="outline" onClick={gerar} className="flex-1"><Sparkles className="w-4 h-4" /> Gerar de novo</Button>
                <Button onClick={() => downloadDataURL(result, `arte-${slugify(name) || 'convidado'}.png`)} className="flex-1">
                  <Download className="w-4 h-4" /> Baixar
                </Button>
              </div>
            )}
            <p className="text-[11px] text-zinc-500">Resultado varia a cada geração. Se não gostar, clique "Gerar de novo".</p>
          </div>
        </div>
      )}
    </div>
  );
};

const CriarCarrosselView = ({ department, aiStyles }) => {
  const toast = useToast();
  const styles = useMemo(
    () => aiStyles.filter(s => s.tipo === 'carrossel' && (!s.departamento || s.departamento === department.name)),
    [aiStyles, department]
  );
  const [styleId, setStyleId] = useState('');
  const [slides, setSlides] = useState([]); // [{ id, file, preview, result }]
  const [adjust, setAdjust] = useState('');
  const [progress, setProgress] = useState(null); // { done, total }
  const fileRef = useRef(null);

  const style = styles.find(s => s.id === styleId) || styles[0];

  const addImages = async (files) => {
    const novas = [];
    for (const f of Array.from(files || [])) {
      if (!f.type.startsWith('image/')) continue;
      if (f.size > MAX_FILE_SIZE) { toast.error(`"${f.name}" acima de 50MB.`); continue; }
      novas.push({ id: uid(), file: f, preview: await fileToDataURL(f), result: null });
    }
    setSlides(s => [...s, ...novas].slice(0, 10));
    if (fileRef.current) fileRef.current.value = '';
  };

  const removeSlide = (id) => setSlides(s => s.filter(x => x.id !== id));

  const gerar = async () => {
    if (!style) { toast.error('Peça ao admin para criar um estilo de carrossel.'); return; }
    if (slides.length === 0) { toast.error('Suba ao menos uma imagem.'); return; }
    setProgress({ done: 0, total: slides.length });
    const refImgs = [];
    for (const r of (style.refs || []).slice(0, 3)) {
      try { refImgs.push(await urlToInlineImage(r.url)); } catch {}
    }
    const updated = [...slides];
    for (let i = 0; i < updated.length; i++) {
      try {
        const slideImg = await fileToInlineImage(updated[i].file);
        const prompt =
          `${style.promptBase}\n\n` +
          `Você vai receber imagens de REFERÊNCIA DE ESTILO e uma FOTO DE SLIDE.\n` +
          `TAREFA: Recrie o slide (${i + 1} de ${updated.length}) NO MESMO ESTILO VISUAL das referências — mesmas cores, fontes, layout e elementos decorativos.\n` +
          `Mantenha o conteúdo da foto do slide mas aplique a identidade visual das referências.\n` +
          `NÃO escreva nenhum texto, nome ou palavra na imagem.\n` +
          (adjust.trim() ? `Ajustes: ${adjust.trim()}.\n` : '') +
          `Proporção quadrada (1:1) para Instagram, alta qualidade.`;
        const out = await callAI({ prompt, references: refImgs, photo: slideImg, size: '1024x1024' });
        updated[i] = { ...updated[i], result: `data:${out.mimeType};base64,${out.data}` };
        setSlides([...updated]);
      } catch (e) {
        toast.error(`Slide ${i + 1}: ${e?.message || 'erro'}`);
      }
      setProgress({ done: i + 1, total: updated.length });
    }
    setProgress(null);
    toast.success('Carrossel gerado!');
  };

  const baixarTodos = async () => {
    const prontos = slides.filter(s => s.result);
    if (!prontos.length) return;
    if (window.JSZip) {
      const zip = new window.JSZip();
      prontos.forEach((s, i) => {
        const base64 = s.result.split(',')[1];
        zip.file(`slide-${String(i + 1).padStart(2, '0')}.png`, base64, { base64: true });
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `carrossel-${slugify(department.name)}.zip`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } else {
      prontos.forEach((s, i) => downloadDataURL(s.result, `slide-${i + 1}.png`));
    }
  };

  const prontos = slides.filter(s => s.result).length;

  return (
    <div className="mm-fade-in max-w-4xl">
      <div className="mb-6">
        <h2 className="font-serif text-3xl text-zinc-50 mb-1">Criar Carrossel com IA</h2>
        <p className="text-zinc-300">Suba até 10 imagens (capa + slides) e gere o carrossel no estilo da igreja.</p>
      </div>

      {styles.length === 0 ? (
        <EmptyState icon={Sparkles} title="Nenhum estilo de carrossel"
          description="O administrador precisa criar um estilo de carrossel em 'Modelos de IA'." />
      ) : (
        <>
          <div className="grid md:grid-cols-2 gap-4 mb-5">
            <Select label="Estilo do carrossel" options={styles.map(s => ({ value: s.id, label: s.nome }))}
              value={style?.id} onChange={setStyleId} />
            <Input label="Ajustes (opcional)" value={adjust} onChange={(e) => setAdjust(e.target.value)}
              placeholder="Ex: tema 'Culto da Família', cores azuis" />
          </div>

          <label className="flex flex-col items-center justify-center w-full py-6 border-2 border-dashed border-white/15 hover:border-brand-400/40 rounded-xl cursor-pointer bg-white/[0.02] mb-4">
            <Upload className="w-6 h-6 text-zinc-300 mb-2" />
            <span className="text-sm text-zinc-100">Subir imagens (até 10) · {slides.length}/10</span>
            <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={(e) => addImages(e.target.files)} />
          </label>

          {slides.length > 0 && (
            <div className="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-5">
              {slides.map((s, i) => (
                <div key={s.id} className="relative group rounded-lg overflow-hidden border border-white/10">
                  {/* eslint-disable-next-line */}
                  <img src={s.result || s.preview} alt="" className="w-full aspect-square object-cover" />
                  <span className="absolute top-1 left-1 text-[10px] bg-black/60 text-[#fff] rounded px-1.5">{i + 1}</span>
                  {s.result && <span className="absolute bottom-1 right-1 text-emerald-300"><Check className="w-3.5 h-3.5" /></span>}
                  {!progress && (
                    <button onClick={() => removeSlide(s.id)}
                      className="absolute top-1 right-1 w-5 h-5 rounded-full bg-rose-500/80 text-[#fff] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                      <X className="w-3 h-3" />
                    </button>
                  )}
                </div>
              ))}
            </div>
          )}

          {progress && (
            <div className="rounded-lg bg-brand-500/8 border border-brand-400/25 p-4 mb-4">
              <div className="flex justify-between text-xs text-brand-100 mb-2">
                <span>Gerando slides...</span><span>{progress.done}/{progress.total}</span>
              </div>
              <div className="h-1.5 rounded-full bg-white/8 overflow-hidden">
                <div className="h-full mm-brand-grad transition-all" style={{ width: `${(progress.done / progress.total) * 100}%` }} />
              </div>
            </div>
          )}

          <div className="flex flex-col sm:flex-row gap-2">
            <Button onClick={gerar} disabled={!!progress || slides.length === 0} size="lg" className="flex-1">
              {progress ? <Loader2 className="w-4 h-4 animate-spin" /> : <Sparkles className="w-4 h-4" />}
              {progress ? 'Gerando...' : `Gerar carrossel (${slides.length} slide${slides.length !== 1 ? 's' : ''})`}
            </Button>
            {prontos > 0 && !progress && (
              <Button variant="outline" onClick={baixarTodos} size="lg">
                <Download className="w-4 h-4" /> Baixar todos ({prontos})
              </Button>
            )}
          </div>
          <p className="text-[11px] text-zinc-500 mt-3">Cada slide é uma geração separada — carrossel de 10 = 10 gerações.</p>
        </>
      )}
    </div>
  );
};

              <div className="space-y-3 mm-stagger">
                {filteredRequests.map(r => (
                  <RequestCard key={r.id} request={r} onClick={() => setOpenRequest(r)} />
                ))}
              </div>
            )}
          </div>
        );

      case 'delivered':
        return (
          <div className="mm-fade-in">
            <div className="mb-6">
              <h2 className="font-serif text-3xl text-zinc-50 mb-1">Arquivos entregues</h2>
              <p className="text-zinc-300">Materiais e respostas enviados pela equipe de mídia</p>
            </div>

            {deliveredRequests.length === 0 ? (
              <EmptyState
                icon={Archive}
                title="Nenhuma entrega ainda"
                description="Quando a equipe responder suas solicitações, os arquivos aparecerão aqui."
              />
            ) : (
              <div className="space-y-3 mm-stagger">
                {deliveredRequests.map(r => (
                  <RequestCard key={r.id} request={r} onClick={() => setOpenRequest(r)} />
                ))}
              </div>
            )}
          </div>
        );

      case 'criar-arte':
        return <CriarArteView department={department} aiStyles={aiStyles} />;

      case 'criar-carrossel':
        return <CriarCarrosselView department={department} aiStyles={aiStyles} />;

      case 'agenda':
        return <ChurchAgendaView readOnly />;

      case 'settings':
        return <DeptSettings department={department} onChangePassword={onChangePassword} />;

      default: return null;
    }
  };

  const activeItem = navItems.find(i => i.id === view);

  return (
    <div className="flex">
      <Sidebar
        items={navItems}
        active={view}
        onChange={setView}
        title={department.name}
        subtitle="Departamento"
        onLogout={onLogout}
        mobileOpen={mobileOpen}
        setMobileOpen={setMobileOpen}
      />

      <main className="flex-1 min-w-0">
        <TopBar
          title={activeItem?.label || ''}
          subtitle={department.name}
        />
        <div className="px-4 md:px-8 py-5 md:py-8 relative z-10 mm-pad-tabbar">
          {renderView()}
        </div>
      </main>

      <RequestDetail
        request={openRequest ? requests.find(r => r.id === openRequest.id) || openRequest : null}
        open={!!openRequest}
        onClose={() => setOpenRequest(null)}
        isAdmin={false}
        actor={{ name: department.name, role: 'dept' }}
        onUpdate={onUpdateRequest}
      />
    </div>
  );
};

const CalendarView = ({ requests, contents, onOpenRequest, onOpenContent }) => {
  const today = new Date();
  const [cursor, setCursor] = useState({ year: today.getFullYear(), month: today.getMonth() });

  const eventsByDay = useMemo(() => {
    const map = {};
    for (const r of requests) {
      if (!r.eventDate) continue;
      // Multidia: cria uma entrada em cada dia entre eventDate e eventEndDate (inclusive)
      const startKey = r.eventDate;
      const endKey = r.eventEndDate && r.eventEndDate >= startKey ? r.eventEndDate : startKey;
      const start = new Date(startKey + 'T00:00:00');
      const end = new Date(endKey + 'T00:00:00');
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const key = YYYYMMDD(d);   // toISOString() e UTC: perto da meia-noite trocava o dia
        (map[key] ||= []).push({ kind: 'request', data: r });
      }
    }
    for (const c of contents) {
      if (!c.scheduledDate) continue;
      (map[c.scheduledDate] ||= []).push({ kind: 'content', data: c });
    }
    return map;
  }, [requests, contents]);

  const monthMatrix = useMemo(() => {
    const firstDay = new Date(cursor.year, cursor.month, 1);
    const startWeekday = firstDay.getDay(); // 0..6
    const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }, [cursor]);

  const prevMonth = () => setCursor(c => {
    const m = c.month - 1;
    return m < 0 ? { year: c.year - 1, month: 11 } : { year: c.year, month: m };
  });
  const nextMonth = () => setCursor(c => {
    const m = c.month + 1;
    return m > 11 ? { year: c.year + 1, month: 0 } : { year: c.year, month: m };
  });
  const goToday = () => setCursor({ year: today.getFullYear(), month: today.getMonth() });

  const dayKey = (d) => `${cursor.year}-${String(cursor.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  const isToday = (d) => d === today.getDate() && cursor.month === today.getMonth() && cursor.year === today.getFullYear();

  return (
    <div className="mm-fade-in">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <div>
          <h2 className="font-serif text-3xl text-zinc-50 mb-1">
            <span className="mm-brand-text">{MONTH_NAMES[cursor.month]}</span> {cursor.year}
          </h2>
          <p className="text-zinc-300 text-sm">Eventos e conteúdos programados</p>
        </div>
        <div className="flex items-center gap-2">
          <Button variant="ghost" size="sm" onClick={prevMonth}>
            <ChevronRight className="w-4 h-4 rotate-180" />
          </Button>
          <Button variant="outline" size="sm" onClick={goToday}>Hoje</Button>
          <Button variant="ghost" size="sm" onClick={nextMonth}>
            <ChevronRight className="w-4 h-4" />
          </Button>
        </div>
      </div>

      <div className="mm-card rounded-2xl p-3 md:p-5">
        <div className="grid grid-cols-7 gap-1 mb-2">
          {WEEKDAY_NAMES.map(w => (
            <div key={w} className="text-[10px] md:text-xs font-semibold text-zinc-400 uppercase tracking-wider text-center py-2">
              {w}
            </div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {monthMatrix.map((d, idx) => {
            if (d === null) return <div key={idx} className="aspect-square md:aspect-auto md:min-h-[88px] rounded-lg bg-white/[0.01]" />;
            const items = eventsByDay[dayKey(d)] || [];
            return (
              <div
                key={idx}
                className={`relative rounded-lg p-1.5 md:p-2 min-h-[64px] md:min-h-[88px] border transition-colors ${
                  isToday(d)
                    ? 'bg-brand-500/10 border-brand-400/40'
                    : 'bg-white/[0.02] border-white/5 hover:bg-white/[0.05] hover:border-white/10'
                }`}
              >
                <div className={`text-[11px] md:text-xs font-semibold mb-1 ${isToday(d) ? 'text-brand-100' : 'text-zinc-200'}`}>
                  {d}
                </div>
                <div className="space-y-0.5">
                  {items.slice(0, 3).map((it, i) => {
                    if (it.kind === 'request') {
                      const r = it.data;
                      const primary = getPrimaryService(r);
                      const colors = COLOR_CLASSES[primary.color];
                      const labelText = r.title || r.department;
                      return (
                        <button
                          key={`r-${r.id}`}
                          onClick={() => onOpenRequest(r)}
                          className={`block w-full text-left text-[9px] md:text-[10px] truncate rounded px-1 md:px-1.5 py-0.5 ${colors.bg} ${colors.text} ${colors.border} border`}
                          title={`${labelText} · ${r.department} · ${primary.label}`}
                        >
                          📅 {labelText}
                        </button>
                      );
                    }
                    const c = it.data;
                    const meta = getContentMeta(c.type);
                    const colors = COLOR_CLASSES[meta.color];
                    return (
                      <button
                        key={`c-${c.id}`}
                        onClick={() => onOpenContent(c)}
                        className={`block w-full text-left text-[9px] md:text-[10px] truncate rounded px-1 md:px-1.5 py-0.5 ${colors.bg} ${colors.text} ${colors.border} border`}
                        title={`${meta.label} · ${c.title}`}
                      >
                        ✏ {c.title}
                      </button>
                    );
                  })}
                  {items.length > 3 && (
                    <div className="text-[9px] md:text-[10px] text-zinc-400 px-1">
                      +{items.length - 3} mais
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Legenda */}
      <div className="mt-4 flex flex-wrap gap-3 text-xs text-zinc-400">
        <span className="flex items-center gap-1.5">📅 Solicitação de serviço</span>
        <span className="flex items-center gap-1.5">✏ Conteúdo programado</span>
      </div>
    </div>
  );
};

===================================================================== */

const ContentsManager = ({ contents, onAdd, onUpdate, onRemove, openEditingId, onCloseEditor }) => {
  const ask = useConfirm();
  const toast = useToast();
  const [editing, setEditing] = useState(null);
  const [search, setSearch] = useState('');
  const [filterType, setFilterType] = useState('all');

  useEffect(() => {
    if (openEditingId) {
      const c = contents.find(x => x.id === openEditingId);
      if (c) setEditing({ ...c });
    }
  }, [openEditingId, contents]);

  const filtered = useMemo(() => {
    let r = [...contents];
    if (filterType !== 'all') r = r.filter(c => c.type === filterType);
    if (search.trim()) {
      const q = slugify(search);
      r = r.filter(c => slugify(c.title).includes(q) || slugify(c.description).includes(q));
    }
    return r.sort((a, b) => {
      if (a.scheduledDate && b.scheduledDate) return a.scheduledDate.localeCompare(b.scheduledDate);
      if (a.scheduledDate) return -1;
      if (b.scheduledDate) return 1;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
  }, [contents, search, filterType]);

  const openNew = () => setEditing({
    title: '', type: 'post', url: '', description: '',
    scheduledDate: '', scheduledTime: '', thumbnailUrl: '',
  });

  const closeEditor = () => {
    setEditing(null);
    onCloseEditor?.();
  };

  const save = async () => {
    if (!editing.title.trim()) { toast.error('Título é obrigatório'); return; }
    try {
      if (editing.id) {
        await onUpdate(editing);
        toast.success('Conteúdo atualizado');
      } else {
        await onAdd(editing);
        toast.success('Conteúdo criado');
      }
      closeEditor();
    } catch (e) {
      toast.error('Erro ao salvar: ' + (e?.message || 'tente novamente'));
    }
  };

  const handleRemove = async () => {
    if (!editing?.id) return;
    if (!await ask({ title: 'Apagar este conteúdo?', message: 'Ele sai do calendário e da listagem.', danger: true, confirmLabel: 'Apagar' })) return;
    try {
      await onRemove(editing.id);
      toast.success('Conteúdo removido');
      closeEditor();
    } catch (e) {
      toast.error('Erro ao remover: ' + (e?.message || 'tente novamente'));
    }
  };

  return (
    <div className="mm-fade-in">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
        <div>
          <h2 className="font-serif text-3xl text-zinc-50 mb-1">Conteúdos</h2>
          <p className="text-zinc-300">Programe posts, vídeos, lives, devocionais e mais.</p>
        </div>
        <Button onClick={openNew}>
          <Plus className="w-4 h-4" /> Novo conteúdo
        </Button>
      </div>

      <div className="grid md:grid-cols-2 gap-3 mb-6">
        <Input
          icon={Search}
          placeholder="Buscar conteúdo..."
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
        <div className="relative">
          <Filter className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" />
          <select
            value={filterType}
            onChange={(e) => setFilterType(e.target.value)}
            className="mm-input w-full rounded-lg pl-10 pr-10 py-2.5 text-sm appearance-none cursor-pointer"
          >
            <option value="all">Todos os tipos</option>
            {CONTENT_TYPES.map(t => (
              <option key={t.value} value={t.value} className="bg-zinc-900">{t.label}</option>
            ))}
          </select>
          <ChevronDown className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 pointer-events-none" />
        </div>
      </div>

      {filtered.length === 0 ? (
        <EmptyState
          icon={Archive}
          title="Nenhum conteúdo ainda"
          description="Crie seu primeiro conteúdo programado pra aparecer no calendário."
          action={<Button onClick={openNew}><Plus className="w-4 h-4" /> Novo conteúdo</Button>}
        />
      ) : (
        <div className="grid md:grid-cols-2 gap-3 mm-stagger">
          {filtered.map(c => {
            const meta = getContentMeta(c.type);
            const colors = COLOR_CLASSES[meta.color];
            const Icon = meta.icon;
            return (
              <button
                key={c.id}
                onClick={() => setEditing({ ...c })}
                className="mm-card text-left rounded-xl p-4 group"
              >
                <div className="flex items-start gap-3">
                  <div className={`w-11 h-11 rounded-lg ${colors.bg} border ${colors.border} flex items-center justify-center flex-shrink-0`}>
                    <Icon className={`w-4 h-4 ${colors.icon}`} />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 mb-1 flex-wrap">
                      <h3 className="font-semibold text-zinc-50 truncate">{c.title}</h3>
                      <span className={`chip text-[10px] ${colors.bg} ${colors.text} ${colors.border}`}>
                        {meta.label}
                      </span>
                    </div>
                    {c.description && (
                      <p className="text-sm text-zinc-300 line-clamp-2 mb-2">{c.description}</p>
                    )}
                    <div className="flex items-center gap-3 text-[11px] text-zinc-400">
                      {c.scheduledDate && (
                        <span className="flex items-center gap-1">
                          <Calendar className="w-3 h-3" /> {formatDate(c.scheduledDate)}
                        </span>
                      )}
                      {c.scheduledTime && (
                        <span className="flex items-center gap-1">
                          <Clock className="w-3 h-3" /> {c.scheduledTime}
                        </span>
                      )}
                      {c.url && (
                        <span className="flex items-center gap-1 text-brand-200">
                          <LinkIcon className="w-3 h-3" /> link
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              </button>
            );
          })}
        </div>
      )}

      <Modal open={!!editing} onClose={closeEditor} size="md">
        {editing && (
          <div className="p-6">
            <div className="flex items-center justify-between mb-5">
              <h3 className="font-serif text-2xl text-zinc-50">
                {editing.id ? 'Editar conteúdo' : 'Novo conteúdo'}
              </h3>
              <button onClick={closeEditor} className="p-2 text-zinc-300 hover:text-zinc-50">
                <X className="w-5 h-5" />
              </button>
            </div>

            <div className="space-y-4">
              <Input
                label="Título *"
                value={editing.title}
                onChange={(e) => setEditing({ ...editing, title: e.target.value })}
                placeholder="Ex: Devocional sobre fé"
              />

              <div>
                <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-3">
                  Tipo
                </label>
                <div className="grid grid-cols-3 gap-2">
                  {CONTENT_TYPES.map(t => {
                    const Icon = t.icon;
                    const sel = editing.type === t.value;
                    const colors = COLOR_CLASSES[t.color];
                    return (
                      <button
                        key={t.value}
                        type="button"
                        onClick={() => setEditing({ ...editing, type: t.value })}
                        className={`flex flex-col items-center gap-1 p-2.5 rounded-lg border text-xs font-medium transition-all ${
                          sel ? `${colors.bg} ${colors.border} ${colors.text}` : 'bg-white/[0.03] border-white/8 text-zinc-300 hover:text-zinc-50'
                        }`}
                      >
                        <Icon className="w-4 h-4" />
                        {t.label}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <Input
                  label="Data programada"
                  icon={Calendar}
                  type="date"
                  value={editing.scheduledDate}
                  onChange={(e) => setEditing({ ...editing, scheduledDate: e.target.value })}
                />
                <Input
                  label="Horário"
                  icon={Clock}
                  type="time"
                  value={editing.scheduledTime}
                  onChange={(e) => setEditing({ ...editing, scheduledTime: e.target.value })}
                />
              </div>

              <Input
                label="Link / URL"
                icon={LinkIcon}
                value={editing.url}
                onChange={(e) => setEditing({ ...editing, url: e.target.value })}
                placeholder="https://youtube.com/... ou link de referência"
              />

              <Textarea
                label="Descrição"
                value={editing.description}
                onChange={(e) => setEditing({ ...editing, description: e.target.value })}
                placeholder="Detalhes, roteiro, briefing, observações..."
                rows={4}
              />
            </div>

            <div className="flex gap-2 mt-6 pt-5 border-t border-white/8">
              {editing.id && (
                <Button variant="danger" onClick={handleRemove}>
                  <Trash2 className="w-4 h-4" />
                </Button>
              )}
              <div className="flex-1" />
              <Button variant="ghost" onClick={closeEditor}>Cancelar</Button>
              <Button onClick={save}>
                <Check className="w-4 h-4" />
                {editing.id ? 'Salvar' : 'Criar'}
              </Button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
};

/* =====================================================================
   AI STYLES MANAGER (admin gerencia os modelos de referência da IA)
===================================================================== */

const AIStylesManager = ({ styles, departments, onAdd, onUpdate, onRemove }) => {
  const ask = useConfirm();
  const toast = useToast();
  const [editing, setEditing] = useState(null); // objeto em edição/criação
  const [uploadingRef, setUploadingRef] = useState(false);
  const refInput = useRef(null);

  const openNew = () => setEditing({ nome: '', tipo: 'arte', departamento: '', promptBase: '', refs: [] });
  const openEdit = (s) => setEditing({ ...s, refs: [...(s.refs || [])] });

  const addRefs = async (files) => {
    if (!files || !files.length) return;
    setUploadingRef(true);
    try {
      const novas = [];
      for (const f of Array.from(files)) {
        if (!f.type.startsWith('image/')) { toast.error(`"${f.name}" não é imagem.`); continue; }
        const meta = await FileStore.save(f);
        novas.push({ url: meta.url, path: meta.path, name: f.name });
      }
      setEditing(e => ({ ...e, refs: [...(e.refs || []), ...novas] }));
    } catch (e) {
      toast.error('Erro ao subir referência: ' + (e?.message || 'tente de novo'));
    } finally {
      setUploadingRef(false);
      if (refInput.current) refInput.current.value = '';
    }
  };

  const removeRef = async (idx) => {
    const ref = editing.refs[idx];
    if (ref?.path) { try { await FileStore.remove(ref); } catch {} }
    setEditing(e => ({ ...e, refs: e.refs.filter((_, i) => i !== idx) }));
  };

  const save = async () => {
    if (!editing.nome.trim()) { toast.error('Dê um nome ao estilo.'); return; }
    try {
      if (editing.id) { await onUpdate(editing); toast.success('Estilo atualizado'); }
      else { await onAdd(editing); toast.success('Estilo criado'); }
      setEditing(null);
    } catch (e) {
      toast.error('Erro ao salvar: ' + (e?.message || 'tente de novo'));
    }
  };

  const handleRemove = async (s) => {
    if (!await ask({ title: 'Apagar este modelo de IA?', message: `“${s.nome}” deixa de aparecer na hora de gerar arte.`, danger: true, confirmLabel: 'Apagar' })) return;
    try { await onRemove(s.id); toast.success('Estilo removido'); } catch {}
  };

  return (
    <div className="mm-fade-in">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-2">
        <div>
          <h2 className="font-serif text-3xl text-zinc-50 mb-1">Modelos de IA</h2>
          <p className="text-zinc-300">Estilos de referência que a IA usa para criar artes e carrosséis.</p>
        </div>
        <Button onClick={openNew}><Plus className="w-4 h-4" /> Novo estilo</Button>
      </div>

      <div className="mm-card rounded-xl p-4 mb-6 bg-brand-500/[0.04] border-brand-400/20">
        <p className="text-xs text-brand-100/90 leading-relaxed">
          <Sparkles className="w-3.5 h-3.5 inline mr-1" />
          Como funciona: suba 1 a 3 <b>modelos prontos</b> da igreja como referência e escreva um
          <b> prompt-base</b> descrevendo o estilo. A IA imita essas referências a cada geração —
          ela não "decora" os modelos, então o resultado varia um pouco a cada vez.
        </p>
      </div>

      {styles.length === 0 ? (
        <EmptyState
          icon={Sparkles}
          title="Nenhum estilo ainda"
          description="Crie um estilo (ex: 'Convidado — Mulheres') com referências e prompt para liberar as abas de IA."
          action={<Button onClick={openNew}><Plus className="w-4 h-4" /> Novo estilo</Button>}
        />
      ) : (
        <div className="grid md:grid-cols-2 gap-3 mm-stagger">
          {styles.map(s => (
            <div key={s.id} className="mm-card rounded-xl p-4">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <h3 className="font-semibold text-zinc-50 truncate">{s.nome}</h3>
                    <span className={`chip text-[10px] ${s.tipo === 'carrossel' ? 'bg-violet-500/15 border-violet-400/40 text-violet-200' : 'bg-rose-500/15 border-rose-400/40 text-rose-200'}`}>
                      {s.tipo === 'carrossel' ? 'Carrossel' : 'Arte'}
                    </span>
                    {s.departamento && (
                      <span className="chip text-[10px] bg-white/8 border-white/15 text-zinc-200">{s.departamento}</span>
                    )}
                  </div>
                  <p className="text-xs text-zinc-400 mt-1 line-clamp-2">{s.promptBase || 'Sem prompt-base'}</p>
                </div>
                <div className="flex items-center gap-1 flex-shrink-0">
                  <button onClick={() => openEdit(s)} className="p-2 text-zinc-300 hover:text-brand-200 hover:bg-white/8 rounded-lg" title="Editar"><Edit2 className="w-4 h-4" /></button>
                  <button onClick={() => handleRemove(s)} className="p-2 text-zinc-300 hover:text-rose-300 hover:bg-rose-500/8 rounded-lg" title="Apagar"><Trash2 className="w-4 h-4" /></button>
                </div>
              </div>
              {s.refs?.length > 0 && (
                <div className="flex gap-1.5 mt-3">
                  {s.refs.slice(0, 5).map((r, i) => (
                    // eslint-disable-next-line
                    <img key={i} src={r.url} alt="" className="w-12 h-12 rounded object-cover border border-white/10" />
                  ))}
                  {s.refs.length > 5 && <span className="text-xs text-zinc-400 self-center">+{s.refs.length - 5}</span>}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      <Modal open={!!editing} onClose={() => setEditing(null)} size="md">
