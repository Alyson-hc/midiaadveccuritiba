      supabase.from('availability').select('*'),
      supabase.from('feedbacks').select('*').order('created_at', { ascending: false }),
      supabase.from('announcements').select('*').order('created_at', { ascending: false }),
      supabase.from('volunteer_area_requests').select('*').order('created_at', { ascending: false }),
      supabase.from('study_materials').select('*').order('created_at', { ascending: false }),
      supabase.from('forum_posts').select('*').order('created_at', { ascending: true }),
    ]);
    const pick = (i) => results[i].status === 'fulfilled' ? results[i].value : { data: null, error: results[i].reason };
    const [deptsRes, reqsRes, contentsRes, adminsRes, stylesRes, volsRes, evsRes, sigRes, avRes, fbRes, annRes, arRes, smRes, fpRes] =
      [pick(0), pick(1), pick(2), pick(3), pick(4), pick(5), pick(6), pick(7), pick(8), pick(9), pick(10), pick(11), pick(12), pick(13)];
    if (!deptsRes.error)    setDepartments((deptsRes.data || []).map(departmentDbToJs));
    // requests: ja aplicado por loadRequests() (reqsRes e so um marcador)
    if (!contentsRes.error) setContents((contentsRes.data || []).map(contentDbToJs));
    if (!adminsRes.error)   setAdmins((adminsRes.data || []).map(adminDbToJs));
    if (!stylesRes.error)   setAiStyles((stylesRes.data || []).map(aiStyleDbToJs));
    if (!volsRes.error)     setVolunteers((volsRes.data || []).map(volunteerDbToJs));
    if (!evsRes.error)      setEvents((evsRes.data || []).map(eventDbToJs));
    if (!sigRes.error)      setSignups((sigRes.data || []).map(signupDbToJs));
    if (!avRes.error)       setAvailability((avRes.data || []).map(availabilityDbToJs));
    if (!fbRes.error)       setFeedbacks((fbRes.data || []).map(feedbackDbToJs));
    if (!annRes.error)      setAnnouncements((annRes.data || []).map(announcementDbToJs));
    if (!arRes.error)       setAreaRequests((arRes.data || []).map(areaRequestDbToJs));
    if (!smRes.error)       setStudyMaterials((smRes.data || []).map(studyMaterialDbToJs));
    if (!fpRes.error)       setForumPosts((fpRes.data || []).map(forumPostDbToJs));
    setLoading(false);
  }, [loadRequests]);

  useEffect(() => {
    load();

    let channel = null;
    let retryTimer = null;
    let disposed = false;
    let live = false;
    // as tabelas leves podem chegar em rajada (varios eventos juntos): uma carga so
    let lightTimer = null;
    const loadLight = () => { clearTimeout(lightTimer); lightTimer = setTimeout(() => load({ withRequests: false }), 250); };

    // Assina o realtime; se a conexão cair, reconecta sozinho
    const subscribe = () => {
      if (disposed) return;
      if (channel) supabase.removeChannel(channel);
      channel = supabase
        .channel('mm-realtime-' + Date.now())
        // mudanca em requests: aplica so a linha (antes rebaixava ~2 MB a cada card movido)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, applyRequestChange)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'departments' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'contents' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'admins' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'ai_styles' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'volunteers' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'event_signups' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'availability' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'feedbacks' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, loadLight)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'volunteer_area_requests' }, loadLight)
        .subscribe((status) => {
          if (disposed) return;
          live = status === 'SUBSCRIBED';
          if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => { load(); subscribe(); }, 3000);
          }
        });
    };
    subscribe();

    // Recarrega quando a aba/app volta a ficar visível (celular derruba o websocket).
    // No maximo a cada 15s: no desktop o "focus" dispara toda vez que se volta pra janela.
    let lastFull = Date.now();
    const onVisible = () => {
      if (document.visibilityState !== 'visible' || Date.now() - lastFull < 15000) return;
      lastFull = Date.now();
      load();
    };
    document.addEventListener('visibilitychange', onVisible);
    window.addEventListener('focus', onVisible);
    window.addEventListener('online', onVisible);

    // Rede de segurança a cada 30s. Com o realtime de pé, requests (a tabela
    // pesada) fica de fora — ela ja chega linha a linha pelo canal.
    const poll = setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      if (!live) lastFull = Date.now();
      load({ withRequests: !live });
    }, 30000);

    return () => {
      disposed = true;
      clearTimeout(retryTimer);
      clearTimeout(lightTimer);
      clearInterval(poll);
      document.removeEventListener('visibilitychange', onVisible);
      window.removeEventListener('focus', onVisible);
      window.removeEventListener('online', onVisible);
      if (channel) supabase.removeChannel(channel);
    };
  }, [load, applyRequestChange]);

  // Inserir nova solicitação
  const dbInsertRequest = async (req) => {
    const { data, error } = await supabase.from('requests').insert(requestJsToDb(req)).select().single();
    if (error) throw error;
    return requestDbToJs(data);
  };

  // Atualizar solicitação
  // Manda so as colunas que mudaram. Antes, mover um card no quadro reenviava a
  // linha inteira (~50 KB com anexos) — e ainda sobrescrevia o que outra pessoa
  // tivesse alterado nos outros campos nesse meio tempo.
  const dbUpdateRequest = async (updated, old) => {
    const row = requestJsToDb(updated);
    if (old) {
      const prev = requestJsToDb(old);
      Object.keys(row).forEach(k => { if (JSON.stringify(row[k]) === JSON.stringify(prev[k])) delete row[k]; });
      if (!Object.keys(row).length) return;
    }
    const { error } = await supabase.from('requests').update(row).eq('id', updated.id);
    if (error) throw error;
  };

  // Remover solicitação
  const dbDeleteRequest = async (id) => {
    const { error } = await supabase.from('requests').delete().eq('id', id);
    if (error) throw error;
  };

  // Inserir departamento
  const dbInsertDepartment = async (name) => {
    const { error } = await supabase.from('departments').insert({ name });
    if (error) throw error;
  };

  // Editar departamento (nome + senha; renomeia nas requests)
  const dbUpdateDepartment = async (id, oldName, newName, password) => {
    const { error: e1 } = await supabase.from('departments')
      .update({ name: newName, password: password ?? null }).eq('id', id);
    if (e1) throw e1;
    if (oldName !== newName) {
      await supabase.from('requests').update({ department: newName }).eq('department', oldName);
    }
  };

  // Alterar apenas a senha de um departamento
  const dbUpdateDepartmentPassword = async (id, password) => {
    const { error } = await supabase.from('departments')
      .update({ password: password ?? null }).eq('id', id);
    if (error) throw error;
  };

  // Remover departamento
  const dbDeleteDepartment = async (id) => {
    const { error } = await supabase.from('departments').delete().eq('id', id);
    if (error) throw error;
  };

  // Contents (calendário editorial)
  const dbInsertContent = async (c) => {
    const { data, error } = await supabase.from('contents').insert(contentJsToDb(c)).select().single();
    if (error) throw error;
    return contentDbToJs(data);
  };

  const dbUpdateContent = async (c) => {
    const { error } = await supabase.from('contents').update(contentJsToDb(c)).eq('id', c.id);
    if (error) throw error;
  };

  const dbDeleteContent = async (id) => {
    const { error } = await supabase.from('contents').delete().eq('id', id);
    if (error) throw error;
  };

  // Administradores
  // Sem as colunas role/areas o admin nao pode ser salvo sem perder o grau
  // (um coordenador viraria super_admin calado) — entao para e explica.
  const ADMIN_ROLES_MISSING = new Error('Os graus de admin ainda não foram ativados no banco. Rode o script SUPABASE_FASE5.sql no Supabase (SQL Editor) e tente de novo.');
  const dbInsertAdmin = async (a) => {
    const { error } = await supabase.from('admins')
      .insert({ name: a.name, username: a.username, password: a.password, email: a.email ?? null, role: a.role || 'super_admin', areas: a.areas || [] });
    if (isMissingSchema(error, 'areas') || isMissingSchema(error, 'role')) throw ADMIN_ROLES_MISSING;
    if (error) throw error;
  };

  const dbUpdateAdmin = async (a) => {
    const { error } = await supabase.from('admins')
      .update({ name: a.name, username: a.username, password: a.password, email: a.email ?? null, role: a.role || 'super_admin', areas: a.areas || [] }).eq('id', a.id);
    if (isMissingSchema(error, 'areas') || isMissingSchema(error, 'role')) throw ADMIN_ROLES_MISSING;
    if (error) throw error;
  };

  const dbDeleteAdmin = async (id) => {
    const { error } = await supabase.from('admins').delete().eq('id', id);
    if (error) throw error;
  };

  // Estilos de IA
  const dbInsertStyle = async (s) => {
    const { error } = await supabase.from('ai_styles').insert({
      nome: s.nome, tipo: s.tipo || 'arte',
      departamento: s.departamento || null,
      prompt_base: s.promptBase || '', refs: s.refs || [],
    });
    if (error) throw error;
  };

  const dbUpdateStyle = async (s) => {
    const { error } = await supabase.from('ai_styles').update({
      nome: s.nome, tipo: s.tipo || 'arte',
      departamento: s.departamento || null,
      prompt_base: s.promptBase || '', refs: s.refs || [],
    }).eq('id', s.id);
    if (error) throw error;
  };

  const dbDeleteStyle = async (id) => {
    const { error } = await supabase.from('ai_styles').delete().eq('id', id);
    if (error) throw error;
  };

  // ---------- VOLUNTÁRIOS ----------
  const dbSignupVolunteer = async ({ name, email, phone, password, areas }) => {
    const normEmail = (email || '').trim().toLowerCase();
    const password_hash = await hashVolunteerPassword(normEmail, password);
    const cleanPhone = (phone || '').trim() || null;
    const { data, error } = await supabase.from('volunteers').insert({
      name: (name || '').trim(),
      email: normEmail,
      phone: cleanPhone,
      whatsapp: cleanPhone, // já vira número de WhatsApp por padrão
      notify: true,
      password_hash,
      areas: areas || [],
      status: 'pendente',
      xp: 0,
      level: 1,
    }).select().single();
    if (error) throw error;
    return volunteerDbToJs(data);
  };

  const dbLoginVolunteer = async ({ email, password }) => {
    const normEmail = (email || '').trim().toLowerCase();
    const { data, error } = await supabase.from('volunteers').select('*').eq('email', normEmail).maybeSingle();
    if (error) throw error;
    if (!data) throw new Error('Nenhuma conta encontrada com esse e-mail.');
    const hash = await hashVolunteerPassword(normEmail, password);
    if (hash !== data.password_hash) throw new Error('Senha incorreta.');
    return volunteerDbToJs(data);
  };

  const dbUpdateVolunteer = async (v) => {
    const patch = {
      name: v.name,
      phone: v.phone || null,
      areas: v.areas || [],
      status: v.status || 'pendente',
      xp: v.xp ?? 0,
      level: v.level ?? levelFromXp(v.xp ?? 0),
      notes: v.notes ?? null,
    };
    if (v.whatsapp !== undefined)    patch.whatsapp     = v.whatsapp || null;
    if (v.whatsappKey !== undefined) patch.whatsapp_key = v.whatsappKey || null;
    if (v.notify !== undefined)      patch.notify       = v.notify !== false;
    if (v.trainingStage !== undefined) patch.training_stage = Math.max(0, Math.min(4, Number(v.trainingStage || 0)));
    if (v.qualifiedRoles !== undefined) patch.qualified_roles = v.qualifiedRoles || [];
    let { error } = await supabase.from('volunteers').update(patch).eq('id', v.id);
    if (error && isMissingSchema(error, 'qualified_roles')) {
      const { qualified_roles, ...fallback } = patch; // coluna ainda não migrada
      ({ error } = await supabase.from('volunteers').update(fallback).eq('id', v.id));
    }
    if (error) throw error;
  };

  // Atualização "self" — voluntário edita apenas os próprios campos permitidos
  const dbUpdateVolunteerSelf = async (id, patch) => {
    const clean = {};
    if (patch.name !== undefined)        clean.name         = patch.name;
    if (patch.phone !== undefined)       clean.phone        = patch.phone || null;
    if (patch.whatsapp !== undefined)    clean.whatsapp     = patch.whatsapp || null;
    if (patch.whatsappKey !== undefined) clean.whatsapp_key = patch.whatsappKey || null;
    if (patch.notify !== undefined)      clean.notify       = patch.notify !== false;
    const { error } = await supabase.from('volunteers').update(clean).eq('id', id);
    if (error) throw error;
  };

  // Envia WhatsApp para um voluntário e loga (idempotente por kind+reference)
  // Evolution: só precisa do número (whatsapp OU phone). Sem apikey por pessoa.
  const dbNotifyVolunteer = async ({ volunteer, kind, reference, message }) => {
    const phone = volunteer?.whatsapp || volunteer?.phone;
    if (!volunteer?.notify || !phone) {
      return { skipped: true, reason: 'sem whatsapp/desativado' };
    }
    // Deduplicação: se já mandou essa mensagem, pula
    const { data: existing } = await supabase.from('whatsapp_log')
      .select('id, ok').eq('volunteer_id', volunteer.id).eq('kind', kind).eq('reference', reference || '').maybeSingle();
    if (existing?.ok) return { skipped: true, reason: 'já enviado' };

    const send = await sendWhatsappMessage({ phone, message });
    // Grava log (upsert manual: delete se falhou anterior)
    if (existing) await supabase.from('whatsapp_log').delete().eq('id', existing.id);
    await supabase.from('whatsapp_log').insert({
      volunteer_id: volunteer.id, kind, reference: reference || '',
      message, ok: send.ok, error: send.error || null,
    });
    return send;
  };

  const dbSetVolunteerStatus = async (id, status) => {
    const { error } = await supabase.from('volunteers').update({ status }).eq('id', id);
    if (error) throw error;
  };

  const dbDeleteVolunteer = async (id) => {
    const { error } = await supabase.from('volunteers').delete().eq('id', id);
    if (error) throw error;
  };

  // ---------- EVENTS ----------
  const dbInsertEvent = async (e) => {
    const payload = {
      event_date: e.date,
      title: (e.title || '').trim(),
      content_idea: e.contentIdea || null,
      notes: e.notes || null,
      areas_needed: e.areasNeeded || [],
      area_notes: e.areaNotes || {},
      roles_needed: e.rolesNeeded || [],
      status: e.status || 'aberto',
      is_training: !!e.isTraining,
      training_stage: e.isTraining ? (e.trainingStage || 1) : null,
      min_rating: Math.max(0, Math.min(10, Number(e.minRating || 0))),
    };
    let { data, error } = await supabase.from('events').insert(payload).select().single();
    if (error && isMissingSchema(error)) {
      // Colunas novas ainda não migradas: salva sem elas (o resto continua funcionando)
      const { area_notes, roles_needed, ...fallback } = payload;
      ({ data, error } = await supabase.from('events').insert(fallback).select().single());
    }
    if (error) throw error;
    return eventDbToJs(data);
  };
  const dbUpdateEvent = async (e) => {
    const payload = {
      event_date: e.date,
      title: (e.title || '').trim(),
      content_idea: e.contentIdea || null,
      notes: e.notes || null,
      areas_needed: e.areasNeeded || [],
      area_notes: e.areaNotes || {},
      roles_needed: e.rolesNeeded || [],
      status: e.status || 'aberto',
      is_training: !!e.isTraining,
      training_stage: e.isTraining ? (e.trainingStage || 1) : null,
      min_rating: Math.max(0, Math.min(10, Number(e.minRating || 0))),
    };
    let { error } = await supabase.from('events').update(payload).eq('id', e.id);
    if (error && isMissingSchema(error)) {
      const { area_notes, roles_needed, ...fallback } = payload;
      ({ error } = await supabase.from('events').update(fallback).eq('id', e.id));
    }
    if (error) throw error;
  };
  const dbDeleteEvent = async (id) => {
    const { error } = await supabase.from('events').delete().eq('id', id);
    if (error) throw error;
  };

  // ---------- SIGNUPS ----------
  const dbInsertSignup = async ({ eventId, volunteerId, area, role, volunteerIdea, status }) => {
    const payload = {
      event_id: eventId,
      volunteer_id: volunteerId,
      area,
      role: role || null,
      volunteer_idea: volunteerIdea || null,
      status: status || 'proposto',
    };
    let { data, error } = await supabase.from('event_signups').insert(payload).select().single();
    if (error && isMissingSchema(error, 'role')) {
      const { role: _r, ...fallback } = payload; // coluna ainda não migrada
      ({ data, error } = await supabase.from('event_signups').insert(fallback).select().single());
    }
    if (error) throw error;
    return signupDbToJs(data);
  };
  const dbUpdateSignup = async (s) => {
    const payload = {
      status: s.status,
      volunteer_idea: s.volunteerIdea || null,
    };
    if (s.role !== undefined) payload.role = s.role || null;
    let { error } = await supabase.from('event_signups').update(payload).eq('id', s.id);
    if (error && isMissingSchema(error, 'role')) {
      const { role: _r, ...fallback } = payload;
      ({ error } = await supabase.from('event_signups').update(fallback).eq('id', s.id));
    }
    if (error) throw error;
  };
  const dbDeleteSignup = async (id) => {
    const { error } = await supabase.from('event_signups').delete().eq('id', id);
    if (error) throw error;
  };

  // ---------- AVAILABILITY ----------
  const dbToggleAvailability = async (volunteerId, day, available) => {
    if (available) {
      const { error } = await supabase.from('availability')
        .upsert({ volunteer_id: volunteerId, day });
      if (error) throw error;
    } else {
      const { error } = await supabase.from('availability')
        .delete().eq('volunteer_id', volunteerId).eq('day', day);
      if (error) throw error;
    }
  };

  const dbInsertFeedback = async ({ volunteerId, eventId, area, rating, note, author }) => {
    const { data, error } = await supabase.from('feedbacks').insert({
      volunteer_id: volunteerId,
      event_id: eventId || null,
      area: area || null,
      rating,
      note: note || null,
      author: author || null,
    }).select().single();
    if (error) throw error;
    return feedbackDbToJs(data);
  };
  const dbDeleteFeedback = async (id) => {
    const { error } = await supabase.from('feedbacks').delete().eq('id', id);
    if (error) throw error;
  };

  const dbInsertAnnouncement = async ({ message, areas, author }) => {
    const { data, error } = await supabase.from('announcements').insert({
      message: (message || '').trim(),
      areas: areas || [],
      author: author || null,
    }).select().single();
    if (error) throw error;
    return announcementDbToJs(data);
  };
  const dbDeleteAnnouncement = async (id) => {
    const { error } = await supabase.from('announcements').delete().eq('id', id);
    if (error) throw error;
  };

  // ---------- ÁREA DE ESTUDO ----------
  const dbInsertStudyMaterial = async ({ title, description, url, kind, areas, author }) => {
    const { data, error } = await supabase.from('study_materials').insert({
      title: (title || '').trim(), description: description || null, url: url || null,
      kind: kind || 'link', areas: areas || [], author: author || null,
    }).select().single();
    if (error) {
      if (isMissingSchema(error, 'study_materials')) throw new Error('A Área de Estudo ainda não foi ativada no banco. Rode o script SUPABASE_FASE9_ESTUDO_FORUM.sql no Supabase.');
      throw error;
    }
    await load();
    return studyMaterialDbToJs(data);
  };
  const dbUpdateStudyMaterial = async ({ id, title, description, url, kind, areas }) => {
    const { error } = await supabase.from('study_materials').update({
      title: (title || '').trim(), description: description || null, url: url || null,
      kind: kind || 'link', areas: areas || [],
    }).eq('id', id);
    if (error) throw error;
    await load();
  };
  const dbDeleteStudyMaterial = async (id) => {
    const { error } = await supabase.from('study_materials').delete().eq('id', id);
    if (error) throw error;
    await load();
  };

  // ---------- FÓRUM ----------
  const dbInsertForumPost = async ({ area, parentId, authorType, authorId, authorName, body }) => {
    const { data, error } = await supabase.from('forum_posts').insert({
      area: area || null, parent_id: parentId || null,
      author_type: authorType || 'volunteer', author_id: authorId || null,
      author_name: authorName || null, body: (body || '').trim(),
    }).select().single();
    if (error) {
      if (isMissingSchema(error, 'forum_posts')) throw new Error('O Fórum ainda não foi ativado no banco. Rode o script SUPABASE_FASE9_ESTUDO_FORUM.sql no Supabase.');
      throw error;
    }
    await load();
    return forumPostDbToJs(data);
  };
  const dbDeleteForumPost = async (id) => {
    const { error } = await supabase.from('forum_posts').delete().eq('id', id);
    if (error) throw error;
    await load();
  };

  const dbInsertAreaRequest = async ({ volunteerId, area, reason }) => {
    const { data, error } = await supabase.from('volunteer_area_requests').insert({
      volunteer_id: volunteerId, area, reason: reason || null,
    }).select().single();
    if (error) throw error;
    return areaRequestDbToJs(data);
  };
  const dbApproveAreaRequest = async (req, adminName) => {
    // marca aprovado e adiciona a área ao voluntário
    const { data: volRow, error: eGet } = await supabase.from('volunteers').select('areas').eq('id', req.volunteerId).single();
    if (eGet) throw eGet;
    const cur = Array.isArray(volRow.areas) ? volRow.areas : [];
    const next = cur.includes(req.area) ? cur : [...cur, req.area];
    const { error: eUp } = await supabase.from('volunteers').update({ areas: next }).eq('id', req.volunteerId);
    if (eUp) throw eUp;
    const { error: eReq } = await supabase.from('volunteer_area_requests').update({
      status: 'aprovado', reviewed_at: new Date().toISOString(), reviewed_by: adminName || null,
    }).eq('id', req.id);
    if (eReq) throw eReq;
  };
  const dbRejectAreaRequest = async (req, adminName) => {
    const { error } = await supabase.from('volunteer_area_requests').update({
      status: 'rejeitado', reviewed_at: new Date().toISOString(), reviewed_by: adminName || null,
    }).eq('id', req.id);
    if (error) throw error;
  };

  return {
    departments, requests, contents, admins, aiStyles, volunteers, events, signups, availability, feedbacks, announcements, areaRequests, studyMaterials, forumPosts, loading,
    dbInsertStudyMaterial, dbUpdateStudyMaterial, dbDeleteStudyMaterial,
    dbInsertForumPost, dbDeleteForumPost,
    dbInsertRequest, dbUpdateRequest, dbDeleteRequest,
    dbInsertDepartment, dbUpdateDepartment, dbDeleteDepartment,
    dbUpdateDepartmentPassword,
    dbInsertContent, dbUpdateContent, dbDeleteContent,
    dbInsertAdmin, dbUpdateAdmin, dbDeleteAdmin,
    dbInsertStyle, dbUpdateStyle, dbDeleteStyle,
    dbSignupVolunteer, dbLoginVolunteer, dbUpdateVolunteer, dbUpdateVolunteerSelf, dbSetVolunteerStatus, dbDeleteVolunteer,
    dbNotifyVolunteer,
    dbInsertEvent, dbUpdateEvent, dbDeleteEvent,
    dbInsertSignup, dbUpdateSignup, dbDeleteSignup,
    dbToggleAvailability,
    dbInsertFeedback, dbDeleteFeedback,
    dbInsertAnnouncement, dbDeleteAnnouncement,
    dbInsertAreaRequest, dbApproveAreaRequest, dbRejectAreaRequest,
    reload: load
  };
};

/* =====================================================================
   PASSWORD INPUT (com mostrar/ocultar)
===================================================================== */

const PasswordInput = ({ label, value, onChange, placeholder, hint, inputRef, autoFocus }) => {
  const [show, setShow] = useState(false);
  return (
    <div className="space-y-1.5">
      {label && <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider">{label}</label>}
      <div className="relative">
        <Lock className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" />
        <input
          ref={inputRef}
          type={show ? 'text' : 'password'}
          value={value}
          onChange={onChange}
          placeholder={placeholder || '••••••'}
          autoFocus={autoFocus}
          className="mm-input w-full rounded-lg pl-10 pr-11 py-2.5 text-sm"
        />
        <button
          type="button"
          tabIndex={-1}
          onClick={() => setShow(s => !s)}
          className={`absolute right-2.5 top-1/2 -translate-y-1/2 p-1.5 rounded transition-colors ${show ? 'text-brand-200' : 'text-zinc-400 hover:text-zinc-100'}`}
          title={show ? 'Ocultar senha' : 'Mostrar senha'}
        >
          <Eye className="w-4 h-4" />
        </button>
      </div>
      {hint && <p className="text-[11px] text-zinc-400 leading-relaxed">{hint}</p>}
    </div>
  );
};

/* =====================================================================
   LOGIN VIEW
===================================================================== */

const LoginView = ({ onLogin, departments, admins, onLoginVolunteer, onSignupVolunteer }) => {
  // 'choose' | 'id' | 'dept' | 'admin' | 'vol-login' | 'vol-signup' | 'vol-sent'
  const [step, setStep] = useState('choose');
  const [value, setValue] = useState('');
  const [selectedDept, setSelectedDept] = useState(null);
  const [adminUser, setAdminUser] = useState('admin');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const inputRef = useRef(null);

  // volunteer fields
  const [volEmail, setVolEmail] = useState('');
  const [volPassword, setVolPassword] = useState('');
  const [volName, setVolName] = useState('');
  const [volPhone, setVolPhone] = useState('');
  const [volAreas, setVolAreas] = useState([]);
  const [volLoading, setVolLoading] = useState(false);

  useEffect(() => { inputRef.current?.focus(); }, [step]);

  // Sugestões enquanto digita o nome do departamento
  const suggestions = useMemo(() => {
    if (step !== 'id') return [];
    const q = slugify(value);
    if (!q || q === 'admin') return [];
    return departments.filter(d => slugify(d.name).includes(q)).slice(0, 5);
  }, [value, departments, step]);

  const openDept = (dept) => {
    setSelectedDept(dept);
    setPassword('');
    setError('');
    setStep('dept');
  };

  const openAdmin = (uname) => {
    setAdminUser(typeof uname === 'string' && uname ? uname : 'admin');
    setPassword('');
    setError('');
    setStep('admin');
  };

  const back = () => {
    setStep('choose');
    setSelectedDept(null);
    setPassword('');
    setError('');
  };

  const toggleVolArea = (a) => {
    setVolAreas(prev => prev.includes(a) ? prev.filter(x => x !== a) : [...prev, a]);
  };

  const submitVolLogin = async (e) => {
    e?.preventDefault();
    setError('');
    if (!volEmail.trim() || !volPassword) { setError('Preencha e-mail e senha.'); return; }
    setVolLoading(true);
    try {
      const v = await onLoginVolunteer({ email: volEmail, password: volPassword });
      if (v.status === 'pendente') { setError('Sua conta ainda está aguardando aprovação de um administrador.'); return; }
      if (v.status === 'rejeitado') { setError('Seu cadastro não foi aprovado. Fale com um administrador.'); return; }
      if (v.status === 'inativo') { setError('Sua conta está inativa. Fale com um administrador.'); return; }
      onLogin({ type: 'volunteer', volunteer: v });
    } catch (err) {
      setError(err?.message || 'Falha no login.');
    } finally {
      setVolLoading(false);
    }
  };

  const submitVolSignup = async (e) => {
    e?.preventDefault();
    setError('');
    if (!volName.trim()) { setError('Informe seu nome.'); return; }
    if (!volEmail.trim()) { setError('Informe um e-mail válido.'); return; }
    if (volPassword.length < 4) { setError('A senha precisa ter pelo menos 4 caracteres.'); return; }
    if (volAreas.length === 0) { setError('Selecione pelo menos uma área que você quer servir.'); return; }
    setVolLoading(true);
    try {
      await onSignupVolunteer({ name: volName, email: volEmail, phone: volPhone, password: volPassword, areas: volAreas });
      setStep('vol-sent');
    } catch (err) {
      const msg = String(err?.message || '');
      if (msg.includes('duplicate') || msg.includes('unique')) setError('Já existe uma conta com esse e-mail.');
      else setError(msg || 'Não foi possível cadastrar. Tente de novo.');
    } finally {
      setVolLoading(false);
    }
  };

  const submit = (e) => {
    e?.preventDefault();
    setError('');
    const v = value.trim();
    if (!v) return;

    // Usuário admin? (geral ou cadastrado, ex: admgabriel)
    const adm = (admins || []).find(a => slugify(a.username) === slugify(v));
    if (adm || slugify(v) === 'admin') {
      openAdmin(adm ? adm.username : v);
      return;
    }

    const dept = departments.find(d => slugify(d.name) === slugify(v));
    if (dept) {
      openDept(dept);
    } else {
      setError('Departamento não encontrado. Verifique a grafia ou selecione na lista.');
    }
  };

  const submitDept = (e) => {
    e?.preventDefault();
    if (checkDeptPassword(selectedDept, password)) {
      onLogin({ type: 'department', department: selectedDept });
    } else {
      setError('Senha incorreta.');
    }
  };

  const submitAdmin = (e) => {
    e?.preventDefault();
    const uname = slugify(adminUser.trim());
    if (!uname) {
      setError('Informe o usuário.');
      return;
    }
    const adm = (admins || []).find(a => slugify(a.username) === uname);
    if (adm) {
      if (password === adm.password) {
        onLogin({ type: 'admin', admin: { id: adm.id, name: adm.name, username: adm.username, role: adm.role || 'super_admin', areas: adm.areas || [] } });
      } else {
        setError('Senha incorreta.');
      }
      return;
    }
    // Fallback: admin geral embutido (caso a tabela admins ainda não exista)
    if ((admins || []).length === 0 && uname === 'admin' && password === ADMIN_PASSWORD) {
      onLogin({ type: 'admin', admin: { name: 'Administrador Geral', username: 'admin' } });
    } else {
      setError('Usuário ou senha incorretos.');
    }
  };

  return (
    <div className="relative mm-min-dvh flex items-center justify-center px-4 py-8 sm:p-6 overflow-hidden mm-safe-b">
      <div className="mm-aurora" />

      <div className="relative z-10 w-full max-w-md mm-slide-up">
        <div className="mb-8 sm:mb-10">
          <div className="flex items-center gap-2.5 mb-6">
            <div className="w-10 h-10 rounded-xl bg-[var(--gvv-blue)] flex items-center justify-center shadow-[var(--shadow-brand)]">
              <Sparkles className="w-[18px] h-[18px] text-[var(--gvv-lime)]" fill="currentColor" strokeWidth={1.5} />
            </div>
            <span className="text-[11px] font-bold tracking-[0.22em] uppercase text-zinc-300">Sistema interno</span>
          </div>
          <h1 className="mm-display text-[64px] leading-[0.9] sm:text-[84px] text-zinc-50">
            Ministério
            <span className="block text-[var(--gvv-blue)]">de Mídia</span>
          </h1>
          <p className="text-zinc-300 text-[15px] mt-4 max-w-[30ch]">
            Onde a equipe se organiza pra servir com <span className="mm-lime font-semibold">excelência</span>.
          </p>
        </div>

        {step === 'choose' && (
          <div className="space-y-4 mm-fade-in">
            <p className="mm-eyebrow !text-zinc-300">Como você quer entrar?</p>
            <div className="grid gap-3">
              <button
                type="button"
                onClick={() => { setStep('id'); setError(''); }}
                className="mm-tap group relative overflow-hidden rounded-2xl bg-[var(--gvv-blue)] hover:brightness-110 active:scale-[0.99] transition-all p-5 text-left shadow-[var(--shadow-brand)]"
              >
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-xl bg-white/15 flex items-center justify-center flex-shrink-0">
                    <Building2 className="w-5 h-5 text-white" />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="font-display uppercase text-[22px] leading-none tracking-[0.01em] text-white">Sou departamento</div>
                    <div className="text-[13px] text-white/80 mt-1.5">Pedir arte e acompanhar seus pedidos</div>
                  </div>
                  <div className="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center flex-shrink-0 group-hover:translate-x-0.5 transition-transform">
                    <ArrowRight className="w-4 h-4 text-white" />
                  </div>
                </div>
              </button>

              <button
                type="button"
                onClick={() => { setStep('vol-login'); setError(''); }}
                className="mm-tap group relative overflow-hidden rounded-2xl bg-[var(--gvv-lime)] hover:brightness-105 active:scale-[0.99] transition-all p-5 text-left"
              >
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-xl bg-black/10 flex items-center justify-center flex-shrink-0">
                    <Sparkles className="w-5 h-5 text-black" />
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="font-display uppercase text-[22px] leading-none tracking-[0.01em] text-black">Sou voluntário</div>
                    <div className="text-[13px] text-black/70 mt-1.5">Escalas, estudo, comunidade e progresso</div>
                  </div>
                  <div className="w-9 h-9 rounded-full bg-black/10 flex items-center justify-center flex-shrink-0 group-hover:translate-x-0.5 transition-transform">
                    <ArrowRight className="w-4 h-4 text-black" />
                  </div>
                </div>
              </button>
            </div>

            <div className="pt-2">
              <button
                type="button"
                onClick={() => { setStep('admin'); setError(''); }}
                className="mm-tap w-full rounded-2xl border border-white/15 bg-black/20 backdrop-blur-md hover:bg-white/8 transition-colors px-5 py-3.5 text-sm text-zinc-200 inline-flex items-center justify-center gap-2"
              >
                <Lock className="w-3.5 h-3.5" /> Acesso administrativo
              </button>
            </div>
          </div>
        )}

        {step === 'id' && (
          <form onSubmit={submit} className="space-y-4">
            <div className="mm-card rounded-2xl p-6 backdrop-blur-xl bg-zinc-950/70">
              <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-3">

              </label>
              <div className="relative">
                <Building2 className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" />
                <input
                  ref={inputRef}
                  value={value}
                  onChange={(e) => { setValue(e.target.value); setError(''); }}
                  placeholder="Ex: Connect, Família, Mulheres..."
                  className="w-full bg-transparent border-b border-white/15 focus:border-brand-300/60 outline-none pl-10 pr-4 py-3 text-lg text-zinc-50 placeholder:text-zinc-500 transition-colors"
                />
              </div>

              {suggestions.length > 0 && (
                <div className="mt-3 space-y-1 mm-fade-in">
                  {suggestions.map(d => (
                    <button
                      key={d.id}
                      type="button"
                      onClick={() => openDept(d)}
                      className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/[0.04] hover:bg-brand-500/10 border border-white/8 hover:border-brand-400/30 text-left transition-colors group"
                    >
                      <Building2 className="w-4 h-4 text-zinc-400 group-hover:text-brand-200 flex-shrink-0" />
                      <span className="text-sm text-zinc-100 flex-1 truncate">{d.name}</span>
                      <ArrowRight className="w-3.5 h-3.5 text-zinc-500 group-hover:text-brand-200 flex-shrink-0" />
                    </button>
                  ))}
                </div>
              )}

              {error && (
                <p className="text-xs text-rose-300 mt-3 flex items-center gap-1.5">
                  <AlertCircle className="w-3 h-3" /> {error}
                </p>
              )}

              <div className="flex gap-2 mt-6">
                <Button type="button" variant="ghost" onClick={back} className="flex-1">Voltar</Button>
                <Button type="submit" className="flex-1">
                  Continuar <ArrowRight className="w-4 h-4" />
                </Button>
              </div>
            </div>
          </form>
        )}

        {step === 'dept' && selectedDept && (
          <form onSubmit={submitDept} className="space-y-4">
            <div className="mm-card rounded-2xl p-6 backdrop-blur-xl bg-zinc-950/70">
              <div className="flex items-center gap-3 mb-5">
                <div className="w-10 h-10 rounded-xl bg-brand-500/15 border border-brand-400/30 flex items-center justify-center">
                  <Building2 className="w-4 h-4 text-brand-200" />
                </div>
                <div className="min-w-0">
                  <h2 className="font-serif text-lg text-zinc-50 truncate">{selectedDept.name}</h2>
                  <p className="text-xs text-zinc-400">Digite a senha do departamento</p>
                </div>
              </div>

              <PasswordInput
                inputRef={inputRef}
                value={password}
                onChange={(e) => { setPassword(e.target.value); setError(''); }}
                hint={!selectedDept.password
                  ? 'Senha padrão: o próprio nome do departamento. Dá pra alterar depois em Configurações.'
                  : undefined}
              />
              {error && (
                <p className="text-xs text-rose-300 mt-3 flex items-center gap-1.5">
                  <AlertCircle className="w-3 h-3" /> {error}
                </p>
              )}

              <div className="flex gap-2 mt-6">
                <Button type="button" variant="ghost" onClick={back} className="flex-1">
                  Voltar
                </Button>
                <Button type="submit" className="flex-1">
                  Entrar <ArrowRight className="w-4 h-4" />
                </Button>
              </div>
            </div>
          </form>
        )}

        {step === 'admin' && (
          <form onSubmit={submitAdmin} className="space-y-4">
            <div className="mm-card rounded-2xl p-6 backdrop-blur-xl bg-zinc-950/70">
              <div className="flex items-center gap-3 mb-5">
                <div className="w-10 h-10 rounded-xl bg-brand-500/15 border border-brand-400/30 flex items-center justify-center">
                  <Lock className="w-4 h-4 text-brand-200" />
                </div>
                <div>
                  <h2 className="font-serif text-lg text-zinc-50">Acesso administrativo</h2>
                  <p className="text-xs text-zinc-400">Painel restrito</p>
                </div>
              </div>

              <div className="space-y-4">
                <Input
                  label="Usuário"
                  icon={User}
                  value={adminUser}
                  onChange={(e) => { setAdminUser(e.target.value); setError(''); }}
                  placeholder="admin, admgabriel..."
                />
                <PasswordInput
                  label="Senha"
                  inputRef={inputRef}
                  value={password}
                  onChange={(e) => { setPassword(e.target.value); setError(''); }}
                />
              </div>
              {error && (
                <p className="text-xs text-rose-300 mt-3 flex items-center gap-1.5">
                  <AlertCircle className="w-3 h-3" /> {error}
                </p>
              )}

              <div className="flex gap-2 mt-6">
                <Button type="button" variant="ghost" onClick={back} className="flex-1">
                  Voltar
                </Button>
                <Button type="submit" className="flex-1">
                  Acessar <ArrowRight className="w-4 h-4" />
                </Button>
              </div>
            </div>
          </form>
        )}

        {step === 'vol-login' && (
          <form onSubmit={submitVolLogin} className="space-y-4">
            <div className="mm-card rounded-2xl p-6 backdrop-blur-xl bg-zinc-950/70">
              <div className="flex items-center gap-3 mb-5">
                <div className="w-10 h-10 rounded-xl bg-fuchsia-500/15 border border-fuchsia-400/30 flex items-center justify-center">
                  <Sparkles className="w-4 h-4 text-fuchsia-200" />
                </div>
                <div>
                  <h2 className="font-serif text-lg text-zinc-50">Entrar como voluntário</h2>
                  <p className="text-xs text-zinc-400">Time de mídia</p>
                </div>
              </div>

              <div className="space-y-4">
                <Input
                  label="E-mail"
                  icon={Mail}
                  type="email"
                  value={volEmail}
                  onChange={(e) => { setVolEmail(e.target.value); setError(''); }}
                  placeholder="voce@exemplo.com"
                  autoFocus
                />
                <PasswordInput
                  label="Senha"
                  value={volPassword}
                  onChange={(e) => { setVolPassword(e.target.value); setError(''); }}
                />
              </div>

              {error && (
                <p className="text-xs text-rose-300 mt-3 flex items-center gap-1.5">
                  <AlertCircle className="w-3 h-3" /> {error}
                </p>
              )}

              <div className="flex gap-2 mt-6">
                <Button type="button" variant="ghost" onClick={back} className="flex-1">Voltar</Button>

                  {volLoading ? <><Loader2 className="w-4 h-4 animate-spin" /> Entrando...</> : <>Entrar <ArrowRight className="w-4 h-4" /></>}

              </div>

              <div className="mt-5 pt-5 border-t border-white/10 text-center">
                <p className="text-xs text-zinc-400 mb-2">Ainda não tem cadastro?</p>
                <button

                  onClick={() => { setError(''); setStep('vol-signup'); }}
                  className="text-sm text-fuchsia-200 hover:text-fuchsia-100 inline-flex items-center gap-1.5"
                >
                  Cadastrar-se como voluntário <ArrowRight className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          </form>
        )}

        {step === 'vol-signup' && (
          <form onSubmit={submitVolSignup} className="space-y-4">
            <div className="mm-card rounded-2xl p-6 backdrop-blur-xl bg-zinc-950/70">
              <div className="flex items-center gap-3 mb-5">
                <div className="w-10 h-10 rounded-xl bg-fuchsia-500/15 border border-fuchsia-400/30 flex items-center justify-center">
                  <User className="w-4 h-4 text-fuchsia-200" />
                </div>
                <div>
                  <h2 className="font-serif text-lg text-zinc-50">Novo voluntário</h2>
                  <p className="text-xs text-zinc-400">Depois de enviar, um admin aprova seu acesso</p>
                </div>
              </div>

              <div className="space-y-4">
                <Input label="Nome completo" icon={User} value={volName} onChange={(e) => { setVolName(e.target.value); setError(''); }} placeholder="Seu nome" autoFocus />
                <Input label="E-mail" icon={Mail} type="email" value={volEmail} onChange={(e) => { setVolEmail(e.target.value); setError(''); }} placeholder="voce@exemplo.com" />
                <Input label="Telefone (opcional)" icon={Phone} value={volPhone} onChange={(e) => setVolPhone(e.target.value)} placeholder="(41) 9 9999-9999" />
                <PasswordInput label="Senha" value={volPassword} onChange={(e) => { setVolPassword(e.target.value); setError(''); }} hint="Mínimo 4 caracteres." />

                <div>
                  <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">

                  </label>
                  <div className="grid grid-cols-2 gap-2">
                    {VOLUNTEER_AREAS.map(a => {
                      const Ic = a.icon;
                      const active = volAreas.includes(a.value);

                        <button
                          key={a.value}
                          type="button"
                          onClick={() => { toggleVolArea(a.value); setError(''); }}

                        >
                          <Ic className="w-4 h-4 flex-shrink-0" />
                          <span className="flex-1 text-left">{a.label}</span>
                          {active && <Check className="w-3.5 h-3.5" />}
                        </button>

                    })}
                  </div>
                </div>
              </div>

              {error && (
                <p className="text-xs text-rose-300 mt-4 flex items-center gap-1.5">
                  <AlertCircle className="w-3 h-3" /> {error}
                </p>

              <div className="flex gap-2 mt-6">
                <Button type="button" variant="ghost" onClick={() => setStep('vol-login')} className="flex-1">Voltar</Button>
                <Button type="submit" className="flex-1" disabled={volLoading}>
                  {volLoading ? <><Loader2 className="w-4 h-4 animate-spin" /> Enviando...</> : <>Enviar cadastro <ArrowRight className="w-4 h-4" /></>}

              </div>
            </div>
          </form>
        )}

        {step === 'vol-sent' && (
          <div className="mm-card rounded-2xl p-8 backdrop-blur-xl bg-zinc-950/70 text-center mm-fade-in">
            <div className="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/15 border border-emerald-400/30 flex items-center justify-center mb-4">
              <Check className="w-6 h-6 text-emerald-200" />
            </div>
            <h2 className="font-serif text-xl text-zinc-50 mb-2">Cadastro enviado!</h2>
            <p className="text-sm text-zinc-300 leading-relaxed mb-6">

// Barra de abas inferior — navegacao primaria no celular.
// Mostra os 4 destinos mais usados + "Mais" (abre a gaveta com o resto).
const MobileTabBar = ({ items, active, onChange, onOpenMore, moreOpen }) => {
  const flagged = items.filter(i => i.tab);
  const primary = flagged.length ? flagged.slice(0, 4) : items.slice(0, 4);
  const restActive = !primary.some(i => i.id === active);
  return (
    <nav className="mm-tabbar md:hidden" aria-label="Navegação principal">
      {primary.map(item => {
        const Icon = item.icon;
        const isActive = active === item.id && !moreOpen;
        return (
          <button
            key={item.id}
            type="button"
            aria-current={isActive ? 'page' : undefined}
            data-active={isActive}
            onClick={() => onChange(item.id)}
            className="mm-tabbar-item"
          >
            <Icon className="w-[19px] h-[19px]" strokeWidth={isActive ? 2.3 : 1.9} />
            <span className="mm-tabbar-label px-1">{item.shortLabel || item.label}</span>
            {item.badge > 0 && <span className="mm-tabbar-badge">{item.badge > 99 ? '99+' : item.badge}</span>}
          </button>
        );
      })}
      <button
        type="button"
        data-active={moreOpen || restActive}
        onClick={onOpenMore}
        className="mm-tabbar-item"
      >
        <Menu className="w-[19px] h-[19px]" strokeWidth={moreOpen || restActive ? 2.3 : 1.9} />
        <span className="mm-tabbar-label px-1">Mais</span>
      </button>
    </nav>
  );
};

const Sidebar = ({ items, active, onChange, title, subtitle, onLogout, mobileOpen, setMobileOpen }) => {
  // No computador a barra pode ser recolhida (so icones). Fica salvo neste aparelho.
  const [collapsed, setCollapsed] = useState(() => { try { return localStorage.getItem('mm-side-collapsed') === '1'; } catch { return false; } });
  const toggleCollapsed = () => setCollapsed(v => { const n = !v; try { localStorage.setItem('mm-side-collapsed', n ? '1' : '0'); } catch {} return n; });

/* =====================================================================
   UPLOAD — area de soltar + fila com progresso por arquivo
===================================================================== */

const FileDropZone = ({ onFiles, accept, title, hint, disabled, compact = false }) => {
  const [over, setOver] = useState(false);
  const depth = useRef(0);
  const hasFiles = (e) => Array.from(e.dataTransfer?.types || []).includes('Files');
  return (
    <label
      onDragEnter={(e) => { if (!hasFiles(e) || disabled) return; e.preventDefault(); depth.current++; setOver(true); }}
      onDragOver={(e) => { if (!hasFiles(e) || disabled) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }}
      onDragLeave={() => { if (--depth.current <= 0) { depth.current = 0; setOver(false); } }}
      onDrop={(e) => {
        if (!hasFiles(e)) return;
        e.preventDefault(); depth.current = 0; setOver(false);
        if (!disabled) onFiles(e.dataTransfer.files);
      }}
      className={`mm-dropzone ${over ? 'is-over' : ''} flex flex-col items-center justify-center text-center w-full ${compact ? 'py-6' : 'py-8'} px-4 border-2 border-dashed border-white/15 hover:border-brand-400/40 rounded-xl bg-white/[0.02] ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}
    >
      <Upload className={`${compact ? 'w-5 h-5' : 'w-6 h-6'} text-zinc-300 mb-2`} />
      <span className="text-sm text-zinc-100 font-medium">
        {over ? 'Solte para adicionar' : title}
      </span>
      {hint && <span className="text-xs text-zinc-400 mt-1">{hint}</span>}
      <input
        type="file"
        multiple
        accept={accept}
        disabled={disabled}
        className="hidden"
        onChange={(e) => { onFiles(e.target.files); e.target.value = ''; }}
      />
    </label>
  );
};

// status: { [id]: { status: 'uploading' | 'done' | 'error', progress, error } }
const UploadQueue = ({ items, status = {}, onRemove, busy }) => {
  if (!items.length) return null;
  const totalSize = items.reduce((s, f) => s + (f.size || 0), 0);
  return (
    <div className="mt-3">
      <div className="flex items-center justify-between text-[11px] text-zinc-400 mb-1.5 px-0.5">
        <span>{items.length} {items.length === 1 ? 'arquivo' : 'arquivos'} · {formatSize(totalSize)}</span>
        {!busy && items.length > 1 && (
          <button type="button" onClick={() => items.forEach(f => onRemove(f.id))} className="hover:text-rose-300">
            limpar tudo
          </button>
        )}
      </div>
      <ul className="space-y-1.5 max-h-72 overflow-y-auto overscroll-contain pr-0.5">
        {items.map(f => {
          const st = status[f.id] || {};
          return (
            <li key={f.id} className={`relative flex items-center gap-3 p-2.5 rounded-lg border overflow-hidden ${
              st.status === 'error' ? 'bg-rose-500/[0.06] border-rose-400/30' : 'bg-white/[0.04] border-white/8'
            }`}>
              {f.thumbnail ? (
                <img src={f.thumbnail} alt="" className="w-10 h-10 rounded-md object-cover flex-shrink-0" />
              ) : (
                <div className="w-10 h-10 rounded-md bg-white/8 flex items-center justify-center flex-shrink-0">
                  {f.type?.startsWith('video/') ? <Video className="w-4 h-4 text-zinc-300" /> : <FileText className="w-4 h-4 text-zinc-300" />}
                </div>
              )}
              <div className="flex-1 min-w-0">
                <p className="text-sm text-zinc-100 truncate font-medium">{f.name}</p>
                <p className={`text-xs ${st.status === 'error' ? 'text-rose-300' : 'text-zinc-400'}`}>
                  {st.status === 'error' ? `Não subiu: ${st.error}` :
                   st.status === 'done' ? 'Enviado' :
                   st.status === 'uploading' ? `${Math.round((st.progress || 0) * 100)}% de ${formatSize(f.size)}` :
                   formatSize(f.size)}
                </p>
              </div>
              {st.status === 'uploading' ? (
                <Loader2 className="w-4 h-4 text-brand-300 animate-spin flex-shrink-0" />
              ) : st.status === 'done' ? (
                <Check className="w-4 h-4 text-emerald-300 flex-shrink-0" />
              ) : (
                <button
                  type="button"
                  disabled={busy}
                  onClick={() => onRemove(f.id)}
                  aria-label={`Remover ${f.name}`}
                  className="mm-tap p-1.5 text-zinc-400 hover:text-rose-300 transition-colors disabled:opacity-30 flex-shrink-0"
                >
                  <X className="w-4 h-4" />
                </button>
              )}
              {st.status === 'uploading' && (
                <span className="absolute left-0 bottom-0 h-0.5 mm-brand-grad transition-[width] duration-200" style={{ width: `${(st.progress || 0) * 100}%` }} />
              )}
            </li>
          );
        })}
      </ul>
    </div>
  );
};

const FilePreview = ({ meta, onRemove, compact = false }) => {
  const toast = useToast();
  const [downloading, setDownloading] = useState(false);

  const handleDownload = async () => {
    setDownloading(true);
    try {
      const url = await FileStore.load(meta);
      if (!url) {
        toast.error('Arquivo não encontrado no armazenamento.');
        return;
      }
      await downloadDataURL(url, meta.name);
    } catch (e) {
      toast.error('Erro ao baixar arquivo.');
    } finally {
      setDownloading(false);
    }
  };

  const isImage = meta.type?.startsWith('image/');
  const isVideo = meta.type?.startsWith('video/');

  return (
    <div className={`flex items-center gap-3 ${compact ? 'p-2.5' : 'p-3'} rounded-lg bg-white/[0.04] border border-white/8`}>
      {isImage && meta.thumbnail ? (
        <img src={meta.thumbnail} alt={meta.name} className={`${compact ? 'w-10 h-10' : 'w-12 h-12'} rounded object-cover flex-shrink-0`} />
      ) : (
        <div className={`${compact ? 'w-10 h-10' : 'w-12 h-12'} rounded bg-white/8 flex items-center justify-center flex-shrink-0`}>
          {isVideo ? <Video className="w-5 h-5 text-zinc-300" /> :
           isImage ? <ImageIcon className="w-5 h-5 text-zinc-300" /> :
           <FileText className="w-5 h-5 text-zinc-300" />}
        </div>
      )}
      <div className="flex-1 min-w-0">
        <p className="text-sm text-zinc-100 truncate font-medium">{meta.name}</p>
        <p className="text-xs text-zinc-400">{formatSize(meta.size)}</p>
      </div>
      <button
        onClick={handleDownload}
        disabled={downloading}
        className="p-2 text-zinc-300 hover:text-brand-200 hover:bg-brand-500/10 rounded-lg transition-colors disabled:opacity-50"
        title="Baixar"
      >
        {downloading ? <Loader2 className="w-4 h-4 animate-spin" /> : <Download className="w-4 h-4" />}
      </button>
      {onRemove && (
        <button onClick={onRemove} className="p-2 text-zinc-400 hover:text-rose-300 rounded-lg transition-colors">
          <X className="w-4 h-4" />
        </button>
      )}
    </div>
  );
};

   NEW REQUEST FORM
===================================================================== */

const NewRequestForm = ({ department, departments, isAdmin, adminName, onSubmit, onCancel }) => {
  const toast = useToast();
  const INTERNAL_DEPT = { id: '__interno__', name: 'Interno (Mídia)' };
  const [adminTarget, setAdminTarget] = useState(() => isAdmin ? '__interno__' : '');
  const targetDept = isAdmin
    ? (adminTarget === '__interno__' ? INTERNAL_DEPT : (departments || []).find(d => d.id === adminTarget) || INTERNAL_DEPT)
    : department;
  const [form, setForm] = useState({
    title: '',
    serviceTypes: [],
    responsibleName: isAdmin && adminName ? adminName : '',
    responsiblePhone: '',
    responsibleEmail: '',
    eventDate: '',
    eventTime: '',
    eventEndDate: '',
    eventEndTime: '',
    eventLocation: '',
    guests: [], // [{ id, name, instagram }]
    briefing: '',
  });
  const [singleDay, setSingleDay] = useState(true);
  const [pendingFiles, setPendingFiles] = useState([]); // { id, file, name, size, type, thumbnail }
  // arquivos que ja subiram numa tentativa anterior que falhou em parte — nao sobem de novo
  const [uploadedRefs, setUploadedRefs] = useState([]);
  const [submitting, setSubmitting] = useState(false);
  const [uploadProgress, setUploadProgress] = useState(0);
  const [errors, setErrors] = useState({});

  const update = (k, v) => {
    setForm(f => ({ ...f, [k]: v }));
    setErrors(e => ({ ...e, [k]: undefined }));
  };

  const toggleService = (value) => {
    setForm(f => {
      const next = f.serviceTypes.includes(value)
        ? f.serviceTypes.filter(s => s !== value)
        : [...f.serviceTypes, value];
      return { ...f, serviceTypes: next };
    });
    setErrors(e => ({ ...e, serviceTypes: undefined }));
  };

  const addGuest = () => setForm(f => ({ ...f, guests: [...f.guests, { id: uid(), name: '', instagram: '' }] }));
  const updateGuest = (id, key, value) =>
    setForm(f => ({ ...f, guests: f.guests.map(g => g.id === id ? { ...g, [key]: value } : g) }));
  const removeGuest = (id) => setForm(f => ({ ...f, guests: f.guests.filter(g => g.id !== id) }));

  const [fileStatus, setFileStatus] = useState({});
  const handleFiles = async (files) => {
    const items = await prepareUploads(files, { max: MAX_REQUEST_FILES, already: pendingFiles.length, toast });
    if (items.length) setPendingFiles(curr => [...curr, ...items].slice(0, MAX_REQUEST_FILES));
  };

  const removeFile = (id) => setPendingFiles(f => f.filter(x => x.id !== id));

  const validate = () => {
    const e = {};
    if (!form.title.trim()) e.title = 'Dê um nome ao evento ou pedido';
    if (!isAdmin) {
      if (form.serviceTypes.length === 0) e.serviceTypes = 'Selecione pelo menos um tipo de serviço';
      if (!form.responsibleName.trim()) e.responsibleName = 'Obrigatório';
      if (!form.responsiblePhone.trim()) e.responsiblePhone = 'Obrigatório';
      if (!/^\S+@\S+\.\S+$/.test(form.responsibleEmail.trim())) e.responsibleEmail = 'Informe um e-mail válido (é nele que chegam os avisos)';
      if (!form.eventDate) e.eventDate = 'Obrigatório';
      if (!singleDay) {
        if (!form.eventEndDate) e.eventEndDate = 'Informe a data de término';
        else if (form.eventDate && form.eventEndDate < form.eventDate) e.eventEndDate = 'A data final deve ser igual ou depois do início';
      }
      if (!form.briefing.trim() || form.briefing.length < 10) e.briefing = 'Descreva com mais detalhes (mín. 10 caracteres)';
    } else {
      if (!singleDay && form.eventEndDate && form.eventDate && form.eventEndDate < form.eventDate)
        e.eventEndDate = 'A data final deve ser igual ou depois do início';
      if (form.responsibleEmail.trim() && !/^\S+@\S+\.\S+$/.test(form.responsibleEmail.trim()))
        e.responsibleEmail = 'E-mail inválido';
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = async (ev) => {
    ev.preventDefault();
    if (!validate()) {
      toast.error('Preencha os campos obrigatórios.');
      return;
    }
    setSubmitting(true);
    setUploadProgress(0);

    try {
      // Upload all files to Supabase Storage
      const results = await uploadMany(pendingFiles, {
        onItem: (it, st) => setFileStatus(s => ({ ...s, [it.id]: st })),
        onTotal: (p) => setUploadProgress(p * 100),
      });
      const failed = results.filter(r => !r.ok);
      if (failed.length) {
        // o que subiu fica marcado como enviado; so os que falharam voltam pra fila
        toast.error(`${failed.length} ${failed.length === 1 ? 'arquivo não subiu' : 'arquivos não subiram'}. Remova ou tente enviar de novo.`);
        setPendingFiles(curr => curr.filter(f => failed.some(r => r.item.id === f.id)));
        setUploadedRefs(prev => [...prev, ...results.filter(r => r.ok).map(r => ({ ...r.meta }))]);
        setSubmitting(false);
        return;
      }
      const referenceFiles = [
        ...uploadedRefs,
        ...results.map(r => ({ ...r.meta })),
      ];

      const actorLabel = isAdmin
        ? `${form.responsibleName.trim() || (adminName || 'Admin')} (Admin)`
        : `${form.responsibleName.trim()} (${targetDept.name})`;
      const request = {
        id: uid(),
        department: targetDept.name,
        // Placeholder "__interno__" não é UUID válido — grava como null
        departmentId: targetDept.id === '__interno__' ? null : targetDept.id,
        title: form.title.trim(),
        serviceTypes: form.serviceTypes,
        responsibleName: form.responsibleName,
        responsiblePhone: form.responsiblePhone,
        responsibleEmail: form.responsibleEmail.trim(),
        eventDate: form.eventDate,
        eventTime: form.eventTime,
        eventEndDate: singleDay ? '' : form.eventEndDate,
        eventEndTime: singleDay ? '' : form.eventEndTime,
        eventLocation: form.eventLocation,
        guests: form.guests.filter(g => g.name.trim()).map(g => ({
          name: g.name.trim(),
          instagram: (g.instagram || '').trim(),
        })),
        briefing: form.briefing,
        referenceFiles,
        status: 'pendente',
        createdAt: new Date().toISOString(),
        deliveries: [],
        notes: '',
        createdByAdmin: !!isAdmin,
        activity: [{
          id: uid(),
          actor: actorLabel,
          action: isAdmin ? 'abriu o chamado' : 'criou a solicitação',
          at: new Date().toISOString(),
        }],
      };
      await onSubmit(request);
    } catch (err) {
      toast.error('Erro ao enviar: ' + (err?.message || 'tente novamente'));
    } finally {
      setSubmitting(false);
      setUploadProgress(0);
    }
  };

  return (
    <form onSubmit={submit} className="space-y-6 mm-fade-in">
      {/* Destino do chamado — só quando o admin está abrindo */}
      {isAdmin && (
        <div className="mm-card rounded-xl p-4 bg-brand-400/[0.04] border-brand-400/20">
          <label className="block text-xs font-medium text-brand-100 uppercase tracking-wider mb-2">Para quem é esta demanda?</label>
          <div className="grid sm:grid-cols-2 gap-2">
            <button type="button" onClick={() => setAdminTarget('__interno__')}
              className={`px-3 py-2.5 rounded-lg border text-sm text-left transition ${adminTarget === '__interno__' ? 'bg-brand-400/15 border-brand-400/50 text-brand-100' : 'bg-white/[0.03] border-white/10 text-zinc-300 hover:border-white/20'}`}>
              <div className="font-medium">Interno (Mídia)</div>
              <div className="text-[11px] text-zinc-400">Tarefa do próprio time de mídia</div>
            </button>
            <select value={adminTarget === '__interno__' ? '' : adminTarget} onChange={(e) => setAdminTarget(e.target.value || '__interno__')}
              className="mm-input rounded-lg px-3 py-2.5 text-sm">
              <option value="" className="bg-zinc-900">— Para um departamento —</option>
              {(departments || []).map(d => <option key={d.id} value={d.id} className="bg-zinc-900">{d.name}</option>)}
            </select>
          </div>
        </div>
      )}
      {/* Título do evento/pedido — campo principal */}
      <div>
        <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">
          Título do evento ou pedido *
        </label>
        <input
          value={form.title}
          onChange={(e) => update('title', e.target.value)}
          placeholder="Ex: Culto Jovens · Conferência Mulheres · Lançamento Connect..."
          className="mm-input w-full rounded-lg px-4 py-3.5 text-base font-medium"
          autoFocus
        />
        {errors.title && <p className="text-xs text-rose-300 mt-2">{errors.title}</p>}
        <p className="text-[11px] text-zinc-400 mt-1.5">Esse nome vai aparecer em destaque nos cards e no calendário.</p>
      </div>

      {/* Service types — multi-select */}
      <div>

/* =====================================================================
   REQUEST DETAIL
===================================================================== */

const RequestDetail = ({ request, open, onClose, isAdmin, onUpdate, onDelete, actor }) => {
  const toast = useToast();
  const [editingStatus, setEditingStatus] = useState(false);
  const [newDelivery, setNewDelivery] = useState({ type: 'text', content: '', linkUrl: '', coverage: '' });
  const [deliveryFiles, setDeliveryFiles] = useState([]); // [{ id, file, name, size, type, thumbnail }]
  const [deliveryStatus, setDeliveryStatus] = useState({});
  const [notes, setNotes] = useState('');
  const [uploadingDelivery, setUploadingDelivery] = useState(false);
  const [deliveryProgress, setDeliveryProgress] = useState(0);
  const [confirmDeleteOpen, setConfirmDeleteOpen] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const [commentText, setCommentText] = useState('');
  const [sendingComment, setSendingComment] = useState(false);

  useEffect(() => {
    if (request) setNotes(request.notes || '');
  }, [request?.id]);

  if (!request) return null;

  const services = getServices(request);
  const hasCobertura = services.includes('cobertura');

  // Registro automático: quem fez o quê e quando
  const actorName = actor?.name || 'Admin';
  const actorRole = actor?.role || (isAdmin ? 'admin' : 'dept');

  const sendComment = async () => {
    const text = commentText.trim();
    if (!text) return;
    setSendingComment(true);
    try {
      const comment = {
        id: uid(),
        author: actorName,
        role: actorRole,
        text,
        at: new Date().toISOString(),
      };
      await onUpdate({ ...request, comments: [...(request.comments || []), comment] });
      setCommentText('');
    } catch (e) {
      toast.error('Erro ao enviar mensagem.');
    } finally {
      setSendingComment(false);
    }
  };
  const withLog = (req, action) => ({
    ...req,
    activity: [
      ...(req.activity || []),
      { id: uid(), actor: actorName, action, at: new Date().toISOString() },
    ],
  });

  const changeStatus = async (status) => {
    const label = (STATUS_CONFIG[status] || STATUS_CONFIG.pendente).label;
    await onUpdate(withLog({ ...request, status }, `alterou o status para "${label}"`));
    setEditingStatus(false);
    toast.success('Status atualizado');
  };

  const handleDeliveryFiles = async (files) => {
    const items = await prepareUploads(files, { max: MAX_REQUEST_FILES, already: deliveryFiles.length, toast });
    if (items.length) setDeliveryFiles(curr => [...curr, ...items].slice(0, MAX_REQUEST_FILES));
  };

  const addDelivery = async () => {
    let delivery = null;
    let fileDeliveries = null;
    let failedIds = [];

    if (newDelivery.type === 'file') {
      if (!deliveryFiles.length) { toast.error('Selecione pelo menos um arquivo.'); return; }
      setUploadingDelivery(true);
      setDeliveryProgress(0);
      const results = await uploadMany(deliveryFiles, {
        onItem: (it, st) => setDeliveryStatus(s => ({ ...s, [it.id]: st })),
        onTotal: (p) => setDeliveryProgress(p * 100),
      });
      setUploadingDelivery(false);
      const ok = results.filter(r => r.ok);
      failedIds = results.filter(r => !r.ok).map(r => r.item.id);
      if (!ok.length) { toast.error('Nenhum arquivo subiu. Confira a conexão e tente de novo.'); return; }
      const at = new Date().toISOString();
      // um item de entrega por arquivo; a observação vai só no primeiro
      fileDeliveries = ok.map((r, i) => ({
        id: uid(),
        type: 'file',
        file: { ...r.meta },
        notes: i === 0 ? newDelivery.content : '',
        createdAt: at,
      }));
    } else if (newDelivery.type === 'link') {
      if (!newDelivery.linkUrl.trim()) { toast.error('Informe o link.'); return; }
      delivery = {
        id: uid(),
        type: 'link',
        url: newDelivery.linkUrl.trim(),
        notes: newDelivery.content,
        createdAt: new Date().toISOString(),
      };
    } else if (newDelivery.type === 'coverage') {
      if (!newDelivery.coverage) { toast.error('Selecione a resposta de cobertura.'); return; }
      delivery = {
        id: uid(),
        type: 'coverage',
        coverage: newDelivery.coverage,
        notes: newDelivery.content,
        createdAt: new Date().toISOString(),
      };
    } else if (newDelivery.type === 'text') {
      if (!newDelivery.content.trim()) { toast.error('Escreva a observação.'); return; }
      delivery = {
        id: uid(),
        type: 'text',
        notes: newDelivery.content.trim(),
        createdAt: new Date().toISOString(),
      };
    }

    const added = fileDeliveries || (delivery ? [delivery] : []);
    if (!added.length) return;
    added.forEach(d => { d.by = actorName; });

    const tipoLabel = fileDeliveries
      ? (added.length === 1 ? 'arquivo' : `${added.length} arquivos`)
      : delivery.type === 'link' ? 'link'
      : delivery.type === 'coverage' ? 'resposta de cobertura'
      : 'observação';

    const updated = withLog({
      ...request,
      deliveries: [...(request.deliveries || []), ...added],
    }, `adicionou uma entrega (${tipoLabel})`);
    try {
      await onUpdate(updated);
    } catch (err) {
      toast.error('Os arquivos subiram, mas a entrega não foi salva. Tente de novo.');
      return;
    }

    if (fileDeliveries) {
      // quem falhou continua na fila pra tentar de novo; o resto sai
      setDeliveryFiles(curr => curr.filter(f => failedIds.includes(f.id)));
      setDeliveryStatus(s => Object.fromEntries(Object.entries(s).filter(([id]) => failedIds.includes(id))));
      if (failedIds.length) {
        toast.error(`${added.length} enviados, ${failedIds.length} falharam — eles continuam na lista.`);
        return;
      }
    }
    setNewDelivery({ type: 'text', content: '', linkUrl: '', coverage: '' });
    toast.success(added.length > 1 ? `${added.length} arquivos entregues` : 'Entrega adicionada');
  };

  const removeDelivery = async (id) => {
    const target = request.deliveries.find(d => d.id === id);
    if (target?.type === 'file' && target.file) {
      await FileStore.remove(target.file);
    }
    const updated = withLog({
      ...request,
      deliveries: (request.deliveries || []).filter(d => d.id !== id),
    }, 'removeu uma entrega');
    await onUpdate(updated);
    toast.success('Entrega removida');
  };

  const saveNotes = async () => {
    await onUpdate(withLog({ ...request, notes }, 'atualizou as observações internas'));
    toast.success('Observações salvas');
  };

  return (
    <Modal open={open} onClose={onClose} size="lg">
      <div className="p-6 md:p-8">
        {/* Header */}
        <div className="flex items-start justify-between gap-4 mb-6 pb-6 border-b border-white/8">
          <div className="flex items-start gap-4 min-w-0">
            <div className="w-12 h-12 rounded-xl mm-brand-grad flex items-center justify-center flex-shrink-0 shadow-lg shadow-brand-900/30">
              <Sparkles className="w-5 h-5 on-accent" strokeWidth={2.5} />
            </div>
            <div className="min-w-0">
              <div className="flex items-center gap-2 mb-1 flex-wrap">
                <h2 className="font-serif text-2xl text-zinc-50">
                  {request.title || 'Solicitação'}
                </h2>
                <span className="text-xs text-zinc-400 font-mono px-2 py-0.5 rounded bg-white/5 border border-white/10">
                  #{request.id.slice(0, 6).toUpperCase()}
                </span>
              </div>
              <div className="flex items-center gap-2 text-sm text-zinc-300 flex-wrap">
                <Building2 className="w-3.5 h-3.5" />
                <span className="font-medium">{request.department}</span>
                <span className="w-1 h-1 rounded-full bg-zinc-600" />
                <span className="text-zinc-400">{formatDateTime(request.createdAt)}</span>
              </div>
            </div>
          </div>
          <button onClick={onClose} className="p-2 -mr-2 -mt-2 text-zinc-300 hover:text-zinc-50 transition-colors">

                disabled={deleting}
                className="flex-shrink-0"
              >

                Apagar solicitação
              </Button>
            </div>
          </div>
        )}
      </div>

      {/* Modal de confirmação de exclusão */}
      <Modal open={confirmDeleteOpen} onClose={() => !deleting && setConfirmDeleteOpen(false)} size="sm">
        <div className="p-6">
          <div className="w-12 h-12 rounded-xl bg-rose-500/15 border border-rose-400/30 flex items-center justify-center mb-4">
            <AlertCircle className="w-5 h-5 text-rose-200" />
          </div>
          <h3 className="font-serif text-xl text-zinc-50 mb-2">Apagar esta solicitação?</h3>
          <p className="text-sm text-zinc-300 mb-2">
            A solicitação <span className="font-semibold text-zinc-100">#{request.id.slice(0, 6).toUpperCase()}</span> de{' '}

            <p className="text-xs text-rose-300 mb-4">
              ⚠ Todos os arquivos vinculados também serão excluídos do armazenamento.

            <Button
              variant="danger"

                setDeleting(true);

                  await onDelete(request);

                  setDeleting(false);
                }
              }}
              className="flex-1"
              disabled={deleting}
            >
              {deleting ? <Loader2 className="w-4 h-4 animate-spin" /> : <Trash2 className="w-4 h-4" />}

      </Modal>
    </Modal>
  );
};
