    const err = c.error || i.error;
    if (err) {
      if (/PGRST205|42P01|schema cache|does not exist/i.test(`${err.message} ${err.code}`)) setMissing(true);
    } else {
      setMissing(false);
      setCategories((c.data || []).map(agCatDb));
      setItems((i.data || []).map(agItemDb));
    }
    setLoading(false);
  }, []);

  useEffect(() => {
    load();
    let t = null;
    const soon = () => { clearTimeout(t); t = setTimeout(load, 200); };
    const ch = supabase.channel('mm-agenda-' + Date.now())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'agenda_categories' }, soon)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'agenda_items' }, soon)
      .subscribe();
    return () => { clearTimeout(t); supabase.removeChannel(ch); };
  }, [load]);

  const catById = useMemo(() => new Map(categories.map(c => [c.id, c])), [categories]);
  const colorOf = (it) => catById.get(it.categoryId)?.color || '#64748B';
  const isPostItem = (it) => catById.get(it.categoryId)?.kind === 'post';
  const isMine = (it) => meId && it.people.some(p => p.id === meId);
  const visible = useMemo(() => items.filter(it => !hidden.has(it.categoryId || 'none') && (!onlyMine || isMine(it))), [items, hidden, onlyMine, meId]);
  const byDay = useMemo(() => {
    const m = new Map();
    visible.forEach(it => { if (!m.has(it.date)) m.set(it.date, []); m.get(it.date).push(it); });
    m.forEach(list => list.sort((a, b) => (a.startTime || '99').localeCompare(b.startTime || '99')));
    return m;
  }, [visible]);

  const weeks = useMemo(() => {
    const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const out = [];
    for (let w = 0; w < 6; w++) {
      const row = [];
      for (let d = 0; d < 7; d++) { const day = new Date(start); day.setDate(start.getDate() + w * 7 + d); row.push(day); }
      if (w >= 4 && row[0].getMonth() !== cursor.getMonth()) break;
      out.push(row);
    }
    return out;
  }, [cursor]);

  const shiftMonth = (n) => setCursor(c => new Date(c.getFullYear(), c.getMonth() + n, 1));
  const goToday = () => { const d = new Date(); setCursor(new Date(d.getFullYear(), d.getMonth(), 1)); setSelected(today); };
  const newItem = (date) => !readOnly && setEditing({ id: null, categoryId: null, title: '', date: date || selected || today, startTime: '', endTime: '', description: '', links: [], files: [], people: [] });
  const openItem = (it) => (readOnly ? setViewing(it) : setEditing(it));
  // No celular o painel do dia fica embaixo do calendario: leva o olho ate ele
  const pickDay = (key) => {
    setSelected(key);
    if (window.matchMedia('(max-width: 1023px)').matches) setTimeout(() => dayPanelRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  };

  const saveItem = async (it, isPost) => {
    const row = agItemToDb(it, isPost);
    if (it.id) {
      const { error } = await supabase.from('agenda_items').update(row).eq('id', it.id);
      if (error) throw error;
      const old = items.find(x => x.id === it.id);
      const keep = new Set((it.files || []).map(f => f.path));
      (old?.files || []).filter(f => !keep.has(f.path)).forEach(f => FileStore.remove(f).catch(() => {}));
      toast.success('Salvo.');
    } else {
      const { error } = await supabase.from('agenda_items').insert({ ...row, created_by: authorName || null });
      if (error) throw error;
      toast.success('Adicionado na agenda.');
    }
    setSelected(it.date);
    load();
  };

  const deleteItem = async (it) => {
    if (!await ask({ title: 'Apagar da agenda?', message: `“${it.title}” e os arquivos anexados serão removidos.`, danger: true, confirmLabel: 'Apagar' })) return;
    const { error } = await supabase.from('agenda_items').delete().eq('id', it.id);
    if (error) { toast.error(error.message); return; }
    (it.files || []).forEach(f => FileStore.remove(f).catch(() => {}));
    setEditing(null);
    toast.success('Apagado.');
    load();
  };

  const createCat = async (c) => {
    const { error } = await supabase.from('agenda_categories').insert(c);
    if (error) throw error;
    load();
  };
  const updateCat = async (c) => {
    setCategories(list => list.map(x => x.id === c.id ? c : x));
    const { error } = await supabase.from('agenda_categories').update({ name: c.name, color: c.color, kind: c.kind }).eq('id', c.id);
    if (error) { toast.error(agDbHint(error)); load(); }
  };
  const deleteCat = async (c) => {
    const n = items.filter(i => i.categoryId === c.id).length;
    if (!await ask({ title: `Apagar “${c.name}”?`, message: n ? `${n} item(ns) continuam na agenda, só que sem categoria.` : 'Nenhum item usa essa categoria.', danger: true, confirmLabel: 'Apagar' })) return;
    const { error } = await supabase.from('agenda_categories').delete().eq('id', c.id);
    if (error) { toast.error(error.message); return; }
    load();
  };

  const toggleFilter = (id) => setHidden(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });

  if (missing) {
    return (
      <EmptyState icon={Database} title="Falta criar as tabelas da agenda"
        description="Rode o arquivo SUPABASE_AGENDA_CONTEUDO.sql (ou o SCHEMA_COMPLETO.sql) no SQL Editor do Supabase e recarregue." />
    );
  }

  const selItems = byDay.get(selected) || [];
  const selDate = selected ? new Date(selected + 'T12:00:00') : null;
  const hasNone = items.some(i => !i.categoryId);
  // contadores do mes (resumo visual no topo)
  const monthKey = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, '0')}`;
  const monthItems = visible.filter(i => i.date.startsWith(monthKey));
  const monthPosts = monthItems.filter(isPostItem).length;

  const renderItem = (it) => {
              const c = catById.get(it.categoryId);
              const color = c?.color || '#64748B';
              const post = c?.kind === 'post';
              const mine = isMine(it);
              if (post) {
                // POST: cartao compacto com aviaozinho e horario de postagem
                return (
                  <button key={it.id} onClick={() => openItem(it)}
                    className={`w-full text-left rounded-xl border-[1.5px] border-dashed bg-transparent hover:bg-white/[0.04] transition-colors p-3 flex items-center gap-3 ${mine ? 'ring-2 ring-[var(--gvv-lime)]' : ''}`}
                    style={{ borderColor: color }}>
                    <div className="w-11 h-11 rounded-xl flex flex-col items-center justify-center flex-shrink-0" style={{ background: color, color: agInk(color) }}>
                      <Send className="w-4 h-4" />
                      {it.startTime && <span className="text-[10px] font-bold mt-0.5">{it.startTime}</span>}
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="text-[11px] font-bold uppercase tracking-wider" style={{ color: agTextColor(color) }}>{c?.name || 'Post'}</div>
                      <div className="text-zinc-50 font-semibold truncate">{it.title}</div>
                      {it.people.length > 0 && <div className="text-xs text-zinc-400 truncate mt-0.5">{it.people.map(p => agFirst(p.name)).join(', ')}</div>}
                    </div>
                    <AgPeopleDots people={it.people} max={3} size={22} />
                  </button>
                );
              }
              return (
                <button key={it.id} onClick={() => openItem(it)}
                  className={`w-full text-left rounded-xl border border-white/10 hover:border-white/20 bg-white/[0.03] hover:bg-white/[0.06] transition-colors p-3 pl-4 relative overflow-hidden ${mine ? 'ring-2 ring-[var(--gvv-lime)]' : ''}`}>
                  <span className="absolute left-0 top-0 bottom-0 w-1.5" style={{ background: color }} />
                  <div className="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider" style={{ color: agTextColor(color) }}>
                    {c?.name || 'Sem categoria'}
                    {(it.startTime || it.endTime) && <span className="text-zinc-400 font-semibold normal-case tracking-normal flex items-center gap-1"><Clock className="w-3 h-3" />{it.startTime}{it.endTime ? `–${it.endTime}` : ''}</span>}
                    {mine && <span className="ml-auto mm-lime-bg normal-case tracking-normal px-1.5 py-0.5 rounded-md text-[10px]">você</span>}
                  </div>
                  <div className="text-zinc-50 font-semibold mt-1">{it.title}</div>
                  {it.description && <p className="text-sm text-zinc-400 mt-1 line-clamp-2 whitespace-pre-line">{it.description}</p>}
                  {it.people.length > 0 && (
                    <div className="flex flex-wrap gap-1.5 mt-2">
                      {it.people.map(p => (
                        <span key={p.id} className="inline-flex items-center gap-1.5 pl-0.5 pr-2 py-0.5 rounded-full bg-white/5 border border-white/10 text-[11px] font-semibold text-zinc-200">
                          <span className="mm-ava w-4 h-4 rounded-full flex items-center justify-center text-[8px]" style={avaStyle(p.name)}>{agInitials(p.name)}</span>{agFirst(p.name)}
                        </span>
                      ))}
                    </div>
                  )}
                  {(it.links.length > 0 || it.files.length > 0) && (
                    <div className="flex gap-3 mt-2 text-xs text-zinc-400">
                      {it.links.length > 0 && <span className="inline-flex items-center gap-1"><LinkIcon className="w-3 h-3" />{it.links.length} link{it.links.length > 1 ? 's' : ''}</span>}
                      {it.files.length > 0 && <span className="inline-flex items-center gap-1"><Paperclip className="w-3 h-3" />{it.files.length} arquivo{it.files.length > 1 ? 's' : ''}</span>}
                    </div>
                  )}
                </button>
              );
  };

  // Etiqueta do item no calendario (desktop): evento = bloco cheio; post = contorno com aviaozinho
  const Pill = ({ it, dayKey }) => {
    const c = colorOf(it);
    const post = isPostItem(it);
    const mine = isMine(it);
    return (
      <button type="button" onClick={e => { e.stopPropagation(); setSelected(dayKey); openItem(it); }} title={`${it.title}${it.people.length ? ' · ' + it.people.map(p => p.name).join(', ') : ''}`}
        className={`w-full flex items-center gap-1 text-left text-[11px] leading-tight font-semibold rounded-md px-1.5 py-1 hover:brightness-110 ${post ? 'border-[1.5px] border-dashed bg-transparent' : ''} ${mine ? 'ring-2 ring-[var(--gvv-lime)]' : ''}`}
        style={post ? { borderColor: c, color: 'var(--text-primary)' } : { background: c, color: agInk(c) }}>
        {post && <Send className="w-3 h-3 flex-shrink-0" style={{ color: agTextColor(c) }} />}
        <span className="truncate flex-1">{it.startTime && <span className="opacity-75 mr-1">{it.startTime}</span>}{it.title}</span>
        {it.people.length > 0 && <AgPeopleDots people={it.people} max={2} size={15} />}
      </button>
    );
  };

  return (
    <div className="space-y-5">
      {/* Cabecalho */}
      <div className="flex flex-wrap items-center gap-3">
        <div className="flex items-center gap-1">
          <button onClick={() => shiftMonth(-1)} aria-label="Mês anterior" className="mm-tap w-10 h-10 rounded-xl border border-white/12 hover:bg-white/8 flex items-center justify-center text-zinc-200"><ChevronLeft className="w-5 h-5" /></button>
          <button onClick={() => shiftMonth(1)} aria-label="Próximo mês" className="mm-tap w-10 h-10 rounded-xl border border-white/12 hover:bg-white/8 flex items-center justify-center text-zinc-200"><ChevronRight className="w-5 h-5" /></button>
        </div>
        <h2 className="font-serif text-3xl md:text-4xl text-zinc-50 leading-none">
          {MONTH_NAMES[cursor.getMonth()]} <span className="text-[var(--gvv-blue)]">{cursor.getFullYear()}</span>
        </h2>
        <button onClick={goToday} className="mm-tap text-sm px-3 py-2 rounded-xl border border-white/12 hover:bg-white/8 text-zinc-200">Hoje</button>
        <div className="inline-flex rounded-xl border border-white/12 p-0.5 bg-white/[0.03]">
          {[['lista', 'Lista', ClipboardList], ['mes', 'Mês', Calendar]].map(([m, l, Ic]) => (
            <button key={m} onClick={() => setMode(m)} aria-pressed={mode === m}
              className={`mm-tap inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-semibold transition-colors ${mode === m ? 'bg-[var(--brand)] text-white' : 'text-zinc-300 hover:text-zinc-50'}`}>
              <Ic className="w-4 h-4" /> {l}
            </button>
          ))}
        </div>
        {!readOnly && (
          <div className="flex gap-2 ml-auto">
            <Button variant="secondary" onClick={() => setCatsOpen(true)}><Tag className="w-4 h-4" /> <span className="hidden sm:inline">Categorias</span></Button>
            <Button onClick={() => newItem()}><Plus className="w-4 h-4" /> Novo</Button>
          </div>
        )}
      </div>

      {/* Resumo do mes */}
      <div className="grid grid-cols-3 gap-2 sm:gap-3">
        {[
          { n: monthItems.length - monthPosts, l: 'gravações e eventos', ic: Video },
          { n: monthPosts, l: 'posts', ic: Send },
          { n: monthItems.filter(i => i.date >= today).length, l: 'ainda por vir', ic: Clock },
        ].map(s => (
          <div key={s.l} className="mm-card rounded-2xl p-3 sm:p-4 flex items-center gap-3">
            <div className="hidden sm:flex w-10 h-10 rounded-xl bg-white/5 items-center justify-center"><s.ic className="w-5 h-5 text-zinc-300" /></div>
            <div className="min-w-0">
              <div className="font-display text-2xl sm:text-3xl text-zinc-50 leading-none">{s.n}</div>
              <div className="text-[11px] text-zinc-400 mt-1 leading-tight">{s.l}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Legenda = filtro */}
      <div className="mm-hscroll -mx-4 px-4 md:mx-0 md:px-0">
        <div className="flex gap-2 w-max md:w-auto md:flex-wrap">
          {meId && (
            <button onClick={() => setOnlyMine(v => !v)} aria-pressed={onlyMine}
              className={`mm-tap inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border whitespace-nowrap ${onlyMine ? 'mm-lime-bg border-transparent' : 'border-white/15 text-zinc-200'}`}>
              <Users className="w-3.5 h-3.5" /> Só os meus
            </button>
          )}
          {categories.map(c => {
            const off = hidden.has(c.id);
            return (
              <button key={c.id} onClick={() => toggleFilter(c.id)} aria-pressed={!off}
                className={`mm-tap inline-flex items-center gap-2 pl-2.5 pr-3 py-1.5 rounded-full text-xs font-semibold border whitespace-nowrap transition-opacity ${off ? 'opacity-40 border-white/10' : 'border-white/15'} ${c.kind === 'post' ? 'border-dashed' : ''}`}>
                {c.kind === 'post' ? <Send className="w-3 h-3" style={{ color: agTextColor(c.color) }} /> : <span className="w-3 h-3 rounded-full" style={{ background: c.color }} />}
                <span className="text-zinc-200">{c.name}</span>
              </button>
            );
          })}
          {hasNone && (
            <button onClick={() => toggleFilter('none')} className={`mm-tap inline-flex items-center gap-2 pl-2.5 pr-3 py-1.5 rounded-full text-xs font-semibold border border-white/15 whitespace-nowrap ${hidden.has('none') ? 'opacity-40' : ''}`}>
              <span className="w-3 h-3 rounded-full" style={{ background: '#64748B' }} />
              <span className="text-zinc-200">Sem categoria</span>
            </button>
          )}
          {categories.length === 0 && !loading && !readOnly && (
            <button onClick={() => setCatsOpen(true)} className="text-sm text-brand-300 hover:text-brand-200 font-medium">+ Criar a primeira categoria</button>
          )}
        </div>
      </div>

      {mode === 'lista' ? (
        <div className="space-y-3">
          {(() => {
            const days = [...byDay.keys()].filter(k => k.startsWith(monthKey)).sort();
            if (!days.length) {
              return (
                <div className="mm-card rounded-2xl p-8 text-center">
                  <Calendar className="w-8 h-8 text-zinc-500 mx-auto" />
                  <div className="text-zinc-200 font-semibold mt-3">Nada marcado em {MONTH_NAMES[cursor.getMonth()].toLowerCase()}</div>
                  {!readOnly && <Button className="mt-4" onClick={() => newItem()}><Plus className="w-4 h-4" /> Adicionar o primeiro</Button>}
                </div>
              );
            }
            return days.map(k => {
              const d = new Date(k + 'T12:00:00');
              const past = k < today;
              return (
                <div key={k} className={`flex gap-3 sm:gap-4 ${past ? 'opacity-55' : ''}`}>
                  <div className={`w-14 sm:w-16 flex-shrink-0 rounded-2xl text-center py-2 h-fit ${k === today ? 'mm-lime-bg' : 'bg-white/5 border border-white/10'}`}>
                    <div className={`text-[10px] font-bold uppercase ${k === today ? '' : 'text-zinc-400'}`}>{k === today ? 'Hoje' : AG_WEEK[d.getDay()]}</div>
                    <div className={`font-display text-3xl leading-none mt-0.5 ${k === today ? '' : 'text-zinc-50'}`}>{d.getDate()}</div>
                  </div>
                  <div className="flex-1 min-w-0 space-y-2">
                    {byDay.get(k).map(renderItem)}
                  </div>
                </div>
              );
            });
          })()}
        </div>
      ) : (
      <div className="grid lg:grid-cols-[1fr_340px] gap-5 items-start">
        {/* Calendario */}
        <div className="mm-card rounded-2xl overflow-hidden">
          <div className="grid grid-cols-7 border-b border-white/8">
            {AG_WEEK.map(w => <div key={w} className="py-2 text-center text-[11px] font-bold uppercase tracking-wider text-zinc-400">{w}</div>)}
          </div>
          <div>
            {weeks.map((row, wi) => (
              <div key={wi} className="grid grid-cols-7">
                {row.map(day => {
                  const key = YYYYMMDD(day);
                  const inMonth = day.getMonth() === cursor.getMonth();
                  const list = byDay.get(key) || [];
                  const isToday = key === today;
                  const isSel = key === selected;
                  const isPast = key < today;
                  return (
                    <div key={key} role="button" tabIndex={0}
                      onClick={() => pickDay(key)}
                      onDoubleClick={() => newItem(key)}
                      onKeyDown={e => { if (e.key === 'Enter') pickDay(key); }}
                      className={`relative min-h-[68px] sm:min-h-[112px] p-1 sm:p-1.5 border-b border-r border-white/8 cursor-pointer transition-colors text-left ${inMonth ? '' : 'opacity-35'} ${isSel ? 'bg-brand-500/10' : 'hover:bg-white/[0.04]'} ${isPast && inMonth && !isSel ? 'bg-black/10' : ''}`}
                      style={isSel ? { boxShadow: 'inset 0 0 0 2px var(--brand)' } : undefined}>
                      <div className="flex items-center justify-between">
                        <span className={`inline-flex items-center justify-center w-7 h-7 text-[13px] font-semibold rounded-full ${isToday ? 'mm-lime-bg' : isPast ? 'text-zinc-500' : 'text-zinc-200'}`}>{day.getDate()}</span>
                        {list.length > 0 && <span className="sm:hidden text-[10px] text-zinc-400 pr-0.5">{list.length}</span>}
                      </div>
                      {/* celular: bolinha cheia = evento, anel = post */}
                      <div className="sm:hidden flex flex-wrap gap-1 mt-1 px-0.5">
                        {list.slice(0, 6).map(it => (
                          isPostItem(it)
                            ? <span key={it.id} className="w-2 h-2 rounded-full border-[1.5px]" style={{ borderColor: colorOf(it) }} />
                            : <span key={it.id} className="w-2 h-2 rounded-full" style={{ background: colorOf(it) }} />
                        ))}
                      </div>
                      {/* desktop: etiquetas */}
                      <div className="hidden sm:block space-y-1 mt-1">
                        {list.slice(0, 3).map(it => <Pill key={it.id} it={it} dayKey={key} />)}
                        {list.length > 3 && <div className="text-[11px] text-zinc-400 px-1">+{list.length - 3} mais</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        </div>

        {/* Dia selecionado */}
        <div ref={dayPanelRef} className="mm-card rounded-2xl p-4 sm:p-5 lg:sticky lg:top-24 scroll-mt-20">
          <div className="flex items-start justify-between gap-3">
            <div>
              <p className="mm-eyebrow">{selDate ? AG_WEEK[selDate.getDay()] : ''}{selected === today ? ' · hoje' : ''}</p>
              <h3 className="font-serif text-2xl text-zinc-50 mt-0.5">
                {selDate ? `${selDate.getDate()} de ${MONTH_NAMES[selDate.getMonth()]}` : 'Escolha um dia'}
              </h3>
            </div>
            {!readOnly && <Button size="sm" onClick={() => newItem(selected)}><Plus className="w-4 h-4" /> Adicionar</Button>}
          </div>

          <div className="mt-4 space-y-2">
            {loading && <div className="flex items-center gap-2 text-sm text-zinc-400"><Loader2 className="w-4 h-4 animate-spin" /> Carregando…</div>}
            {!loading && selItems.length === 0 && (
              readOnly
                ? <div className="rounded-xl border border-dashed border-white/15 p-5 text-sm text-zinc-400 text-center">Nada marcado nesse dia.</div>
                : <button onClick={() => newItem(selected)} className="w-full rounded-xl border border-dashed border-white/15 p-5 text-sm text-zinc-400 hover:border-brand-400/50 hover:text-zinc-200 transition-colors">
                    Nada marcado nesse dia.<br /><span className="text-brand-300 font-medium">Toque para adicionar</span>
                  </button>
            )}
            {selItems.map(renderItem)}
          </div>
          {!readOnly && <p className="hidden sm:block text-[11px] text-zinc-500 mt-4">Dica: dois cliques num dia do calendário já abre um item novo.</p>}
        </div>
      </div>

      )}

      {editing && (
        <AgendaItemEditor item={editing} categories={categories} people={people} onClose={() => setEditing(null)} onSave={saveItem} onDelete={deleteItem} />
      )}
      {viewing && (
        <AgendaItemView item={viewing} category={catById.get(viewing.categoryId)} onClose={() => setViewing(null)} />
      )}
      {catsOpen && (
        <AgendaCategoriesModal categories={categories} onClose={() => setCatsOpen(false)} onCreate={createCat} onUpdate={updateCat} onDelete={deleteCat} />
      )}
    </div>
  );
};

const AdminDashboard = ({ requests, departments, contents, admin, admins, aiStyles, volunteers = [], events = [], signups = [], feedbacks = [], announcements = [], areaRequests = [], onLogout, onSubmitRequest, onUpdateRequest, onDeleteRequest, onAddDepartment, onUpdateDepartment, onRemoveDepartment, onAddContent, onUpdateContent, onRemoveContent, onAddAdmin, onUpdateAdmin, onRemoveAdmin, onAddStyle, onUpdateStyle, onRemoveStyle, onUpdateVolunteer, onSetVolunteerStatus, onRemoveVolunteer, onInsertEvent, onNotifyEvent, onUpdateEvent, onDeleteEvent, onUpdateSignup, onDeleteSignup, onInsertFeedback, onInsertAnnouncement, onDeleteAnnouncement, onApproveAreaRequest, onRejectAreaRequest, onBroadcast, studyMaterials = [], forumPosts = [], onAddStudyMaterial, onUpdateStudyMaterial, onRemoveStudyMaterial, onPostForum, onDeleteForumPost, onInsertSignup, onBroadcastScale }) => {
  const [view, setView] = useState('overview');
  const [mobileOpen, setMobileOpen] = useState(false);
  const [search, setSearch] = useState('');
  const [filterDept, setFilterDept] = useState('all');
  const [filterStatus, setFilterStatus] = useState('all');
  const [filterService, setFilterService] = useState('all');
  // Estado do painel de filtros no mobile (busca sempre visível, dropdowns num accordion)
  const [filtersOpen, setFiltersOpen] = useState(false);
  const [openRequest, setOpenRequest] = useState(null);

  // Status do WhatsApp (Evolution) — banner de aviso se desconectou
  const [waStatus, setWaStatus] = useState(null); // {connected, needsQr, managerUrl}
  const [waDismissed, setWaDismissed] = useState(false);
  useEffect(() => {
    let live = true;
    const check = async () => {
      try {
        // Edge Function "hyper-api" = status da conexão WhatsApp (evolution-status)
        const r = await fetch(`${FUNCTIONS_BASE}/hyper-api`, {
          headers: {
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'apikey': SUPABASE_ANON_KEY,
          },
        });
        const d = await r.json().catch(() => null);
        if (live && d) setWaStatus(d);
      } catch {}
    };
    check();
    const id = setInterval(check, 60000);
    return () => { live = false; clearInterval(id); };
  }, []);

  const stats = useMemo(() => ({
    total: requests.length,
    pendente: requests.filter(r => r.status === 'pendente').length,
    em_andamento: requests.filter(r => r.status === 'em_andamento').length,
    finalizado: requests.filter(r => r.status === 'finalizado').length,
    aguardando: requests.filter(r => r.status === 'aguardando').length,
    nao_disponivel: requests.filter(r => r.status === 'nao_disponivel').length,
  }), [requests]);

  const filteredRequests = useMemo(() => {
    let r = [...requests];
    if (filterDept !== 'all') r = r.filter(x => x.department === filterDept);
    if (filterStatus !== 'all') r = r.filter(x => x.status === filterStatus);
    if (filterService !== 'all') r = r.filter(x => getServices(x).includes(filterService));
    if (search.trim()) {
      const q = slugify(search);
      r = r.filter(x =>
        slugify(x.title).includes(q) ||
        slugify(x.briefing).includes(q) ||
        slugify(x.responsibleName).includes(q) ||
        slugify(x.department).includes(q) ||
        getServices(x).some(s => slugify(getServiceMeta(s).label).includes(q))
      );
    }
    return r.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }, [requests, search, filterDept, filterStatus, filterService]);

  const recentRequests = useMemo(() =>
    [...requests].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5),
    [requests]
  );

  const [calendarFocus, setCalendarFocus] = useState(null);

  // Duas secoes na barra lateral. `tab: true` = aparece na barra inferior do celular.
  const navItems = [
    { group: 'Departamentos', id: 'overview', label: 'Visão geral', shortLabel: 'Início', icon: BarChart3, tab: true },
    { group: 'Departamentos', id: 'board', label: 'Quadro (Kanban)', shortLabel: 'Quadro', icon: ClipboardList, tab: true },
    { group: 'Departamentos', id: 'all', label: 'Todas solicitações', shortLabel: 'Demandas', icon: Inbox, badge: requests.length },
    { group: 'Departamentos', id: 'new', label: 'Nova demanda', shortLabel: 'Nova', icon: Plus },
    { group: 'Departamentos', id: 'departments', label: 'Departamentos', icon: Building2, badge: departments.length },
    { group: 'Departamentos', id: 'agenda', label: 'Agenda da igreja', icon: Calendar },
    { group: 'Comunicação', id: 'content-agenda', label: 'Agenda de conteúdo', shortLabel: 'Agenda', icon: Palette, tab: true },
    { group: 'Comunicação', id: 'vol-mural', label: 'Mural de recados', shortLabel: 'Mural', icon: Megaphone },
    { group: 'Comunicação', id: 'uploads', label: 'Material recebido', shortLabel: 'Material', icon: Upload },
    { group: 'Comunicação', id: 'contents', label: 'Conteúdos publicados', shortLabel: 'Conteúdos', icon: FileText, badge: contents.length },
    { group: 'Voluntários', id: 'vol-escalas', label: 'Escalas', shortLabel: 'Escalas', icon: Calendar, tab: true },
    { group: 'Voluntários', id: 'vol-membros', label: 'Equipe', shortLabel: 'Equipe', icon: Users, badge: volunteers.filter(v => v.status === 'pendente').length || null },
    { group: 'Voluntários', id: 'vol-solicitacoes', label: 'Pedidos de área', shortLabel: 'Pedidos', icon: Inbox, badge: areaRequests.filter(r => r.status === 'pendente').length || null },
    { group: 'Voluntários', id: 'vol-frequencias', label: 'Frequência', icon: BarChart3 },
    { group: 'Voluntários', id: 'vol-estudo', label: 'Estudo', icon: BookOpen },
    { group: 'Voluntários', id: 'vol-forum', label: 'Fórum', icon: MessageSquare },
    { group: 'Sistema', id: 'config', label: 'Configurações', icon: Settings },
  ];

  const renderView = () => {
    switch (view) {
      case 'overview': {
        const OPEN = ['pendente', 'aguardando', 'em_andamento'];
        const isOpen = (r) => OPEN.includes(r.status);
        // Resumo por departamento
        const knownNames = new Set(departments.map(d => d.name));
        const summarize = (rs) => ({
          total: rs.length,
          open: rs.filter(isOpen).length,
          pendente: rs.filter(r => r.status === 'pendente').length,
          aguardando: rs.filter(r => r.status === 'aguardando').length,
          andamento: rs.filter(r => r.status === 'em_andamento').length,
        });
        const deptRows = departments.map(d => ({ id: d.id, name: d.name, ...summarize(requests.filter(r => r.department === d.name)) }));
        const orphan = requests.filter(r => !knownNames.has(r.department));
        if (orphan.length) deptRows.push({ id: '__outros__', name: 'Outros / Interno', ...summarize(orphan) });
        const deptSorted = deptRows.filter(d => d.total > 0).sort((a, b) => b.open - a.open || b.total - a.total);
        // Fila de ação: pendentes + aguardando, mais antigas primeiro (esperando há mais tempo)
        const actionQueue = requests
          .filter(r => r.status === 'pendente' || r.status === 'aguardando')
          .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        const needAction = stats.pendente + stats.aguardando;
        const goToStatus = (s) => { setFilterDept('all'); setFilterService('all'); setFilterStatus(s); setView('all'); };
        const goToDept = (name) => { setFilterStatus('all'); setFilterService('all'); setFilterDept(name === 'Outros / Interno' ? 'all' : name); setView('all'); };

        return (
          <div className="space-y-7 mm-fade-in">
            {/* Cabeçalho */}
            <div className="flex flex-wrap items-end justify-between gap-3">
              <div>
                <div className="mm-eyebrow text-brand-300 mb-1">Central de Mídia · ADVEC Curitiba</div>
                <h2 className="mm-display text-3xl text-zinc-50">Olá{admin?.name ? `, ${admin.name.split(' ')[0]}` : ''}</h2>
                <p className="text-zinc-400 text-sm mt-1">
                  {needAction > 0
                    ? <>Você tem <b className="text-brand-200">{needAction} demanda{needAction > 1 ? 's' : ''}</b> esperando atendimento.</>
                    : 'Tudo em dia — nenhuma demanda esperando. 🎉'}
                </p>
              </div>
              <Button onClick={() => setView('new')}><Plus className="w-4 h-4" /> Nova demanda</Button>
            </div>

            {/* Faixa de status — filtros rápidos */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5">
              {[
                { label: 'Total',       value: stats.total,          icon: Hash,        accent: 'bg-white/8 border border-white/10 text-zinc-100',            status: 'all' },
                { label: 'Pendentes',   value: stats.pendente,       icon: Clock,       accent: 'bg-amber-400/15 border border-amber-400/40 text-amber-200',   status: 'pendente' },
                { label: 'Aguardando',  value: stats.aguardando,     icon: AlertCircle, accent: 'bg-fuchsia-400/15 border border-fuchsia-400/40 text-fuchsia-200', status: 'aguardando' },
                { label: 'Andamento',   value: stats.em_andamento,   icon: Sparkles,    accent: 'bg-sky-400/15 border border-sky-400/40 text-sky-200',        status: 'em_andamento' },
                { label: 'Finalizadas', value: stats.finalizado,     icon: Check,       accent: 'bg-emerald-400/15 border border-emerald-400/40 text-emerald-200', status: 'finalizado' },
                { label: 'Não disp.',   value: stats.nao_disponivel, icon: X,           accent: 'bg-rose-400/15 border border-rose-400/40 text-rose-200',     status: 'nao_disponivel' },
              ].map(t => {
                const TIcon = t.icon;
                return (
                  <button key={t.label} type="button" onClick={() => goToStatus(t.status)}
                    className="mm-card rounded-xl px-3 py-2.5 text-left flex items-center gap-2.5 cursor-pointer transition hover:border-brand-400/30 hover:bg-white/[0.04] focus:outline-none focus:ring-2 focus:ring-brand-400/40">
                    <span className={`w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${t.accent}`}>
                      <TIcon className="w-4 h-4" />
                    </span>
                    <div className="min-w-0">
                      <div className="font-serif text-xl leading-none text-zinc-50">{t.value}</div>
                      <div className="text-[10px] text-zinc-400 uppercase tracking-wide mt-1 whitespace-nowrap">{t.label}</div>
                    </div>
                  </button>
                );
              })}
            </div>

            {/* POR DEPARTAMENTO — o coração da tela */}
            <div>
              <div className="flex items-center justify-between mb-3">
                <div>
                  <h3 className="font-serif text-xl text-zinc-50">Por departamento</h3>
                  <p className="text-xs text-zinc-500 mt-0.5">Toque num departamento pra ver só as demandas dele.</p>
                </div>
                <button onClick={() => setView('departments')} className="text-xs text-zinc-300 hover:text-brand-200 flex items-center gap-1 font-medium">
                  Gerenciar <ChevronRight className="w-3 h-3" />
                </button>
              </div>
              {deptSorted.length === 0 ? (
                <EmptyState icon={Building2} title="Nenhuma demanda ainda" description="Quando os departamentos enviarem solicitações, elas aparecem organizadas aqui." />
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                  {deptSorted.map(d => (
                    <button key={d.id} onClick={() => goToDept(d.name)}
                      className="mm-card rounded-2xl p-4 text-left transition hover:border-brand-400/30 hover:bg-white/[0.04] focus:outline-none focus:ring-2 focus:ring-brand-400/40">
                      <div className="flex items-center gap-3 mb-3">
                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 border ${d.open > 0 ? 'bg-brand-400/12 border-brand-400/30' : 'bg-white/8 border-white/10'}`}>
                          <Building2 className={`w-5 h-5 ${d.open > 0 ? 'text-brand-200' : 'text-zinc-300'}`} />
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="text-sm font-semibold text-zinc-50 truncate">{d.name}</div>
                          <div className="text-[11px] text-zinc-500">{d.total} no total</div>
                        </div>
                        <div className="text-right flex-shrink-0">
                          <div className={`font-serif text-2xl leading-none ${d.open > 0 ? 'text-brand-200' : 'text-zinc-600'}`}>{d.open}</div>
                          <div className="text-[9px] uppercase tracking-wider text-zinc-500 mt-0.5">abertas</div>
                        </div>
                      </div>
                      <div className="flex items-center gap-3 text-[11px] flex-wrap">
                        {d.pendente > 0 && <span className="inline-flex items-center gap-1 text-amber-200"><span className="w-1.5 h-1.5 rounded-full bg-amber-400" /> {d.pendente} pendente{d.pendente > 1 ? 's' : ''}</span>}
                        {d.aguardando > 0 && <span className="inline-flex items-center gap-1 text-fuchsia-200"><span className="w-1.5 h-1.5 rounded-full bg-fuchsia-400" /> {d.aguardando} aguardando</span>}
                        {d.andamento > 0 && <span className="inline-flex items-center gap-1 text-sky-200"><span className="w-1.5 h-1.5 rounded-full bg-sky-400" /> {d.andamento} em andamento</span>}
                        {d.open === 0 && <span className="inline-flex items-center gap-1 text-emerald-300"><Check className="w-3 h-3" /> tudo em dia</span>}
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>

            {/* FILA DE ATENDIMENTO — o que fazer agora */}
            <div>
              <div className="flex items-center justify-between mb-3">
                <div>
                  <h3 className="font-serif text-xl text-zinc-50">Fila de atendimento</h3>
                  <p className="text-xs text-zinc-500 mt-0.5">{needAction > 0 ? 'Esperando há mais tempo primeiro.' : 'Nada na fila agora.'}</p>
                </div>
                <button onClick={() => setView('all')} className="text-xs text-zinc-300 hover:text-brand-200 flex items-center gap-1 font-medium">
                  Ver todas <ChevronRight className="w-3 h-3" />
                </button>
              </div>
              {actionQueue.length === 0 ? (
                <EmptyState icon={Check} title="Fila vazia" description="Nenhuma demanda pendente ou aguardando retorno. Bom trabalho!" />
              ) : (
                <div className="space-y-3 mm-stagger">
                  {actionQueue.slice(0, 6).map(r => (
                    <RequestCard key={r.id} request={r} onClick={() => setOpenRequest(r)} showDepartment />
                  ))}
                  {actionQueue.length > 6 && (
                    <button onClick={() => goToStatus('pendente')} className="w-full text-center text-xs text-zinc-400 hover:text-brand-200 py-2">
                      + {actionQueue.length - 6} demanda{actionQueue.length - 6 > 1 ? 's' : ''} na fila
                    </button>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      }

      case 'board':
        return (
          <KanbanBoard
            requests={requests}
            onOpenRequest={(r) => setOpenRequest(r)}
            onChangeStatus={async (req, status) => {
              const label = (STATUS_CONFIG[status] || STATUS_CONFIG.pendente).label;
              const actorNm = admin?.name || 'Admin';
              await onUpdateRequest({
                ...req,
                status,
                activity: [
                  ...(req.activity || []),
                  { id: uid(), actor: actorNm, action: `alterou o status para "${label}"`, at: new Date().toISOString() },
                ],
              });
            }}
          />
        );

      case 'all':
        return (
          <div className="mm-fade-in">
            <div className="mb-6">
              <h2 className="font-serif text-3xl text-zinc-50 mb-1">Todas as solicitações</h2>
              <p className="text-zinc-300">{filteredRequests.length} de {requests.length} solicitações</p>
            </div>

            <div className="mb-6 space-y-2">
              {/* Busca + botão Filtros (mobile) — no desktop os 4 ficam inline */}
              <div className="grid md:grid-cols-4 gap-2 md:gap-3">
                <Input
                  icon={Search}
                  placeholder="Buscar..."
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                />
                {/* Botão Filtros só aparece no mobile */}
                <button
                  onClick={() => setFiltersOpen(v => !v)}
                  className="md:hidden mm-input flex items-center justify-between px-3 py-2.5 text-sm rounded-lg"
                >
                  <span className="inline-flex items-center gap-2 text-zinc-200">
                    <Filter className="w-4 h-4" />
                    Filtros{[filterDept, filterStatus, filterService].filter(v => v !== 'all').length > 0 ? ` · ${[filterDept, filterStatus, filterService].filter(v => v !== 'all').length}` : ''}
                  </span>
                  <ChevronDown className={`w-4 h-4 transition-transform ${filtersOpen ? 'rotate-180' : ''}`} />
                </button>

                {/* Os 3 dropdowns: no desktop sempre visíveis, no mobile só se filtersOpen */}
                <div className={`relative ${filtersOpen ? '' : 'hidden md:block'}`}>
                  <Filter className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" />
                  <select
                    value={filterDept}
                    onChange={(e) => setFilterDept(e.target.value)}
                    className="mm-input w-full rounded-lg pl-10 pr-10 py-2.5 text-sm appearance-none cursor-pointer"
                  >
                    <option value="all">Todos departamentos</option>
                    {departments.map(d => (
                      <option key={d.id} value={d.name} className="bg-zinc-900">{d.name}</option>
                    ))}
                  </select>
                  <ChevronDown className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 pointer-events-none" />
                </div>
                <div className={`relative ${filtersOpen ? '' : 'hidden md:block'}`}>
                  <Filter className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" />
                  <select
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="mm-input w-full rounded-lg pl-10 pr-10 py-2.5 text-sm appearance-none cursor-pointer"
                  >
                    <option value="all">Todos status</option>
                    {Object.entries(STATUS_CONFIG).map(([k, cfg]) => (
                      <option key={k} value={k} className="bg-zinc-900">{cfg.label}</option>
                    ))}
                  </select>
                  <ChevronDown className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 pointer-events-none" />
                </div>
                <div className={`relative ${filtersOpen ? '' : 'hidden md:block'}`}>
                  <Sparkles className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400" />
                  <select
                    value={filterService}
                    onChange={(e) => setFilterService(e.target.value)}
                    className="mm-input w-full rounded-lg pl-10 pr-10 py-2.5 text-sm appearance-none cursor-pointer"
                  >
                    <option value="all">Todos os tipos</option>
                    {SERVICE_TYPES.map(s => (
                      <option key={s.value} value={s.value} className="bg-zinc-900">{s.label}</option>
                    ))}
                  </select>
                  <ChevronDown className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 pointer-events-none" />
                </div>
              </div>
            </div>

            {filteredRequests.length === 0 ? (
              <EmptyState icon={Search} title="Nada encontrado" description="Ajuste os filtros para encontrar solicitações." />
            ) : (
              <div className="space-y-3 mm-stagger">
                {filteredRequests.map(r => (
                  <RequestCard key={r.id} request={r} onClick={() => setOpenRequest(r)} showDepartment />
                ))}
              </div>
            )}
          </div>
        );

      case 'new':
        return (
          <div className="mm-fade-in max-w-3xl">
            <div className="mb-6">
              <h2 className="font-serif text-3xl text-zinc-50 mb-1">Nova demanda</h2>
              <p className="text-zinc-300">Abra um chamado para um departamento ou para uso interno da mídia.</p>
            </div>
            <NewRequestForm
              isAdmin
              adminName={admin?.name || 'Admin'}
              departments={departments}
              onSubmit={async (req) => { await onSubmitRequest(req); setView('all'); }}
              onCancel={() => setView('overview')}
            />
          </div>
        );

      case 'uploads':
        return <ReceivedMaterialView events={events} volunteers={volunteers} />;

      case 'content-agenda':
        return (
          <ContentAgendaView
            authorName={admin?.name || ''}
            people={[
              ...admins.map(a => ({ id: a.id, name: a.name, kind: 'admin' })),
              ...volunteers.filter(v => v.status === 'ativo').map(v => ({ id: v.id, name: v.name, kind: 'volunteer' })),
            ]}
          />
        );

      case 'agenda':
        return (
          <ChurchAgendaView />
        );

      case 'calendar':
        return (
          <CalendarView
            requests={requests}
            contents={contents}
            onOpenRequest={(r) => setOpenRequest(r)}
            onOpenContent={(c) => { setCalendarFocus(c.id); setView('contents'); }}
          />
        );

      case 'contents':
        return (
          <ContentsManager
            contents={contents}
            onAdd={onAddContent}
            onUpdate={onUpdateContent}
            onRemove={onRemoveContent}
            openEditingId={calendarFocus}
            onCloseEditor={() => setCalendarFocus(null)}
          />
        );

      case 'ai-styles':
        return <AIStylesManager styles={aiStyles} departments={departments} onAdd={onAddStyle} onUpdate={onUpdateStyle} onRemove={onRemoveStyle} />;

      case 'departments':
        return <DepartmentsManager departments={departments} onAdd={onAddDepartment} onUpdate={onUpdateDepartment} onRemove={onRemoveDepartment} requests={requests} />;

      case 'volunteers':
      case 'vol-membros': case 'vol-solicitacoes': case 'vol-escalas': case 'vol-frequencias':
      case 'vol-mural': case 'vol-estudo': case 'vol-forum':
        return (
          <VolunteersManager
            forcedTab={view.startsWith('vol-') ? view.slice(4) : null}
            key={view}
            volunteers={volunteers}
            events={events}
            signups={signups}
            feedbacks={feedbacks}
            announcements={announcements}
            areaRequests={areaRequests}
            admin={admin}
            adminName={admin?.name || 'Admin'}
            onUpdateVolunteer={onUpdateVolunteer}
            onSetVolunteerStatus={onSetVolunteerStatus}
            onRemoveVolunteer={onRemoveVolunteer}
            onInsertEvent={onInsertEvent}
            onNotifyEvent={onNotifyEvent}
            onUpdateEvent={onUpdateEvent}
            onDeleteEvent={onDeleteEvent}
            onUpdateSignup={onUpdateSignup}
            onDeleteSignup={onDeleteSignup}
            onInsertFeedback={onInsertFeedback}
            onInsertAnnouncement={onInsertAnnouncement}
            onDeleteAnnouncement={onDeleteAnnouncement}
            onApproveAreaRequest={onApproveAreaRequest}
            onRejectAreaRequest={onRejectAreaRequest}
            onBroadcast={onBroadcast}
            studyMaterials={studyMaterials}
            forumPosts={forumPosts}
            onAddStudyMaterial={onAddStudyMaterial}
            onUpdateStudyMaterial={onUpdateStudyMaterial}
            onRemoveStudyMaterial={onRemoveStudyMaterial}
            onPostForum={onPostForum}
            onDeleteForumPost={onDeleteForumPost}
            onInsertSignup={onInsertSignup}
            onBroadcastScale={onBroadcastScale}
          />
        );

      case 'config':
        return (
          <ConfigView
            departments={departments}
            requests={requests}
            admins={admins}
            currentAdmin={admin}
            onAddAdmin={onAddAdmin}
            onUpdateAdmin={onUpdateAdmin}
            onRemoveAdmin={onRemoveAdmin}
          />
        );

      default: return null;
    }
  };

  const activeItem = navItems.find(i => i.id === view);

  return (
    <div className="flex">
      <Sidebar
        items={navItems}
        active={view}
        onChange={setView}
        title={admin?.name || 'Admin'}
        subtitle="Ministério de Mídia"
        onLogout={onLogout}
        mobileOpen={mobileOpen}
        setMobileOpen={setMobileOpen}
      />

      <main className="flex-1 min-w-0">
        <TopBar
          title={activeItem?.label || ''}
          subtitle={admin ? `Logado como ${admin.name}` : 'Administração geral'}
        />
        <div className="px-4 md:px-8 py-5 md:py-8 relative z-10 space-y-4 mm-pad-tabbar">
          {waStatus && waStatus.needsQr && !waDismissed && (
            <div className="rounded-2xl border border-rose-400/40 bg-gradient-to-r from-rose-500/10 to-rose-500/[0.03] p-4 sm:p-5 flex items-start gap-4 shadow-lg">
              <div className="w-11 h-11 rounded-xl bg-rose-500/15 border border-rose-400/40 flex items-center justify-center flex-shrink-0">
                <AlertCircle className="w-5 h-5 text-rose-500" />
              </div>
              <div className="min-w-0 flex-1">
                <div className="text-sm font-bold text-rose-500 uppercase tracking-wider">WhatsApp desconectado</div>
                <p className="text-sm text-zinc-100 mt-1 leading-relaxed">
                  A Evolution API não está mais linkada ao WhatsApp da igreja — <b>nenhuma mensagem está saindo de verdade</b>. Escaneie o QR Code no celular pra reconectar (dura ~1 min).
                </p>
                <div className="flex flex-wrap gap-2 mt-3">
                  {waStatus.managerUrl && (
                    <a href={waStatus.managerUrl} target="_blank" rel="noopener"
                      className="inline-flex items-center gap-2 text-xs font-semibold px-3.5 py-2 rounded-xl bg-rose-500 text-[#fff] hover:brightness-110 transition">
                      <ExternalLink className="w-3.5 h-3.5" /> Abrir gerenciador para escanear QR
                    </a>
                  )}
                  <button onClick={() => setWaDismissed(true)}
                    className="text-xs px-3.5 py-2 rounded-xl border border-white/12 text-zinc-300 hover:bg-white/[0.06]">
                    Fechar aviso
                  </button>
                </div>
                <p className="text-[11px] text-zinc-500 mt-3">
                  Passo a passo no celular da igreja: WhatsApp → menu (⋮) → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b> → aponta a câmera pro QR Code que abrir no botão acima.
                </p>
              </div>
            </div>
          )}
          {renderView()}
        </div>
      </main>

      <RequestDetail
        request={openRequest ? requests.find(r => r.id === openRequest.id) || openRequest : null}
        open={!!openRequest}
        onClose={() => setOpenRequest(null)}
        isAdmin={true}
        actor={{ ...(admin || { name: 'Admin' }), role: 'admin' }}
        onUpdate={async (updated) => {
          await onUpdateRequest(updated);
        }}
        onDelete={async (req) => {
          await onDeleteRequest(req);
          setOpenRequest(null);
        }}
      />
    </div>
  );
};

/* =====================================================================

===================================================================== */

const DepartmentsManager = ({ departments, onAdd, onUpdate, onRemove, requests }) => {
  const toast = useToast();
  const [newName, setNewName] = useState('');
  const [editing, setEditing] = useState(null);
  const [editName, setEditName] = useState('');
  const [editPass, setEditPass] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(null);

  const handleAdd = async (e) => {
    e.preventDefault();
    const n = newName.trim();
    if (!n) return;
    if (departments.some(d => slugify(d.name) === slugify(n))) {
      toast.error('Já existe um departamento com esse nome.');
      return;
    }
    await onAdd(n);
    setNewName('');
    toast.success('Departamento criado');
  };

  const handleEdit = async () => {
    const n = editName.trim();
    if (!n) return;
    if (departments.some(d => slugify(d.name) === slugify(n) && d.id !== editing.id)) {
      toast.error('Já existe um departamento com esse nome.');
      return;
    }
    const pass = editPass.trim();
    if (pass && pass.length < 4) {
      toast.error('A senha precisa ter pelo menos 4 caracteres (ou deixe em branco para usar a padrão).');
      return;
    }
    await onUpdate(editing.id, n, pass || null);
    setEditing(null);
    toast.success('Departamento atualizado');
  };

  const handleDelete = async () => {
    await onRemove(confirmDelete.id);
    setConfirmDelete(null);
    toast.success('Departamento removido');
  };

  return (
    <div className="mm-fade-in">
      <div className="mb-6">
        <h2 className="font-serif text-3xl text-zinc-50 mb-1">Departamentos</h2>
        <p className="text-zinc-300">Gerencie os departamentos que podem acessar o sistema.</p>
      </div>

      <form onSubmit={handleAdd} className="mm-card rounded-xl p-5 mb-6">
        <h3 className="text-sm font-semibold text-zinc-100 mb-3">Adicionar novo departamento</h3>
        <div className="flex gap-2">
          <Input
            icon={Building2}
            placeholder="Nome do departamento"
            value={newName}
            onChange={(e) => setNewName(e.target.value)}
            className="flex-1"
          />
          <Button type="submit">
            <Plus className="w-4 h-4" /> Adicionar
          </Button>
        </div>
      </form>

      <div className="space-y-2 mm-stagger">
        {departments.map(d => {
          const count = requests.filter(r => r.department === d.name).length;
          return (
            <div key={d.id} className="mm-card rounded-xl p-4 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-10 h-10 rounded-lg bg-white/8 border border-white/10 flex items-center justify-center flex-shrink-0">
                  <Building2 className="w-4 h-4 text-zinc-200" />
                </div>
                <div className="min-w-0">
                  <div className="flex items-center gap-1.5">
                    <h4 className="font-semibold text-zinc-50 truncate">{d.name}</h4>
                    {d.password && (
                      <span title="Senha personalizada">
                        <Lock className="w-3 h-3 text-brand-200 flex-shrink-0" />
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-zinc-400">
                    {count} solicitação{count !== 1 ? 'ões' : ''} · criado {formatDate(d.createdAt)}
                    {!d.password && ' · senha padrão'}
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-1.5 flex-shrink-0">
                <button
                  onClick={() => { setEditing(d); setEditName(d.name); setEditPass(d.password || ''); }}
                  className="p-2 text-zinc-300 hover:text-brand-200 hover:bg-white/8 rounded-lg transition-colors"
                  title="Editar"
                >
                  <Edit2 className="w-4 h-4" />
                </button>
                <button
                  onClick={() => setConfirmDelete(d)}
                  className="p-2 text-zinc-300 hover:text-rose-300 hover:bg-rose-500/8 rounded-lg transition-colors"
                  title="Excluir"
                >
                  <Trash2 className="w-4 h-4" />
                </button>
              </div>
            </div>
          );
        })}
      </div>

      <Modal open={!!editing} onClose={() => setEditing(null)} size="sm">
        <div className="p-6">
          <h3 className="font-serif text-xl text-zinc-50 mb-4">Editar departamento</h3>
          <div className="space-y-4">
            <Input
              label="Nome"
              icon={Building2}
              value={editName}
              onChange={(e) => setEditName(e.target.value)}
            />
            <div>
              <Input
                label="Senha de acesso"
                icon={Lock}
                value={editPass}
                onChange={(e) => setEditPass(e.target.value)}
                placeholder="Deixe em branco para usar a padrão"
              />
              <p className="text-[11px] text-zinc-400 mt-1.5 leading-relaxed">
                Em branco = a senha é o próprio nome do departamento. Como admin, você vê e altera a senha de qualquer departamento aqui.
              </p>
            </div>
          </div>
          <div className="flex gap-2 mt-5">
            <Button variant="ghost" onClick={() => setEditing(null)} className="flex-1">Cancelar</Button>
            <Button onClick={handleEdit} className="flex-1">Salvar</Button>
          </div>
        </div>
      </Modal>

      <Modal open={!!confirmDelete} onClose={() => setConfirmDelete(null)} size="sm">
        <div className="p-6">
          <div className="w-12 h-12 rounded-xl bg-rose-500/15 border border-rose-400/30 flex items-center justify-center mb-4">
            <AlertCircle className="w-5 h-5 text-rose-200" />
          </div>
          <h3 className="font-serif text-xl text-zinc-50 mb-2">Remover departamento?</h3>
          <p className="text-sm text-zinc-300 mb-5">
            "{confirmDelete?.name}" será removido. As solicitações existentes serão mantidas.
          </p>
          <div className="flex gap-2">
            <Button variant="ghost" onClick={() => setConfirmDelete(null)} className="flex-1">Cancelar</Button>
            <Button variant="danger" onClick={handleDelete} className="flex-1">Remover</Button>
          </div>
        </div>
      </Modal>
    </div>
  );
};

/* =====================================================================
   ADMINS MANAGER (somente admin geral)
===================================================================== */

const AdminsManager = ({ admins, onAdd, onUpdate, onRemove }) => {
  const ask = useConfirm();
  const toast = useToast();
  const [newAdmin, setNewAdmin] = useState({ name: '', username: '', password: '', email: '', role: 'super_admin', areas: [] });
  const [editingId, setEditingId] = useState(null);
  const [editFields, setEditFields] = useState({ name: '', username: '', password: '', email: '', role: 'super_admin', areas: [] });
  const toggleArea = (target, setTarget, a) => setTarget({ ...target, areas: target.areas.includes(a) ? target.areas.filter(x => x !== a) : [...target.areas, a] });

  const handleAdd = async (e) => {
    e.preventDefault();
    const name = newAdmin.name.trim();
    const username = newAdmin.username.trim();
    const password = newAdmin.password.trim();
    const email = newAdmin.email.trim();
    if (!name || !username || !password) { toast.error('Preencha nome, usuário e senha.'); return; }
    if (password.length < 4) { toast.error('Senha: mínimo de 4 caracteres.'); return; }
    if (email && !/^\S+@\S+\.\S+$/.test(email)) { toast.error('E-mail inválido.'); return; }
    if (admins.some(a => slugify(a.username) === slugify(username))) {
      toast.error('Já existe um administrador com esse usuário.');
      return;
    }
    try {
      await onAdd({ name, username, password, email: email || null, role: newAdmin.role, areas: newAdmin.role === 'coordinator' ? newAdmin.areas : [] });
      setNewAdmin({ name: '', username: '', password: '', email: '', role: 'super_admin', areas: [] });
      toast.success('Administrador criado');
    } catch {}
  };

  const startEdit = (a) => {
    setEditingId(a.id);
    setEditFields({ name: a.name, username: a.username, password: a.password, email: a.email || '', role: a.role || 'super_admin', areas: a.areas || [] });
  };

  const handleSave = async () => {
    const name = editFields.name.trim();
    const username = editFields.username.trim();
    const password = editFields.password.trim();
    const email = editFields.email.trim();
    if (!name || !username || !password) { toast.error('Preencha nome, usuário e senha.'); return; }
    if (password.length < 4) { toast.error('Senha: mínimo de 4 caracteres.'); return; }
    if (email && !/^\S+@\S+\.\S+$/.test(email)) { toast.error('E-mail inválido.'); return; }
    try {
      await onUpdate({ id: editingId, name, username, password, email: email || null, role: editFields.role, areas: editFields.role === 'coordinator' ? editFields.areas : [] });
      setEditingId(null);
      toast.success('Administrador atualizado');
    } catch {}
  };

  const handleRemove = async (a) => {
    if (slugify(a.username) === 'admin') { toast.error('O admin geral não pode ser removido.'); return; }
    if (!await ask({ title: 'Remover administrador?', message: `${a.name} perde o acesso ao painel imediatamente.`, danger: true, confirmLabel: 'Remover' })) return;
    try {
      await onRemove(a.id);
      toast.success('Administrador removido');
    } catch {}
  };

  return (
    <div className="mm-card rounded-xl p-5">
      <h3 className="text-sm font-semibold text-zinc-100 mb-1 flex items-center gap-2">
        <Users className="w-4 h-4 text-brand-200" /> Administradores
      </h3>
      <p className="text-xs text-zinc-400 mb-4">
        Cada admin entra com o próprio usuário (ex: admgabriel) e tem o nome registrado em tudo que fizer.
        Somente o admin geral gerencia esta lista.
      </p>

      <form onSubmit={handleAdd} className="space-y-2 mb-5">
        <div className="grid gap-2 md:grid-cols-4">
          <input className="mm-input rounded-md px-3 py-2 text-sm" placeholder="Nome (ex: Gabriel)" value={newAdmin.name} onChange={(e) => setNewAdmin({ ...newAdmin, name: e.target.value })} />
          <input className="mm-input rounded-md px-3 py-2 text-sm" placeholder="Usuário (ex: admgabriel)" value={newAdmin.username} onChange={(e) => setNewAdmin({ ...newAdmin, username: e.target.value })} />
          <input className="mm-input rounded-md px-3 py-2 text-sm" placeholder="Senha" value={newAdmin.password} onChange={(e) => setNewAdmin({ ...newAdmin, password: e.target.value })} />
          <input className="mm-input rounded-md px-3 py-2 text-sm" placeholder="E-mail" type="email" value={newAdmin.email} onChange={(e) => setNewAdmin({ ...newAdmin, email: e.target.value })} />
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <select className="mm-input rounded-md px-3 py-2 text-sm" value={newAdmin.role} onChange={(e) => setNewAdmin({ ...newAdmin, role: e.target.value })}>
            <option value="super_admin" className="bg-zinc-900">Admin geral (vê tudo)</option>
            <option value="coordinator" className="bg-zinc-900">Coordenador de área</option>
          </select>
          {newAdmin.role === 'coordinator' && (
            <div className="flex flex-wrap gap-1.5">
              {VOLUNTEER_AREAS.map(a => {
                const Ic = a.icon;
                const active = newAdmin.areas.includes(a.value);
                return (
                  <button key={a.value} type="button" onClick={() => toggleArea(newAdmin, setNewAdmin, a.value)}
                    className={`inline-flex items-center gap-1 text-xs px-2 py-1 rounded-md border ${active ? `bg-gradient-to-br ${a.color} ${a.border} ${a.text}` : 'bg-white/[0.03] border-white/10 text-zinc-400'}`}>
                    <Ic className="w-3 h-3" /> {a.label}
                  </button>
                );
              })}
            </div>
          )}
          <div className="flex-1" />
          <Button type="submit" size="sm"><Plus className="w-4 h-4" /> Adicionar</Button>
        </div>
      </form>

      <div className="space-y-2">
        {admins.length === 0 && (
          <p className="text-xs text-zinc-400">
            Nenhum admin na tabela ainda — o acesso embutido "admin" continua funcionando.
            Rode o SQL de setup para habilitar a gestão de administradores.
          </p>
        )}
        {admins.map(a => {
          const isGeneral = slugify(a.username) === 'admin';
          const isEditing = editingId === a.id;
          return (
            <div key={a.id} className="rounded-lg border border-white/8 bg-white/[0.03] p-3">
              {isEditing ? (
                <div className="space-y-2">
                  <div className="grid gap-2 md:grid-cols-4">
                    <input
                      className="mm-input rounded-md px-3 py-2 text-sm"
                      placeholder="Nome"
                      value={editFields.name}
                      onChange={(e) => setEditFields({ ...editFields, name: e.target.value })}
                    />
                    <input
                      className="mm-input rounded-md px-3 py-2 text-sm disabled:opacity-50"
                      placeholder="Usuário"
                      value={editFields.username}
                      disabled={isGeneral}
                      onChange={(e) => setEditFields({ ...editFields, username: e.target.value })}
                    />
                    <input
                      className="mm-input rounded-md px-3 py-2 text-sm"
                      placeholder="Senha"
                      value={editFields.password}
                      onChange={(e) => setEditFields({ ...editFields, password: e.target.value })}
                    />
                    <input
                      className="mm-input rounded-md px-3 py-2 text-sm"
                      placeholder="E-mail (p/ avisos)"
                      type="email"
                      value={editFields.email}
                      onChange={(e) => setEditFields({ ...editFields, email: e.target.value })}
                    />
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <select className="mm-input rounded-md px-3 py-2 text-sm" value={editFields.role} onChange={(e) => setEditFields({ ...editFields, role: e.target.value })} disabled={isGeneral}>
                      <option value="super_admin" className="bg-zinc-900">Admin geral</option>
                      <option value="coordinator" className="bg-zinc-900">Coordenador</option>
                    </select>
                    {editFields.role === 'coordinator' && !isGeneral && (
                      <div className="flex flex-wrap gap-1.5">
                        {VOLUNTEER_AREAS.map(a => {
                          const Ic = a.icon;
                          const active = editFields.areas.includes(a.value);
                          return (
                            <button key={a.value} type="button" onClick={() => toggleArea(editFields, setEditFields, a.value)}
                              className={`inline-flex items-center gap-1 text-xs px-2 py-1 rounded-md border ${active ? `bg-gradient-to-br ${a.color} ${a.border} ${a.text}` : 'bg-white/[0.03] border-white/10 text-zinc-400'}`}>
                              <Ic className="w-3 h-3" /> {a.label}
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                  <div className="flex justify-end gap-2">
                    <Button variant="ghost" size="sm" onClick={() => setEditingId(null)}>Cancelar</Button>
                    <Button size="sm" onClick={handleSave}>
                      <Check className="w-3.5 h-3.5" /> Salvar
                    </Button>
                  </div>
                </div>
              ) : (
                <div className="flex items-center justify-between gap-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-9 h-9 rounded-lg bg-brand-500/15 border border-brand-400/30 flex items-center justify-center flex-shrink-0">
                      <User className="w-4 h-4 text-brand-200" />
                    </div>
                    <div className="min-w-0">
                      <p className="text-sm font-semibold text-zinc-50 truncate">
                        {a.name}
                        {isGeneral && (
                          <span className="ml-2 text-[10px] font-semibold uppercase tracking-wider text-brand-200 bg-brand-400/15 border border-brand-400/30 rounded-full px-2 py-0.5">
                            geral
                          </span>
                        )}
                        {a.role === 'coordinator' && (
                          <span className="ml-2 text-[10px] font-semibold uppercase tracking-wider text-fuchsia-200 bg-fuchsia-400/15 border border-fuchsia-400/30 rounded-full px-2 py-0.5">
                            coord
                          </span>
                        )}
                      </p>
                      <p className="text-xs text-zinc-400 truncate">
                        usuário: {a.username}{a.email ? ` · ${a.email}` : ' · sem e-mail'}
                      </p>
                      {a.role === 'coordinator' && a.areas.length > 0 && (
                        <div className="flex flex-wrap gap-1 mt-1">
                          {a.areas.map(k => { const m = AREA_META[k]; return m && <span key={k} className={`text-[9px] px-1.5 py-0.5 rounded border ${m.border} ${m.text}`}>{m.label}</span>; })}
                        </div>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-1.5 flex-shrink-0">
                    <button
                      onClick={() => startEdit(a)}
                      className="p-2 text-zinc-300 hover:text-brand-200 hover:bg-white/8 rounded-lg transition-colors"
                      title="Editar"
                    >
                      <Edit2 className="w-4 h-4" />
                    </button>
                    {!isGeneral && (
                      <button
                        onClick={() => handleRemove(a)}
                        className="p-2 text-zinc-300 hover:text-rose-300 hover:bg-rose-500/8 rounded-lg transition-colors"
                        title="Remover"
                      >
                        <Trash2 className="w-4 h-4" />
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

/* =====================================================================
   VOLUNTEER SIGNUP MODAL — voluntário se candidata a um slot
===================================================================== */
const VolunteerSignupModal = ({ event, area, existing, onClose, onConfirm, onCancel }) => {
  const ask = useConfirm();
  const meta = AREA_META[area];
  const [idea, setIdea] = useState(existing?.volunteerIdea || '');
  const [saving, setSaving] = useState(false);
  const toast = useToast();
  const Ic = meta?.icon || Sparkles;
  const dateFmt = new Date(event.date + 'T00:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  const dateShort = new Date(event.date + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });

  const submit = async () => {

const VOL_MISSING_HINT = 'Essa função precisa de uma atualização no banco: peça pro admin rodar SUPABASE_FASE10_VOLUNTARIOS_AGENDA.sql.';
const isMissingTable = (err) => /PGRST205|42P01|schema cache|does not exist/i.test(`${err?.message || ''} ${err?.code || ''}`);

// Carrega uma tabela pequena e escuta mudancas (trocas / material)
const useLiveTable = (table, { order = 'created_at', ascending = false } = {}) => {
  const [rows, setRows] = useState([]);
  const [missing, setMissing] = useState(false);
  const load = useCallback(async () => {
    const { data, error } = await supabase.from(table).select('*').order(order, { ascending });
    if (error) { if (isMissingTable(error)) setMissing(true); return; }
    setMissing(false);
    setRows(data || []);
  }, [table, order, ascending]);
  useEffect(() => {
    load();
    let t = null;
    const soon = () => { clearTimeout(t); t = setTimeout(load, 200); };
    const ch = supabase.channel(`mm-${table}-${Date.now()}`)
      .on('postgres_changes', { event: '*', schema: 'public', table }, soon)
      .subscribe();
    return () => { clearTimeout(t); supabase.removeChannel(ch); };
  }, [load, table]);
  return { rows, missing, reload: load };
};

// Links "salvar no calendario"
const calDay = (d) => d.replace(/-/g, '');
const nextDayStr = (d) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + 1); return YYYYMMDD(x); };
const googleCalUrl = (title, date, details) =>
  `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${calDay(date)}/${calDay(nextDayStr(date))}&details=${encodeURIComponent(details || '')}`;
const downloadIcs = (title, date, details) => {
  const esc = (s) => String(s || '').replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ministerio de Midia//PT', 'BEGIN:VEVENT',
    `UID:${uid()}@midia`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART;VALUE=DATE:${calDay(date)}`, `DTEND;VALUE=DATE:${calDay(nextDayStr(date))}`,
    `SUMMARY:${esc(title)}`, `DESCRIPTION:${esc(details)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT12H', 'ACTION:DISPLAY', 'DESCRIPTION:Escala amanhã', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'escala.ics'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

    { done: !!hasWa, title: 'Ativar avisos no WhatsApp', desc: 'Receba escala e lembrete no celular', action: onWa, icon: MessageSquare },
    { done: !!hasAvailability, title: 'Marcar quando pode servir', desc: 'Ajuda o admin a montar a escala', action: () => onGo('agenda'), icon: Clock },
    { done: !!hasSignup, title: 'Se candidatar à primeira escala', desc: 'Ou ao primeiro treinamento', action: () => onGo('escalas'), icon: Calendar },
  ];
  const doneCount = steps.filter(s => s.done).length;
  if (hidden || doneCount === steps.length) return null;
  const pct = Math.round((doneCount / steps.length) * 100);
  return (
    <div className="mm-card rounded-3xl p-5 md:p-6 mm-fade-in">
      <div className="flex items-start justify-between gap-3">
        <div>
          <div className="mm-eyebrow">Primeiros passos</div>
          <h3 className="font-serif text-2xl text-zinc-50 mt-1">Faltam {steps.length - doneCount} pra ficar pronto</h3>
        </div>
        <div className="relative w-14 h-14 flex-shrink-0">
          <svg viewBox="0 0 36 36" className="w-14 h-14 -rotate-90">
            <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--veil-3)" strokeWidth="4" />
            <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--gvv-lime)" strokeWidth="4" strokeLinecap="round" strokeDasharray={`${pct * 0.974} 100`} />
          </svg>
          <span className="absolute inset-0 flex items-center justify-center text-xs font-bold text-zinc-100">{doneCount}/{steps.length}</span>
        </div>
      </div>
      <div className="grid sm:grid-cols-2 gap-2 mt-4">
        {steps.map(s => {
          const Ic = s.icon;
          return (
            <button key={s.title} onClick={s.done ? undefined : s.action} disabled={s.done}
              className={`mm-tap flex items-center gap-3 rounded-2xl border p-3 text-left transition-colors ${s.done ? 'border-white/5 opacity-60' : 'border-white/12 hover:border-brand-400/50 hover:bg-white/[0.04]'}`}>
              <span className={`w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 ${s.done ? 'mm-lime-bg' : 'bg-brand-500/15 text-brand-200'}`}>
                {s.done ? <Check className="w-5 h-5" /> : <Ic className="w-5 h-5" />}
              </span>
              <span className="min-w-0">
                <span className={`block text-sm font-semibold ${s.done ? 'line-through text-zinc-400' : 'text-zinc-50'}`}>{s.title}</span>
                <span className="block text-xs text-zinc-400 truncate">{s.desc}</span>
              </span>
              {!s.done && <ChevronRight className="w-4 h-4 text-zinc-500 ml-auto flex-shrink-0" />}
            </button>
          );
        })}
      </div>
      <button onClick={() => { setHidden(true); try { localStorage.setItem(KEY, '1'); } catch {} }} className="text-xs text-zinc-500 hover:text-zinc-300 mt-3">Esconder por enquanto</button>
    </div>
  );
};

const VolOpenSwaps = ({ swaps, volunteer, events, signups, volunteers, onTake }) => {
  const today = YYYYMMDD(new Date());
  const open = swaps.filter(s => {
    if (s.status !== 'aberta' || s.from_volunteer_id === volunteer.id) return false;
    const ev = events.find(e => e.id === s.event_id);
    if (!ev || ev.date < today) return false;
    if (!volunteer.areas.includes(s.area)) return false;
    if (s.role && !(volunteer.qualifiedRoles || []).includes(s.role)) return false;
    // ja estou nessa escala nessa area?
    return !signups.some(x => x.eventId === s.event_id && x.volunteerId === volunteer.id && x.area === s.area);
  });
  if (!open.length) return null;
  return (
    <div className="rounded-3xl border-2 border-amber-400/50 bg-amber-400/[0.07] p-5 md:p-6 mm-fade-in">

        {open.map(s => {
