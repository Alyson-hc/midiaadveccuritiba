            <div className="flex items-center justify-between mb-5">
              <h3 className="font-serif text-2xl text-zinc-50">{editing.id ? 'Editar estilo' : 'Novo estilo'}</h3>
              <button onClick={() => setEditing(null)} className="p-2 text-zinc-300 hover:text-zinc-50"><X className="w-5 h-5" /></button>
            </div>

            <div className="space-y-4">
              <Input label="Nome do estilo" value={editing.nome}
                onChange={(e) => setEditing({ ...editing, nome: e.target.value })}
                placeholder="Ex: Convidado — Mulheres" />

              <div className="grid grid-cols-2 gap-3">
                <Select label="Tipo"
                  options={[{ value: 'arte', label: 'Arte (foto + nome)' }, { value: 'carrossel', label: 'Carrossel (slides)' }]}
                  value={editing.tipo}
                  onChange={(v) => setEditing({ ...editing, tipo: v })} />
                <Select label="Departamento (opcional)"
                  options={[{ value: '', label: 'Todos os departamentos' }, ...departments.map(d => ({ value: d.name, label: d.name }))]}
                  value={editing.departamento}
                  onChange={(v) => setEditing({ ...editing, departamento: v })} />
              </div>

              <Textarea label="Prompt-base (descreva o estilo)"
                value={editing.promptBase}
                onChange={(e) => setEditing({ ...editing, promptBase: e.target.value })}
                placeholder="Ex: Arte para evento de mulheres, fundo floral suave, tons dourados e rosé, tipografia elegante, foto do convidado em destaque à direita..."
                rows={4} />

              <div>
                <label className="block text-xs font-medium text-zinc-300 uppercase tracking-wider mb-2">
                  Modelos de referência ({(editing.refs || []).length})
                </label>
                <label className="flex flex-col items-center justify-center w-full py-5 border-2 border-dashed border-white/15 hover:border-brand-400/40 rounded-lg cursor-pointer bg-white/[0.02]">
                  <Upload className="w-5 h-5 text-zinc-300 mb-1" />
                  <span className="text-sm text-zinc-100">{uploadingRef ? 'Enviando...' : 'Subir modelos prontos (imagens)'}</span>
                  <input ref={refInput} type="file" accept="image/*" multiple className="hidden"
                    onChange={(e) => addRefs(e.target.files)} />
                </label>
                {(editing.refs || []).length > 0 && (
                  <div className="grid grid-cols-4 gap-2 mt-3">
                    {editing.refs.map((r, i) => (
                      <div key={i} className="relative group">
                        {/* eslint-disable-next-line */}
                        <img src={r.url} alt="" className="w-full aspect-square rounded object-cover border border-white/10" />
                        <button onClick={() => removeRef(i)}
                          className="absolute top-1 right-1 w-5 h-5 rounded-full bg-rose-500/80 text-[#fff] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                          <X className="w-3 h-3" />
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="flex gap-2 mt-6 pt-5 border-t border-white/8">
              <div className="flex-1" />
              <Button variant="ghost" onClick={() => setEditing(null)}>Cancelar</Button>
              <Button onClick={save}><Check className="w-4 h-4" /> {editing.id ? 'Salvar' : 'Criar'}</Button>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
};

/* =====================================================================
   KANBAN BOARD

   Arrasto proprio, em pointer events, porque o HTML5 drag-and-drop
   simplesmente nao existe no celular. Como funciona:
     - mouse: vira arrasto depois de 5px de movimento
     - toque: vira arrasto depois de segurar ~180ms (antes disso o dedo rola
       a lista normalmente), com vibracao curta confirmando que "pegou".
       Depois de pegar, um touchmove nao-passivo segura o scroll do navegador —
       sem isso o navegador assume o gesto, dispara pointercancel e o card cai.
     - o card que segue o dedo e um clone posicionado por transform, mexido
       fora do React — nenhum re-render por frame
     - coluna alvo e auto-scroll sao calculados num unico requestAnimationFrame,
       entao a coluna tambem troca quando o quadro rola sozinho sob o dedo parado
     - a vaga tracejada aparece exatamente onde o card vai ficar (a coluna e
       ordenada por data), e o card "voa" ate ela ao soltar
     - no celular, as abas de coluna no topo tambem aceitam o card solto
     - o movimento aplica na hora e so depois confirma no servidor
===================================================================== */

// Colunas do quadro, na ordem do fluxo de trabalho
const BOARD_COLUMNS = ['pendente', 'aguardando', 'em_andamento', 'finalizado', 'nao_disponivel'];
// Colunas "encerradas": mais recentes primeiro e paginadas, senao viram um muro
const DONE_COLUMNS = new Set(['finalizado', 'nao_disponivel']);
const DONE_PAGE = 12;

const DRAG_HOLD_MS = 180;   // toque: tempo segurando antes de pegar o card
const DRAG_SLOP = 5;        // mouse: px de folga antes de virar arrasto
const TOUCH_SLOP = 10;      // toque: se andar mais que isso antes do tempo, e rolagem
const EDGE = 64;            // faixa da borda que dispara o auto-scroll
const EDGE_MAX = 18;        // px por frame no auto-scroll
const DROP_MS = 170;        // animacao do card indo pro lugar

// Data do evento: mais proxima primeiro; nas encerradas, mais recente primeiro.
// Datas vem como "AAAA-MM-DD", entao comparar string ja ordena certo.
const boardCompare = (col) => (a, b) => {
  const da = a.eventDate || '', db = b.eventDate || '';
  if (da === db) return 0;
  if (!da) return 1;
  if (!db) return -1;
  const d = da < db ? -1 : 1;
  return DONE_COLUMNS.has(col) ? -d : d;
};

const reducedMotion = () =>
  typeof window.matchMedia === 'function' && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const KanbanCard = React.memo(({ request, onOpen, onPointerDown, onMenu, onMove, dragging, ghost }) => {
  const primary = getPrimaryService(request);
  const primaryColors = COLOR_CLASSES[primary.color];
  const PrimaryIcon = primary.icon;
  const services = getServices(request);

  const previewImg = useMemo(() => {
    const imgs = [
      ...(request.referenceFiles || []).filter(f => f.type?.startsWith('image/')),
      ...(request.deliveries || []).filter(d => d.type === 'file' && d.file?.type?.startsWith('image/')).map(d => d.file),
    ];
    return imgs.length ? imgs[imgs.length - 1] : null;
  }, [request.referenceFiles, request.deliveries]);

  // Urgência pela data do evento
  const daysToEvent = request.eventDate
    ? Math.round((parseDay(request.eventDate) - new Date().setHours(0,0,0,0)) / 86400000)
    : null;
  const open = !DONE_COLUMNS.has(request.status);
  const late = daysToEvent !== null && daysToEvent < 0 && open;
  const urgent = daysToEvent !== null && daysToEvent >= 0 && daysToEvent <= 3 && open;
  const soon = daysToEvent !== null && daysToEvent > 3 && daysToEvent <= 7 && open;

  const curIdx = BOARD_COLUMNS.indexOf(request.status);
  const accent = STATUS_CONFIG[request.status]?.solid || '#2B77E4';

  const onKeyDown = (e) => {
    if (ghost || e.target !== e.currentTarget) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpen(request); return; }
    // setas movem o card de coluna sem precisar de mouse nenhum
    const dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    const next = BOARD_COLUMNS[curIdx + dir];
    if (next) onMove(request, next);
  };

  const dateTone = late || urgent ? 'text-rose-300 font-semibold' : soon ? 'text-amber-300' : 'text-zinc-400';

  return (
    <div
      data-card={request.id}
      tabIndex={ghost ? -1 : 0}
      role={ghost ? undefined : 'button'}
      aria-label={ghost ? undefined : `${request.title || primary.label} — ${STATUS_CONFIG[request.status]?.label || ''}. Setas movem de coluna.`}
      onPointerDown={ghost ? undefined : (e) => onPointerDown(e, request)}
      onClick={ghost ? undefined : () => onOpen(request)}
      onKeyDown={ghost ? undefined : onKeyDown}
      onContextMenu={ghost ? undefined : (e) => e.preventDefault()}
      style={{ '--accent': late || urgent ? '#fb7185' : soon ? '#fbbf24' : accent }}
      className={`group mm-kanban-card mm-card-accent rounded-xl overflow-hidden ${dragging ? 'is-dragging' : ''}`}
    >
      {previewImg && (
        <img src={previewImg.thumbnail || previewImg.url} alt="" className="w-full h-28 object-cover" loading="lazy" decoding="async" draggable={false} />
      )}
      <div className="p-3 pl-3.5">
        <div className="flex items-start gap-2.5">
          <div className={`w-8 h-8 rounded-lg ${primaryColors.bg} border ${primaryColors.border} flex items-center justify-center flex-shrink-0`}>
            <PrimaryIcon className={`w-3.5 h-3.5 ${primaryColors.icon}`} />
          </div>
          <div className="min-w-0 flex-1">
            <h4 className="text-[13.5px] font-semibold text-zinc-50 leading-snug line-clamp-2 break-words">
              {request.title || primary.label}
            </h4>
            <p className="text-[11px] text-zinc-400 truncate mt-0.5">{request.department}</p>
          </div>
          {!ghost && (
            <button
              type="button"
              onPointerDown={(e) => e.stopPropagation()}
              onClick={(e) => { e.stopPropagation(); onMenu(request); }}
              aria-label="Mover para outra coluna"
              title="Mover para…"
              className="mm-card-menu -mr-1.5 -mt-1 w-8 h-8 flex items-center justify-center rounded-lg text-zinc-400 hover:text-zinc-50 hover:bg-white/10 flex-shrink-0"
            >
              <MoreHorizontal className="w-4 h-4" />
            </button>
          )}
        </div>

        {services.length > 0 && (
          <div className="flex flex-wrap items-center gap-1.5 mt-2.5">
            {services.slice(0, 2).map(sv => (
              <ServiceChip key={sv} service={getServiceMeta(sv)} size="sm" />
            ))}
            {services.length > 2 && (
              <span className="text-[10px] text-zinc-400 font-semibold">+{services.length - 2}</span>
            )}
          </div>
        )}

        <div className="flex items-center justify-between gap-2 mt-2.5 pt-2.5 border-t border-white/5">
          <span className={`flex items-center gap-1 text-[11px] min-w-0 ${dateTone}`}>
            <Calendar className="w-3 h-3 flex-shrink-0" />
            <span className="truncate">
              {request.eventDate ? formatDate(request.eventDate) : 'Sem data'}
              {late && ' · atrasado'}
              {urgent && daysToEvent === 0 && ' · hoje'}
              {urgent && daysToEvent > 0 && ` · ${daysToEvent}d`}
            </span>
          </span>
          <div className="flex items-center gap-2 flex-shrink-0">
            {request.comments?.length > 0 && (
              <span className="flex items-center gap-0.5 text-[11px] text-zinc-400" title="Mensagens">
                <MessageSquare className="w-3 h-3" />{request.comments.length}
              </span>
            )}
            {request.deliveries?.length > 0 && (
              <span className="flex items-center gap-0.5 text-[11px] text-emerald-300" title="Entregas">
                <Paperclip className="w-3 h-3" />{request.deliveries.length}
              </span>
            )}
          </div>
        </div>
      </div>
    </div>
  );
});

const KanbanBoard = ({ requests, onOpenRequest, onChangeStatus }) => {
  const toast = useToast();
  const [filterDept, setFilterDept] = useState('all');
  const [query, setQuery] = useState('');
  const [overCol, setOverCol] = useState(null);
  const [dragReq, setDragReq] = useState(null);      // card em arrasto (1 render ao pegar/soltar)
  const [menuReq, setMenuReq] = useState(null);      // card com o menu "mover para" aberto
  const [expanded, setExpanded] = useState({});      // colunas encerradas mostrando tudo
  const [activeCol, setActiveCol] = useState(BOARD_COLUMNS[0]); // coluna visivel no celular
  // Movimentos ainda não confirmados pelo servidor — o card muda de coluna na hora
  const [pending, setPending] = useState({});

  const scrollRef = useRef(null);
  const ghostRef = useRef(null);
  const dragRef = useRef(null);
  const overColRef = useRef(null);
  const rafRef = useRef(0);
  const clickGuardRef = useRef(0);

  const depts = useMemo(() => [...new Set(requests.map(r => r.department).filter(Boolean))].sort(), [requests]);

  const visible = useMemo(() => {
    const q = query.trim().toLowerCase();
    return requests.filter(r =>
      (filterDept === 'all' || r.department === filterDept) &&
      (!q || [r.title, r.department, r.responsibleName].some(v => v && String(v).toLowerCase().includes(q)))
    );
  }, [requests, filterDept, query]);

  const byColumn = useMemo(() => {
    const map = {};
    BOARD_COLUMNS.forEach(c => { map[c] = []; });
    visible.forEach(r => {
      const status = pending[r.id] || r.status;
      const col = BOARD_COLUMNS.includes(status) ? status : 'pendente';
      // o card carrega o status "efetivo" — assim menu, setas e arrasto partem da coluna certa
      map[col].push(status === r.status ? r : { ...r, status });
    });
    BOARD_COLUMNS.forEach(c => map[c].sort(boardCompare(c)));
    return map;
  }, [visible, pending]);

  const urgentCount = useMemo(() => {
    const today = new Date().setHours(0, 0, 0, 0);
    return visible.filter(r => {
      const st = pending[r.id] || r.status;
      if (DONE_COLUMNS.has(st) || !r.eventDate) return false;
      return Math.round((parseDay(r.eventDate) - today) / 86400000) <= 3;
    }).length;
  }, [visible, pending]);

  // Quando o servidor confirma (ou devolve outra coisa), o otimismo sai de cena
  useEffect(() => {
    setPending(prev => {
      const keys = Object.keys(prev);
      if (!keys.length) return prev;
      const next = {}; let changed = false;
      keys.forEach(id => {
        const r = requests.find(x => x.id === id);
        if (r && r.status !== prev[id]) next[id] = prev[id];
        else changed = true;
      });
      return changed ? next : prev;
    });
  }, [requests]);

  // onChangeStatus chega como arrow nova a cada render do dashboard. Guardando
  // numa ref, applyMove/onCardPointerDown ficam estaveis e o React.memo dos
  // cards realmente evita re-render — que e o que deixa o arrasto leve.
  const changeStatusRef = useRef(onChangeStatus);
  useEffect(() => { changeStatusRef.current = onChangeStatus; }, [onChangeStatus]);

  const applyMove = useCallback((req, col) => {
    if (!req || req.status === col) return;
    setPending(p => ({ ...p, [req.id]: col }));
    // rede de segurança: se a confirmação nunca chegar, volta pro estado real
    setTimeout(() => setPending(p => {
      if (p[req.id] !== col) return p;
      const n = { ...p }; delete n[req.id]; return n;
    }), 10000);
    Promise.resolve(changeStatusRef.current(req, col)).catch(() => {
      setPending(p => { const n = { ...p }; delete n[req.id]; return n; });
    });
  }, []);

  /* ---------------- navegação entre colunas (celular) ---------------- */

  const scrollToCol = useCallback((col, smooth = true) => {
    const board = scrollRef.current;
    const el = board?.querySelector(`[data-col="${col}"]`);
    if (!board || !el) return;
    board.scrollTo({ left: el.offsetLeft - board.offsetLeft - 16, behavior: smooth && !reducedMotion() ? 'smooth' : 'auto' });
  }, []);

  const onBoardScroll = useCallback(() => {
    const board = scrollRef.current;
    if (!board) return;
    const mid = board.scrollLeft + board.clientWidth / 2;
    let best = BOARD_COLUMNS[0], bestD = Infinity;
    board.querySelectorAll(':scope > [data-col]').forEach(el => {
      const d = Math.abs(el.offsetLeft - board.offsetLeft + el.offsetWidth / 2 - mid);
      if (d < bestD) { bestD = d; best = el.getAttribute('data-col'); }
    });
    setActiveCol(prev => prev === best ? prev : best);
  }, []);

  /* ---------------- motor de arrasto ---------------- */

  const stopLoop = () => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    rafRef.current = 0;
  };

  const placeGhost = (el, info) => {
    if (el && info) el.style.transform = `translate3d(${info.x - info.offX}px, ${info.y - info.offY}px, 0)`;
  };

  // Um frame: descobre a coluna sob o ponteiro e empurra o scroll perto das bordas
  const tick = useCallback(() => {
    const cur = dragRef.current;
    if (!cur || !cur.active || cur.dropping) { rafRef.current = 0; return; }

    // coluna sob o ponteiro (o fantasma tem pointer-events: none)
    const under = document.elementFromPoint(cur.x, cur.y);
    const colEl = under?.closest?.('[data-col]');
    const col = colEl?.getAttribute('data-col') || null;
    if (col && col !== overColRef.current) {
      overColRef.current = col;
      setOverCol(col);
      // solto em cima da aba: o quadro vai até a coluna pra mostrar onde cai
      if (colEl.hasAttribute('data-col-tab')) scrollToCol(col);
    }

    // auto-scroll horizontal (régua de colunas)
    const board = scrollRef.current;
    const box = board?.getBoundingClientRect();
    let vx = 0;
    if (box && !colEl?.hasAttribute('data-col-tab')) {
      if (cur.x < box.left + EDGE) vx = -Math.min(EDGE_MAX, (box.left + EDGE - cur.x) / 3);
      else if (cur.x > box.right - EDGE) vx = Math.min(EDGE_MAX, (cur.x - (box.right - EDGE)) / 3);
    }
    if (vx) board.scrollLeft += vx;

    // auto-scroll vertical: dentro da coluna no desktop, a página no celular
    const list = colEl?.querySelector?.('[data-col-scroll]');
    const inner = list && list.scrollHeight > list.clientHeight + 1 ? list : null;
    const top = inner ? inner.getBoundingClientRect().top : 110;
    const bottom = inner ? inner.getBoundingClientRect().bottom : window.innerHeight - 80;
    let vy = 0;
    if (cur.y < top + 40) vy = -Math.min(EDGE_MAX, (top + 40 - cur.y) / 3);
    else if (cur.y > bottom - 40) vy = Math.min(EDGE_MAX, (cur.y - (bottom - 40)) / 3);
    if (vy) { if (inner) inner.scrollTop += vy; else window.scrollBy(0, vy); }

    rafRef.current = requestAnimationFrame(tick);
  }, [scrollToCol]);

  // O fantasma se posiciona no instante em que entra no DOM. Sem isso ele
  // pisca no canto superior esquerdo ate chegar o primeiro pointermove.
  const attachGhost = useCallback((el) => {
    ghostRef.current = el;
    placeGhost(el, dragRef.current);
  }, []);

  const finishDrag = useCallback((info, target) => {
    dragRef.current = null;
    overColRef.current = null;
    document.body.classList.remove('mm-dragging');
    if (target) applyMove(info.req, target);
    setDragReq(null);
    setOverCol(null);
  }, [applyMove]);

  const endDrag = useCallback((commit) => {
    const info = dragRef.current;
    if (!info || info.dropping) return;
    clearTimeout(info.holdTimer);
    info.cleanup?.();
    if (!info.active) { dragRef.current = null; return; }

    stopLoop();
    info.dropping = true;
    clickGuardRef.current = Date.now();     // segura o clique que vem logo após o soltar
    const target = commit && overColRef.current && overColRef.current !== info.req.status ? overColRef.current : null;

    // anima o fantasma até a vaga (ou de volta pra origem) e só então troca o card
    const dest = target
      ? document.querySelector('[data-drop-slot]')
      : document.querySelector(`[data-col-scroll] [data-card="${CSS.escape(String(info.req.id))}"]`);
    const r = dest?.getBoundingClientRect();
    const g = ghostRef.current;
    const onScreen = r && r.width && r.bottom > 0 && r.top < window.innerHeight && r.right > 0 && r.left < window.innerWidth;
    if (!g || !onScreen || reducedMotion()) { finishDrag(info, target); return; }
    g.classList.add('is-dropping');
    g.style.transition = `transform ${DROP_MS}ms cubic-bezier(.2,.8,.2,1)`;
    g.style.transform = `translate3d(${r.left}px, ${r.top}px, 0)`;
    setTimeout(() => finishDrag(info, target), DROP_MS);
  }, [finishDrag]);

  const onCardPointerDown = useCallback((e, req) => {
    // O pointerType do evento SINTETICO do React nem sempre chega — lemos do
    // nativo e, se ainda faltar, decidimos pelo tipo de ponteiro do aparelho.
    const nat = e.nativeEvent || e;
    const ptype = nat.pointerType || e.pointerType || '';
    const coarse = typeof window.matchMedia === 'function' && window.matchMedia('(pointer: coarse)').matches;
    const isTouch = ptype ? ptype !== 'mouse' : coarse;

    if (!isTouch && (nat.button ?? e.button ?? 0) !== 0) return;
    if (dragRef.current?.dropping) return;
    // Sobrou arrasto de antes (o ponteiro sumiu sem soltar)? Encerra e segue —
    // dar return aqui deixaria o quadro travado pra sempre.
    if (dragRef.current) endDrag(false);

    const cardEl = e.currentTarget;
    const rect = cardEl.getBoundingClientRect();
    // guarda as coordenadas: o evento do React nao sobrevive ao setTimeout
    const px = e.clientX, py = e.clientY;
    const info = {
      req, active: false, dropping: false,
      startX: px, startY: py,
      offX: px - rect.left, offY: py - rect.top,
      x: px, y: py,
      w: rect.width, h: rect.height, isTouch, holdTimer: 0,
    };
    dragRef.current = info;

    const activate = () => {
      if (dragRef.current !== info || info.active) return;
      cardEl.classList.remove('is-pressing');
      info.active = true;
      document.body.classList.add('mm-dragging');
      try { navigator.vibrate?.(10); } catch {}
      overColRef.current = req.status;
      setOverCol(req.status);
      setDragReq(req);
      rafRef.current = requestAnimationFrame(tick);
    };

    const onMove = (ev) => {
      if (dragRef.current !== info) return;
      if (!info.active) {
        const dist = Math.hypot(ev.clientX - info.startX, ev.clientY - info.startY);
        // no toque, andar antes da hora significa "quero rolar", não "quero arrastar"
        if (info.isTouch) { if (dist > TOUCH_SLOP) endDrag(false); return; }
        if (dist < DRAG_SLOP) return;
        info.x = ev.clientX; info.y = ev.clientY;
        activate();
      }
      if (ev.cancelable) ev.preventDefault();
      info.x = ev.clientX; info.y = ev.clientY;
      if (!info.dropping) placeGhost(ghostRef.current, info);
    };

    const onUp = () => endDrag(true);
    const onCancel = () => endDrag(false);
    const onKey = (ev) => { if (ev.key === 'Escape') endDrag(false); };
    // Com o card pego, o dedo não rola mais nada. Tem que ser nao-passivo e
    // estar registrado ANTES do primeiro touchmove do gesto.
    const onTouchMove = (ev) => { if (info.active && ev.cancelable) ev.preventDefault(); };
    const onCtx = (ev) => ev.preventDefault();

    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
    window.addEventListener('keydown', onKey);
    window.addEventListener('touchmove', onTouchMove, { passive: false });
    window.addEventListener('contextmenu', onCtx);
    info.cleanup = () => {
      cardEl.classList.remove('is-pressing');
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onCancel);
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('contextmenu', onCtx);
    };

    if (isTouch) {
      cardEl.classList.add('is-pressing');
      info.holdTimer = setTimeout(activate, DRAG_HOLD_MS);
    }
  }, [endDrag, tick]);

  // se o componente sair da tela no meio de um arrasto, não deixa lixo pra trás
  useEffect(() => () => {
    const info = dragRef.current;
    if (info) { clearTimeout(info.holdTimer); info.cleanup?.(); }
    stopLoop();
    document.body.classList.remove('mm-dragging');
  }, []);

  const openRef = useRef(onOpenRequest);
  useEffect(() => { openRef.current = onOpenRequest; }, [onOpenRequest]);

  const openRequest = useCallback((r) => {
    // ignora o clique que o navegador dispara logo depois de soltar o card
    if (Date.now() - clickGuardRef.current < 300) return;
    openRef.current(r);
  }, []);

  const openMenu = useCallback((r) => setMenuReq(r), []);

  const moveFromMenu = (col) => {
    const r = menuReq;
    setMenuReq(null);
    if (!r || r.status === col) return;
    applyMove(r, col);
    toast.success(`Movido para “${STATUS_CONFIG[col].label}”`);
  };

  const filtering = filterDept !== 'all' || query.trim();

  return (
    <div className="mm-fade-in">
      {/* Cabeçalho + filtros */}
      <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-3 mb-3 md:mb-4">
        <div className="min-w-0">
          <h2 className="font-serif text-2xl text-zinc-50">Quadro de produção</h2>
          <p className="text-zinc-400 text-xs mt-0.5">
            {visible.length} {visible.length === 1 ? 'demanda' : 'demandas'}
            {urgentCount > 0 && <span className="text-rose-300 font-semibold"> · {urgentCount} com prazo em até 3 dias</span>}
            <span className="hidden md:inline"> · arraste os cards entre as colunas</span>
            <span className="md:hidden"> · segure um card pra arrastar</span>
          </p>
        </div>
        <div className="flex gap-2 w-full lg:w-auto">
          <div className="relative flex-1 lg:w-60">
            <Search className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 pointer-events-none" />
            <input
              type="search"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Buscar…"
              aria-label="Buscar demanda"
              className="mm-input mm-tap w-full rounded-xl pl-10 pr-3 py-2.5 text-sm"
            />
          </div>
          <div className="relative flex-1 lg:flex-none min-w-0">
            <Building2 className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 pointer-events-none" />
            <select
              value={filterDept}
              onChange={(e) => setFilterDept(e.target.value)}
              aria-label="Filtrar por departamento"
              className="mm-input mm-tap w-full lg:w-56 rounded-xl pl-10 pr-9 py-2.5 text-sm appearance-none cursor-pointer truncate"
            >
              <option value="all">Todos departamentos</option>
              {depts.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
            <ChevronDown className="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-400 pointer-events-none" />
          </div>
        </div>
      </div>

      {/* Abas de coluna — só no celular. Também são alvo de soltar. */}
      <div className="mm-board-tabs md:hidden -mx-4 px-4 py-2 mb-2 border-b border-white/8">
        <div className="mm-hscroll flex gap-1.5" role="tablist" aria-label="Colunas do quadro">
          {BOARD_COLUMNS.map(col => {
            const cfg = STATUS_CONFIG[col];
            const isOverTab = !!dragReq && overCol === col;
            return (
              <button
                key={col}
                type="button"
                role="tab"
                aria-selected={activeCol === col}
                data-col={col}
                data-col-tab=""
                onClick={() => scrollToCol(col)}
                className={`mm-board-tab text-zinc-200 ${activeCol === col ? 'is-active' : ''} ${isOverTab ? 'is-over' : ''}`}
              >
                <span className={`w-2 h-2 rounded-full ${cfg.dot}`} />
                {cfg.label}
                <span className="text-zinc-400 font-bold">{byColumn[col].length}</span>
              </button>
            );
          })}
        </div>
      </div>

      <div
        ref={scrollRef}
        onScroll={onBoardScroll}
        className="mm-kanban-scroll flex items-start gap-3 overflow-x-auto pb-4 -mx-4 px-4 md:mx-0 md:px-0"
      >
        {BOARD_COLUMNS.map(col => {
          const cfg = STATUS_CONFIG[col];
          const list = byColumn[col];
          const isOver = !!dragReq && overCol === col;
          const showSlot = isOver && dragReq.status !== col;
          const limited = DONE_COLUMNS.has(col) && !expanded[col] && list.length > DONE_PAGE;
          const shown = limited ? list.slice(0, DONE_PAGE) : list;
          // posição exata onde o card vai cair (mesma ordenação da coluna)
          let slotAt = -1;
          if (showSlot) {
            const cmp = boardCompare(col);
            slotAt = shown.findIndex(r => cmp(dragReq, r) < 0);
            if (slotAt === -1) slotAt = shown.length;
          }
          const slot = showSlot && (
            <div
              key="__slot"
              data-drop-slot=""
              className="mm-drop-slot rounded-xl"
              style={{ height: Math.min(dragRef.current?.h || 96, 180) }}
            />
          );
          return (
            <section
              key={col}
              data-col={col}
              aria-label={`${cfg.label}: ${list.length}`}
              className={`mm-kanban-col rounded-2xl ${isOver ? 'is-over' : ''}`}
            >
              <header className="mm-col-head sticky top-0 z-10 flex items-center justify-between gap-2 px-3.5 py-3 rounded-t-2xl">
                <div className="flex items-center gap-2 min-w-0">
                  <span className={`w-2.5 h-2.5 rounded-full ${cfg.dot} flex-shrink-0`} />
                  <h3 className="text-[13px] font-semibold text-zinc-100 truncate tracking-tight">{cfg.label}</h3>
                </div>
                <span className="text-[11px] font-bold text-zinc-300 bg-white/10 rounded-full min-w-[22px] text-center px-1.5 py-0.5 flex-shrink-0">
                  {list.length}
                </span>
              </header>
              <div data-col-scroll className="mm-col-list px-2 pb-2 pt-0.5 space-y-2 min-h-[88px]">
                {shown.length === 0 && !showSlot && (
                  <div className="py-6 rounded-xl text-center text-[11px] text-zinc-500 border border-dashed border-white/10">
                    {filtering ? 'Nada com esse filtro' : 'Nenhuma demanda'}
                  </div>
                )}
                {shown.map((r, i) => (
                  <React.Fragment key={r.id}>
                    {i === slotAt && slot}
                    <KanbanCard
                      request={r}
                      dragging={dragReq?.id === r.id}
                      onOpen={openRequest}
                      onPointerDown={onCardPointerDown}
                      onMenu={openMenu}
                      onMove={applyMove}
                    />
                  </React.Fragment>
                ))}
                {slotAt === shown.length && slot}
                {limited && (
                  <button
                    type="button"
                    onClick={() => setExpanded(x => ({ ...x, [col]: true }))}
                    className="mm-tap w-full py-2 rounded-xl text-xs font-semibold text-zinc-300 hover:text-zinc-50 hover:bg-white/5"
                  >
                    Mostrar mais {list.length - DONE_PAGE}
                  </button>
                )}
              </div>
            </section>
          );
        })}
      </div>

      {/* O card que segue o dedo/cursor. Posicionado por transform, fora do React. */}
      {dragReq && createPortal(
        <div ref={attachGhost} data-ghost="" className="mm-kanban-ghost" style={{ width: dragRef.current?.w || 260 }}>
          <div className="mm-kanban-ghost-inner">
            <KanbanCard request={dragReq} ghost />
          </div>
        </div>,
        document.body
      )}

      {/* Mover sem arrastar: bottom sheet no celular, janelinha no desktop */}
      <Modal open={!!menuReq} onClose={() => setMenuReq(null)} size="sm">
        {menuReq && (
          <div className="p-5">
            <p className="text-[11px] uppercase tracking-wider text-zinc-400 font-semibold">Mover para</p>
            <h3 className="font-serif text-lg text-zinc-50 leading-tight mt-0.5 mb-4 line-clamp-2">
              {menuReq.title || getPrimaryService(menuReq).label}
            </h3>
            <div className="space-y-1.5">
              {BOARD_COLUMNS.map(col => {
                const cfg = STATUS_CONFIG[col];
                const current = menuReq.status === col;
                return (
                  <button
                    key={col}
                    type="button"
                    onClick={() => moveFromMenu(col)}
                    disabled={current}
                    className={`mm-tap w-full flex items-center gap-3 px-3.5 py-3 rounded-xl border text-left text-sm transition-colors ${
                      current
                        ? 'border-brand-400/40 bg-brand-500/10 text-zinc-50 cursor-default'
                        : 'border-white/8 bg-white/[0.02] text-zinc-200 hover:bg-white/[0.06] hover:text-zinc-50'
                    }`}
                  >
                    <span className={`w-2.5 h-2.5 rounded-full ${cfg.dot}`} />
                    <span className="flex-1 font-medium">{cfg.label}</span>
                    {current
                      ? <span className="text-[11px] text-zinc-400">atual</span>
                      : <span className="text-[11px] text-zinc-500">{byColumn[col].length}</span>}
                  </button>
                );
              })}
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
};

   monta o iframe/link. Guardado em localStorage.
===================================================================== */
// Calendários padrão da igreja — sempre aparecem pra qualquer perfil, sem precisar cadastrar.
// Edite AQUI (no código) pra adicionar/remover fixos. Cada admin/líder ainda pode adicionar EXTRAS.
const DEFAULT_CHURCH_CALENDARS = [
  'advec.curitiba.agenda@gmail.com',
  'cv147b2k57g8cm1rtahgpt236s@group.calendar.google.com',
  '73u7podotpm911nnfbptdmposc@group.calendar.google.com',
  'hrd4ijjihro6sn8e5t1va3uve8@group.calendar.google.com',
  'odgkq5m391t4t5cfquiadh6b98@group.calendar.google.com',
  'qu67vvclpdc5osr6st3g1sj2o4@group.calendar.google.com',
];

const ChurchAgendaView = ({ readOnly = false } = {}) => {
  // Chave antiga (1 calendário só) mantida pra migração transparente
  const KEY_OLD = 'mm-church-google-cal-id';
  const KEY = 'mm-church-google-cal-ids';
  // Extrai o e-mail do calendário mesmo se o usuário colar a URL inteira do iCal.
  const parseCalId = (raw) => {
    const s = String(raw || '').trim();
    if (!s) return '';
    const m = s.match(/\/(?:ical|embed)\/([^/?]+)/i);
    if (m) return decodeURIComponent(m[1]);
    return s;
  };
  const parseMany = (raw) => String(raw || '')
    .split(/[\n,;]+/).map(parseCalId).filter(Boolean)
    .filter((v, i, a) => a.indexOf(v) === i); // remove duplicados

  // Ler EXTRAS (o que o usuário adicionou além dos padrões). Migra formato antigo.
  const initialExtras = (() => {
    try {
      const arr = JSON.parse(localStorage.getItem(KEY) || '[]');
      if (Array.isArray(arr)) return arr.filter(x => !DEFAULT_CHURCH_CALENDARS.includes(x));
    } catch {}
    const legacy = localStorage.getItem(KEY_OLD);
    return legacy && !DEFAULT_CHURCH_CALENDARS.includes(legacy) ? [legacy] : [];
  })();
  const [extras, setExtras] = useState(initialExtras);
  const [draft, setDraft] = useState(initialExtras.join('\n'));
  // Detecta mobile pra usar mode=AGENDA (lista) em vez de MONTH (grade impossível em tela pequena)
  const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' && window.matchMedia('(max-width: 640px)').matches);
  useEffect(() => {
    const mq = window.matchMedia('(max-width: 640px)');
    const on = (e) => setIsMobile(e.matches);
    mq.addEventListener?.('change', on);
    return () => mq.removeEventListener?.('change', on);
  }, []);
  // Config: no mobile começa fechada (a agenda que interessa); no desktop, aberta
  const [configOpen, setConfigOpen] = useState(!isMobile);
  // Modo de visualização do calendário (persistido). Se o usuário nunca escolheu, o padrão
  // depende do dispositivo (MONTH no desktop, AGENDA no mobile).
  const MODE_KEY = 'mm-church-agenda-mode';
  const [userMode, setUserMode] = useState(() => localStorage.getItem(MODE_KEY) || '');
  const mode = userMode || (isMobile ? 'AGENDA' : 'MONTH');
  const setMode = (m) => { setUserMode(m); try { localStorage.setItem(MODE_KEY, m); } catch {} };
  const MODES = [
    { id: 'MONTH',  label: 'Mês',     icon: Calendar },
    { id: 'WEEK',   label: 'Semana',  icon: Calendar },
    { id: 'AGENDA', label: 'Agenda',  icon: ClipboardList },
  ];
  const allIds = [...DEFAULT_CHURCH_CALENDARS, ...extras.filter(x => !DEFAULT_CHURCH_CALENDARS.includes(x))];
  const save = () => {
    const v = parseMany(draft).filter(x => !DEFAULT_CHURCH_CALENDARS.includes(x));
    localStorage.setItem(KEY, JSON.stringify(v));
    setExtras(v);
    setDraft(v.join('\n'));
  };
  const removeOne = (id) => {
    if (DEFAULT_CHURCH_CALENDARS.includes(id)) return; // padrões não removem
    const v = extras.filter(x => x !== id);
    localStorage.setItem(KEY, JSON.stringify(v));
    setExtras(v);
    setDraft(v.join('\n'));
  };
  const reset = () => {
    localStorage.removeItem(KEY); localStorage.removeItem(KEY_OLD);
    setExtras([]); setDraft('');
  };

  const tz = encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/Sao_Paulo');
  // O usuário escolhe a view; no mobile desligamos abas/lista de calendários pra economizar espaço.
  const src = allIds.length > 0
    ? `https://calendar.google.com/calendar/embed?${allIds.map(id => `src=${encodeURIComponent(id)}`).join('&')}&ctz=${tz}&mode=${mode}&bgcolor=%23111111&showTitle=0&showPrint=0&showCalendars=${isMobile ? 0 : 1}&showTabs=${isMobile ? 0 : 1}`
    : null;
  const openExternal = `https://calendar.google.com/calendar/u/0/r?cid=${encodeURIComponent(allIds[0] || '')}`;
  const dirty = draft.trim() !== extras.join('\n');

  return (
    <div className="mm-fade-in">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
        <div>
          <h2 className="font-serif text-3xl text-zinc-50 mb-1">Agenda da igreja</h2>
          <p className="text-zinc-300">Eventos e datas direto do Google Agenda da igreja.</p>
        </div>
        <a href={openExternal} target="_blank" rel="noopener noreferrer"
          className="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-white/15 text-sm font-medium text-zinc-100 hover:bg-white/5">
          Abrir no Google Agenda <ExternalLink className="w-4 h-4" />
        </a>
      </div>

      {/* Seletor de visualização — persiste a escolha do usuário */}
      <div className="mb-3 flex items-center gap-1.5 p-1 rounded-xl border border-white/10 bg-white/[0.02] w-fit">
        {MODES.map(m => {
          const Ic = m.icon;
          const active = mode === m.id;
          return (
            <button key={m.id} onClick={() => setMode(m.id)}
              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${active ? 'bg-brand-500/15 border border-brand-400/30 text-brand-100' : 'text-zinc-300 hover:text-zinc-100 hover:bg-white/5'}`}>
              <Ic className="w-3.5 h-3.5" /> {m.label}
            </button>
          );
        })}
      </div>

      {!readOnly && (
        <div className="mm-card rounded-2xl mb-4 bg-sky-500/[0.04] border-sky-400/15 overflow-hidden">
          <button
            onClick={() => setConfigOpen(v => !v)}
            className="w-full flex items-center justify-between gap-3 p-3 sm:p-4 text-left hover:bg-white/[0.02] transition-colors"
          >
            <div className="flex items-center gap-2 min-w-0">
              <Settings className="w-4 h-4 text-sky-200 flex-shrink-0" />
              <span className="text-xs font-medium text-sky-100/90 uppercase tracking-wider truncate">Configurar calendários</span>
            </div>
            <div className="flex items-center gap-2 flex-shrink-0">
              <span className="text-[10px] text-zinc-400 whitespace-nowrap">{DEFAULT_CHURCH_CALENDARS.length} padrão{extras.length > 0 ? ` + ${extras.length}` : ''}</span>
              <ChevronDown className={`w-4 h-4 text-zinc-400 transition-transform ${configOpen ? 'rotate-180' : ''}`} />
            </div>
          </button>
          {configOpen && (
            <div className="px-3 pb-3 sm:px-4 sm:pb-4 border-t border-white/5">
              <label className="block text-[11px] font-medium text-zinc-400 mt-3 mb-1.5">Meus calendários extras (opcional, um por linha)</label>
              <textarea value={draft} onChange={(e) => setDraft(e.target.value)}
                rows={Math.min(6, Math.max(2, extras.length + 1))}
                placeholder="cole aqui outros calendários que só você quer ver"
                className="mm-input w-full rounded-lg px-3 py-2.5 text-sm font-mono leading-relaxed" />
              <div className="flex items-center gap-2 mt-2 flex-wrap">
                <button onClick={save} disabled={!dirty}
                  className="px-4 py-2 rounded-lg mm-brand-grad on-accent text-sm font-medium disabled:opacity-40">Salvar extras</button>
                {extras.length > 0 && <button onClick={reset} className="px-4 py-2 rounded-lg border border-white/15 text-sm text-zinc-200 hover:bg-white/5">Limpar extras</button>}
              </div>
              <div className="mt-3 pt-3 border-t border-white/10 flex flex-wrap gap-1.5">
                {DEFAULT_CHURCH_CALENDARS.map(id => (
                  <span key={id} title="Calendário padrão da igreja — sempre visível" className="inline-flex items-center gap-1 text-[11px] px-2 py-1 rounded-md bg-brand-500/10 border border-brand-400/30 text-brand-100 max-w-full">
                    <Lock className="w-3 h-3 opacity-70 flex-shrink-0" />
                    <span className="truncate">{id.length > 30 ? id.slice(0, 18) + '…' + id.slice(-12) : id}</span>
                  </span>
                ))}
                {extras.map(id => (
                  <span key={id} className="inline-flex items-center gap-1 text-[11px] px-2 py-1 rounded-md bg-white/[0.04] border border-white/10 text-zinc-200 max-w-full">
                    <span className="truncate">{id.length > 30 ? id.slice(0, 18) + '…' + id.slice(-12) : id}</span>
                    <button onClick={() => removeOne(id)} title="Remover" className="text-zinc-500 hover:text-rose-400 flex-shrink-0"><X className="w-3 h-3" /></button>
                  </span>
                ))}
              </div>
              <p className="text-[11px] text-zinc-400 mt-3 leading-relaxed">
                Os <b className="text-brand-100">{DEFAULT_CHURCH_CALENDARS.length} calendários padrão da igreja</b> aparecem pra todo mundo.
                Extras aqui são <b>só pra você</b>. Cada calendário precisa estar com <b>"Disponibilizar publicamente"</b> no Google.
              </p>
            </div>
          )}
        </div>
      )}

      {src ? (
        <div className="mm-card rounded-2xl overflow-hidden" style={{ height: isMobile ? 'calc(100vh - 220px)' : '78vh', minHeight: isMobile ? 500 : 600 }}>
          <iframe key={mode} src={src} style={{ border: 0 }} width="100%" height="100%" frameBorder="0" scrolling="no" title="Agenda da igreja" />
        </div>
      ) : (
        <EmptyState icon={Calendar} title="Conecte o Google Agenda"
          description="Cole o ID dos calendários acima (um por linha) para juntar todos numa única visão." />
      )}
    </div>
  );
};

/* =====================================================================
   AGENDA DE CONTEÚDO — calendario com categorias coloridas
   Tabelas: agenda_categories, agenda_items (SUPABASE_AGENDA_CONTEUDO.sql
   + SUPABASE_FASE10_VOLUNTARIOS_AGENDA.sql: kind "post" e responsaveis)
   Componente independente: carrega e escuta o banco sozinho.
===================================================================== */

const AG_PALETTE = ['#2B77E4', '#C1ED28', '#EF4444', '#A855F7', '#F59E0B', '#06B6D4', '#EC4899', '#10B981', '#F97316', '#64748B'];
const AG_WEEK = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const AG_KINDS = [
  { value: 'evento', label: 'Gravação / evento', hint: 'Início e fim', icon: Video },
  { value: 'post', label: 'Post', hint: 'Um horário só', icon: Send },
];

// Texto preto ou branco conforme o fundo (legivel em qualquer cor escolhida)
const agInk = (hex) => {
  const h = String(hex || '').replace('#', '');
  if (h.length !== 6) return '#fff';
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
    .map(c => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.4 ? '#0a0a0a' : '#ffffff';
};
// Cor legivel como TEXTO sobre o fundo do tema (o limao some no claro)
const agTextColor = (hex) => (String(hex).toUpperCase() === '#C1ED28' ? 'var(--lime-ink)' : hex);
const agTime = (t) => (t ? String(t).slice(0, 5) : '');
const agUrl = (u) => {
  const s = String(u || '').trim();
  if (!s) return '';
  return /^https?:\/\//i.test(s) ? s : `https://${s}`;
};
const agInitials = (name) => String(name || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const agFirst = (name) => String(name || '').trim().split(/\s+/)[0];
const agCatDb = (c) => ({ id: c.id, name: c.name, color: c.color || '#2B77E4', position: c.position || 0, kind: c.kind === 'post' ? 'post' : 'evento' });
const agItemDb = (r) => ({
  id: r.id,
  categoryId: r.category_id || null,
  title: r.title || '',
  date: r.item_date || '',
  startTime: agTime(r.start_time),
  endTime: agTime(r.end_time),
  description: r.description || '',
  links: Array.isArray(r.links) ? r.links : [],
  files: Array.isArray(r.files) ? r.files : [],
  people: Array.isArray(r.people) ? r.people : [],
  createdBy: r.created_by || '',
});
const agItemToDb = (it, isPost) => ({
  category_id: it.categoryId || null,
  title: it.title.trim(),
  item_date: it.date,
  start_time: it.startTime || null,
  end_time: isPost ? null : (it.endTime || null),
  description: it.description?.trim() || null,
  links: (it.links || []).filter(l => l.url?.trim()).map(l => ({ label: l.label?.trim() || '', url: agUrl(l.url) })),
  files: it.files || [],
  people: (it.people || []).map(p => ({ id: p.id, name: p.name, kind: p.kind })),
});
// Coluna nova ainda nao criada no banco -> explica o que rodar
const agDbHint = (err) => {
  const m = `${err?.message || ''} ${err?.code || ''}`;
  if (/people|kind|PGRST204|column/i.test(m)) return 'Falta atualizar o banco: rode SUPABASE_FASE10_VOLUNTARIOS_AGENDA.sql no SQL Editor do Supabase.';
  return err?.message || 'Erro ao salvar.';
};

// Seletor de responsaveis: busca + chips (coordenadores e voluntarios)
const AgPeoplePicker = ({ options = [], value = [], onChange }) => {
  const [q, setQ] = useState('');
  const sel = new Set(value.map(p => p.id));
  const norm = (s) => slugify(s);
  const list = options.filter(o => !q || norm(o.name).includes(norm(q)));
  const groups = [
    { kind: 'admin', label: 'Coordenadores' },
    { kind: 'volunteer', label: 'Voluntários' },
  ];
  const toggle = (o) => onChange(sel.has(o.id) ? value.filter(p => p.id !== o.id) : [...value, o]);
  return (
    <div>
      {value.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mb-2">
          {value.map(p => (
            <button key={p.id} type="button" onClick={() => toggle(p)}
              className="inline-flex items-center gap-1.5 pl-1 pr-2 py-1 rounded-full bg-brand-500/15 border border-brand-400/40 text-xs font-semibold text-zinc-100">
              <span className="mm-ava w-5 h-5 rounded-full flex items-center justify-center text-[9px]" style={avaStyle(p.name)}>{agInitials(p.name)}</span>
              {p.name}
              <X className="w-3 h-3 text-zinc-400" />
            </button>
          ))}
        </div>
      )}
      <div className="relative">
        <Search className="w-4 h-4 text-zinc-500 absolute left-3 top-1/2 -translate-y-1/2" />
        <input className="mm-input rounded-xl pl-9 pr-3 py-2.5 text-sm w-full" placeholder="Buscar pessoa…" value={q} onChange={e => setQ(e.target.value)} />
      </div>
      <div className="mt-2 max-h-44 overflow-y-auto rounded-xl border border-white/8 divide-y divide-white/5">
        {groups.map(g => {
          const items = list.filter(o => o.kind === g.kind);
          if (!items.length) return null;
          return (
            <div key={g.kind}>
              <div className="px-3 pt-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-zinc-500">{g.label}</div>
              {items.map(o => {
                const on = sel.has(o.id);
                return (
                  <button key={o.id} type="button" onClick={() => toggle(o)}
                    className={`w-full flex items-center gap-2.5 px-3 py-2 text-sm text-left transition-colors ${on ? 'bg-brand-500/10' : 'hover:bg-white/[0.04]'}`}>
                    <span className="mm-ava w-7 h-7 rounded-full flex items-center justify-center text-[11px] flex-shrink-0" style={avaStyle(o.name)}>{agInitials(o.name)}</span>
                    <span className="flex-1 truncate text-zinc-100">{o.name}</span>
                    <span className={`w-5 h-5 rounded-md border flex items-center justify-center ${on ? 'bg-[var(--brand)] border-[var(--brand)]' : 'border-white/20'}`}>
                      {on && <Check className="w-3.5 h-3.5 text-white" />}
                    </span>
                  </button>
                );
              })}
            </div>
          );
        })}
        {!list.length && <div className="px-3 py-4 text-sm text-zinc-500 text-center">Ninguém encontrado.</div>}
      </div>
    </div>
  );
};

const AgendaItemEditor = ({ item, categories, people = [], onClose, onSave, onDelete }) => {
  const toast = useToast();
  const [f, setF] = useState(() => ({ ...item, links: item.links?.length ? item.links : [], people: item.people || [] }));
  const [saving, setSaving] = useState(false);
  const [uploads, setUploads] = useState([]); // [{ key, name, p }]
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const isNew = !item.id;
  const cat = categories.find(c => c.id === f.categoryId);
  const isPost = cat?.kind === 'post';

  const addFiles = async (fileList) => {
    for (const file of Array.from(fileList || [])) {
      if (file.size > MAX_FILE_SIZE) { toast.error(`${file.name}: maior que 50 MB.`); continue; }
      const key = `${file.name}-${Date.now()}-${Math.random()}`;
      setUploads(u => [...u, { key, name: file.name, p: 0 }]);
      try {
        const meta = await FileStore.save(file, (p) => setUploads(u => u.map(x => x.key === key ? { ...x, p } : x)));
        setF(prev => ({ ...prev, files: [...(prev.files || []), meta] }));
      } catch (e) {
        toast.error(`Não deu pra enviar ${file.name}.`);
      } finally {
        setUploads(u => u.filter(x => x.key !== key));
      }
    }
  };

  const submit = async (e) => {
    e?.preventDefault();
    if (!f.title.trim()) { toast.error('Dê um título.'); return; }
    if (!f.date) { toast.error('Escolha o dia.'); return; }
    if (uploads.length) { toast.info('Espere os arquivos terminarem de enviar.'); return; }
    setSaving(true);
    try { await onSave(f, isPost); onClose(); }
    catch (err) { toast.error(agDbHint(err)); }
    finally { setSaving(false); }
  };

  return (
    <Modal open onClose={onClose} size="md">
      <form onSubmit={submit} className="p-5 sm:p-6 space-y-5">
        <div className="flex items-start justify-between gap-3">
          <div>
            <p className="mm-eyebrow">{isNew ? 'Novo na agenda' : 'Editar item'}</p>
            <h2 className="font-serif text-2xl text-zinc-50 mt-1">{isNew ? 'Adicionar conteúdo' : (f.title || 'Sem título')}</h2>
          </div>
          <button type="button" onClick={onClose} aria-label="Fechar" className="hidden sm:flex mm-tap p-2 rounded-xl text-zinc-400 hover:text-zinc-100 hover:bg-white/8 items-center justify-center">
            <X className="w-5 h-5" />
          </button>
        </div>

        {/* Categoria: botoes coloridos, um toque escolhe */}
        <div>
          <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">O que é?</label>
          <div className="flex flex-wrap gap-2">
            {categories.map(c => {
              const on = f.categoryId === c.id;
              const KIc = c.kind === 'post' ? Send : null;
              return (
                <button key={c.id} type="button" onClick={() => set('categoryId', on ? null : c.id)}
                  className={`mm-tap inline-flex items-center gap-2 px-3 py-2 rounded-xl text-sm font-medium border-2 transition-all ${c.kind === 'post' && !on ? 'border-dashed' : ''}`}
                  style={on
                    ? { background: c.color, color: agInk(c.color), borderColor: c.color }
                    : { borderColor: c.kind === 'post' ? c.color : 'var(--border-strong)' }}>
                  {on ? <Check className="w-3.5 h-3.5" /> : (KIc ? <KIc className="w-3.5 h-3.5" style={{ color: agTextColor(c.color) }} /> : <span className="w-2.5 h-2.5 rounded-full" style={{ background: c.color }} />)}
                  <span className={on ? '' : 'text-zinc-200'}>{c.name}</span>
                </button>
              );
            })}
            {categories.length === 0 && <p className="text-sm text-zinc-400">Nenhuma categoria ainda. Crie em “Categorias”.</p>}
          </div>
        </div>

        <Input label="Título" placeholder={isPost ? 'Ex: Arte do culto de domingo' : (cat ? `Ex: ${cat.name} do domingo` : 'Ex: Gravação do louvor')} value={f.title} onChange={e => set('title', e.target.value)} autoFocus={isNew} />

        {isPost ? (
          <div className="grid grid-cols-2 gap-3">
            <Input label="Dia da postagem" type="date" value={f.date} onChange={e => set('date', e.target.value)} />
            <Input label="Horário" type="time" value={f.startTime} onChange={e => set('startTime', e.target.value)} />
          </div>
        ) : (
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <Input label="Dia" type="date" value={f.date} onChange={e => set('date', e.target.value)} />
            <Input label="Início" type="time" value={f.startTime} onChange={e => set('startTime', e.target.value)} />
            <Input label="Fim" type="time" value={f.endTime} onChange={e => set('endTime', e.target.value)} />
          </div>
        )}

        <div>
          <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">
            {isPost ? 'Quem cuida da postagem' : 'Responsáveis'} <span className="normal-case tracking-normal font-normal text-zinc-500">(aparece o nome no calendário)</span>
          </label>
          <AgPeoplePicker options={people} value={f.people} onChange={v => set('people', v)} />
        </div>

        <Textarea label={isPost ? 'Legenda / ideia' : 'Descrição / ideia'} rows={4}
          placeholder={isPost ? 'Texto da legenda, hashtags, referência…' : 'Roteiro, ideia pro culto, quem participa, o que levar…'}
          value={f.description} onChange={e => set('description', e.target.value)} />

        {/* Links */}
        <div>
          <div className="flex items-center justify-between mb-2">
            <label className="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Links</label>
            <button type="button" onClick={() => set('links', [...(f.links || []), { label: '', url: '' }])}
              className="mm-tap text-sm text-brand-300 hover:text-brand-200 inline-flex items-center gap-1 font-medium">
              <Plus className="w-4 h-4" /> Adicionar link
            </button>
          </div>
          <div className="space-y-2">
            {(f.links || []).map((l, i) => (
              <div key={i} className="flex gap-2">
                <input className="mm-input rounded-xl px-3 py-2.5 text-sm w-1/3 min-w-0" placeholder="Nome (opcional)" value={l.label}
                  onChange={e => set('links', f.links.map((x, j) => j === i ? { ...x, label: e.target.value } : x))} />
                <input className="mm-input rounded-xl px-3 py-2.5 text-sm flex-1 min-w-0" placeholder="https://…" inputMode="url" value={l.url}
                  onChange={e => set('links', f.links.map((x, j) => j === i ? { ...x, url: e.target.value } : x))} />
                <button type="button" aria-label="Remover link" onClick={() => set('links', f.links.filter((_, j) => j !== i))}
                  className="mm-tap px-2 rounded-xl text-zinc-400 hover:text-rose-500 hover:bg-rose-500/10 flex items-center justify-center">
                  <X className="w-4 h-4" />
                </button>
              </div>
            ))}
            {!(f.links || []).length && <p className="text-sm text-zinc-500">Roteiro no Docs, referência no Instagram, pasta do Drive…</p>}
          </div>
        </div>

        {/* Arquivos */}
        <div>
          <label className="block text-xs font-semibold text-zinc-300 uppercase tracking-wider mb-2">Documentos e arquivos</label>
          <label className="mm-tap mm-dropzone flex items-center justify-center gap-2 rounded-xl border border-dashed border-white/20 px-4 py-4 text-sm text-zinc-300 cursor-pointer hover:border-brand-400/60">
            <Upload className="w-4 h-4" /> Escolher arquivos (até 50 MB cada)
            <input type="file" multiple className="hidden" onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
          </label>
          <div className="mt-2 space-y-1.5">
            {uploads.map(u => (
              <div key={u.key} className="flex items-center gap-2 text-sm text-zinc-300 px-3 py-2 rounded-xl bg-white/5">
                <Loader2 className="w-4 h-4 animate-spin flex-shrink-0" />
                <span className="truncate flex-1">{u.name}</span>
                <span className="text-xs text-zinc-500">{Math.round((u.p || 0) * 100)}%</span>
              </div>
            ))}
            {(f.files || []).map((file, i) => (
              <div key={file.id || i} className="flex items-center gap-2 text-sm px-3 py-2 rounded-xl bg-white/5">
                <Paperclip className="w-4 h-4 text-zinc-400 flex-shrink-0" />
                <a href={file.url} target="_blank" rel="noreferrer" className="truncate flex-1 text-zinc-100 hover:underline">{file.name}</a>
                <span className="text-xs text-zinc-500 hidden sm:inline">{formatSize(file.size)}</span>
                <button type="button" aria-label="Remover arquivo" onClick={() => set('files', f.files.filter((_, j) => j !== i))}
                  className="mm-tap -my-1 px-1.5 rounded-lg text-zinc-400 hover:text-rose-500 flex items-center justify-center">
                  <X className="w-4 h-4" />
                </button>
              </div>
            ))}
          </div>
        </div>

        <div className="flex flex-col-reverse sm:flex-row sm:items-center gap-2 pt-2">
          {!isNew && (
            <Button type="button" variant="danger" onClick={() => onDelete(item)} className="sm:mr-auto">
              <Trash2 className="w-4 h-4" /> Apagar
            </Button>
          )}
          <Button type="button" variant="ghost" onClick={onClose} className={isNew ? 'sm:ml-auto' : ''}>Cancelar</Button>
          <Button type="submit" disabled={saving}>
            {saving ? <Loader2 className="w-4 h-4 animate-spin" /> : <Check className="w-4 h-4" />}
            {isNew ? 'Adicionar' : 'Salvar'}
          </Button>
        </div>
      </form>
    </Modal>
  );
};

const AgendaCategoriesModal = ({ categories, onClose, onCreate, onUpdate, onDelete }) => {
  const toast = useToast();
  const [name, setName] = useState('');
  const [color, setColor] = useState(AG_PALETTE[categories.length % AG_PALETTE.length]);
  const [kind, setKind] = useState('evento');
  const [busy, setBusy] = useState(false);

  const create = async (e) => {
    e.preventDefault();
    const n = name.trim();
    if (!n) return;
    if (categories.some(c => c.name.toLowerCase() === n.toLowerCase())) { toast.error('Já existe uma categoria com esse nome.'); return; }
    setBusy(true);
    try {
      await onCreate({ name: n, color, kind, position: categories.length + 1 });
      setName('');
      setColor(AG_PALETTE[(categories.length + 1) % AG_PALETTE.length]);
    } catch (err) { toast.error(agDbHint(err)); }
    finally { setBusy(false); }
  };

  return (
    <Modal open onClose={onClose} size="sm">
      <div className="p-5 sm:p-6 space-y-5">
        <div>
          <p className="mm-eyebrow">Agenda de conteúdo</p>
          <h2 className="font-serif text-2xl text-zinc-50 mt-1">Categorias</h2>
          <p className="text-sm text-zinc-400 mt-1">Cada categoria tem uma cor e um tipo. “Post” usa um horário só e aparece diferente no calendário.</p>

          <div className="grid grid-cols-2 gap-2">

              const Ic = k.icon;

                <button key={k.value} type="button" onClick={() => setKind(k.value)}
                  className={`mm-tap rounded-xl border-2 px-3 py-2.5 text-left transition-colors ${on ? 'border-[var(--brand)] bg-brand-500/10' : 'border-white/10 hover:border-white/20'}`}>
                  <div className="flex items-center gap-1.5 text-sm font-semibold text-zinc-100"><Ic className="w-4 h-4" />{k.label}</div>
                  <div className="text-[11px] text-zinc-400 mt-0.5">{k.hint}</div>
                </button>
              );
            })}
          </div>
          <div className="flex flex-wrap items-center gap-2">
            {AG_PALETTE.map(c => (
              <button key={c} type="button" aria-label={`Cor ${c}`} onClick={() => setColor(c)}
                className="w-8 h-8 rounded-full border-2 transition-transform"
                style={{ background: c, borderColor: color === c ? 'var(--text-primary)' : 'transparent', transform: color === c ? 'scale(1.1)' : 'none' }} />
            ))}
            <label className="w-8 h-8 rounded-full border border-dashed border-white/30 flex items-center justify-center cursor-pointer overflow-hidden relative" title="Outra cor">
              <Palette className="w-4 h-4 text-zinc-400" />
              <input type="color" value={color} onChange={e => setColor(e.target.value)} className="absolute inset-0 opacity-0 cursor-pointer" />
            </label>
          </div>
          <Button type="submit" disabled={busy || !name.trim()} className="w-full">
            <Plus className="w-4 h-4" /> Criar categoria
          </Button>
        </form>

        <div className="space-y-2">
          {categories.map(c => (
            <div key={c.id} className="flex items-center gap-2 rounded-xl border border-white/10 px-2 py-1.5">
              <label className="relative w-8 h-8 rounded-lg flex-shrink-0 cursor-pointer" style={{ background: c.color }} title="Trocar cor">
                <input type="color" value={c.color} onChange={e => onUpdate({ ...c, color: e.target.value })} className="absolute inset-0 opacity-0 cursor-pointer" />
              </label>
              <input defaultValue={c.name} aria-label="Nome da categoria"
                onBlur={e => { const v = e.target.value.trim(); if (v && v !== c.name) onUpdate({ ...c, name: v }); else e.target.value = c.name; }}
                className="flex-1 min-w-0 bg-transparent text-sm text-zinc-100 px-2 py-2 rounded-lg focus:outline-none focus:bg-white/5" />
              <button type="button" onClick={() => onUpdate({ ...c, kind: c.kind === 'post' ? 'evento' : 'post' })}
                title="Trocar tipo" className="mm-tap text-[11px] font-semibold px-2 py-1.5 rounded-lg border border-white/12 text-zinc-300 hover:bg-white/8 inline-flex items-center gap-1 flex-shrink-0">
                {c.kind === 'post' ? <><Send className="w-3 h-3" /> Post</> : <><Video className="w-3 h-3" /> Evento</>}
              </button>
              <button type="button" aria-label={`Apagar ${c.name}`} onClick={() => onDelete(c)}
                className="mm-tap p-2 rounded-lg text-zinc-400 hover:text-rose-500 hover:bg-rose-500/10 flex items-center justify-center">
                <Trash2 className="w-4 h-4" />
              </button>
            </div>
          ))}
        </div>
        <Button variant="secondary" onClick={onClose} className="w-full">Pronto</Button>
      </div>
    </Modal>
  );
};
